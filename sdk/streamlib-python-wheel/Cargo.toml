# The importable wheel: CPython imports this cdylib and drives the engine from
# the app's own process. The inverted arrangement (a Rust binary embedding
# CPython) was the #1702 spike's shape and is not what ships.

[package]
name = "streamlib-python-wheel"
version.workspace = true
edition.workspace = true
authors.workspace = true
# The SPDX identifier rather than the workspace's `license-file`: maturin
# refuses a license file outside the project root, and the repo LICENSE sits
# four levels up. Same license, declared inline.
license = "BUSL-1.1"
repository.workspace = true
description = "streamlib — the importable Python wheel: the app imports the engine and authors pipelines against it"
publish = false

[lib]
# The extension module lands at `streamlib._engine`, so the cdylib maturin picks
# up must be named `_engine`. `rlib` rides alongside so the crate's own Rust
# tests build against a normal interpreter link.
name = "_engine"
crate-type = ["cdylib", "rlib"]

[features]
# Off by default so `cargo test` links libpython; maturin turns it on for the
# wheel build, where the symbols resolve against the host interpreter instead.
extension-module = ["pyo3/extension-module"]

[dependencies]
# 0.29 is the first release with the `attach`/`detach` naming; 0.28 and earlier
# spell these `Python::with_gil` / `py.allow_threads`, which were REMOVED rather
# than deprecated. `abi3-py310` builds one wheel for CPython 3.10 and every
# later GIL-enabled release — free-threaded builds wait for a stable ABI to
# exist for them.
pyo3 = { version = "0.29.0", features = ["abi3-py310"] }

streamlib = { path = "../streamlib-sdk", version = "0.18.60" }

# The one control plane, hosted in-process by a runtime that enables it
# (`rt.host_control_plane(...)`) — what makes a Python-launched app show up in
# `streamlib nodes` and answer `graph` / `tap`. Path-only: the api-server is
# `publish = false` and never enters the registry closure.
streamlib-api-server = { path = "../../runtime/streamlib-api-server" }

# The native media built-ins the wheel exports as pre-built named blocks
# (`rt.add(TestPatternSource)`), statically linked so they are current by
# construction.
streamlib-media-builtins = { path = "../../runtime/streamlib-media-builtins", version = "0.18.60" }

# The workspace's single DLPack home: the `#[repr(C)]` v0.8 ABI mirrors, the
# managed-tensor builders, and the layout regression test that pins them. The
# pixel-exchange surface builds its capsules here rather than growing a second
# copy of the spec — the CUDA half of the same adapter is what the device-memory
# export path uses.
streamlib-adapter-cuda = { path = "../../adapters/streamlib-adapter-cuda", version = "0.18.60" }

# The bag's value tree. A bag crosses into Python as ordinary Python data, and
# `rmpv`'s native `bin` variant is what keeps a byte payload from decoding as
# text on the way through.
rmpv = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The bag wire format the harness endpoints decode.
rmp-serde = { workspace = true }
tracing = { workspace = true }

# Raw CLOCK_MONOTONIC + timerfd: the wheel's clock contract is the kernel's
# monotonic epoch (comparable to `time.clock_gettime_ns(time.CLOCK_MONOTONIC)`),
# which std does not expose. Also the fd ownership the CUDA import path needs.
libc = { workspace = true }
# Guards the lifecycle-scoped context leases; non-poisoning, so a panicking
# hook cannot wedge every later lease install.
parking_lot = "0.12"

# The CUDA import half of the pixel exchange. Depended on unconditionally on
# Linux rather than behind a feature: `fallback-dynamic-loading` means
# `libcuda.so` is dlopen'd at first use, never linked, so a machine without an
# NVIDIA driver gets a clean "no CUDA driver" refusal instead of a wheel that
# fails to load. That is the plan's portability model, and the shape
# the wheel already ships.
[target.'cfg(target_os = "linux")'.dependencies]
cudarc = { workspace = true }

# The helper child's half of the pixel exchange: the SCM_RIGHTS client that
# checks a surface out of the parent's surface-share service, and the
# consumer-side Vulkan import that turns its DMA-BUF plane fds into mapped
# memory. Both already ride in the binary via the engine; named here so the
# wheel can call them.
streamlib-surface-client = { path = "../../runtime/streamlib-surface-client", version = "0.18.60" }
streamlib-consumer-rhi = { path = "../../runtime/streamlib-consumer-rhi", version = "0.18.60" }

[lints]
workspace = true
