[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "streamlib"
# Tracks [workspace.package].version in the root Cargo.toml — the plan's "two
# artifacts, one version, released together". release-please bumps this file
# through its `extra-files` list, so the wheel and the crate never drift.
version = "0.18.43"
description = "StreamLib — a realtime streaming engine with Python authoring"
# abi3-py310 in Cargo.toml is the binding half of this floor; the two move
# together or the wheel claims interpreters its ABI tag does not cover.
requires-python = ">=3.10"
license = { text = "BUSL-1.1" }
# PEP 639. What lands in `.dist-info/licenses/`, which is the only way a wheel
# discharges the reproduce-the-notice terms it ships under: `LICENSE` for our
# own, `THIRD-PARTY-NOTICES.md` for every dependency's. The SPDX id above says
# BUSL-1.1 and nothing about who the Licensor is or when the Change Date falls
# — the parameters are the licence, so the text has to travel too.
#
# Both are symlinks to the repo root. maturin refuses a licence file outside
# the project root (see Cargo.toml) but follows one that resolves out of it, so
# the root file stays the single copy and there is no second one to drift.
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md"]
authors = [{ name = "Jonathan Fontanez", email = "fontanezj1@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# pip owns PATH: installing the wheel is what puts `streamlib` on it. There is
# no second artifact to install and no shell setup step.
[project.scripts]
streamlib = "streamlib.cli:main"

[project.optional-dependencies]
# numpy and torch are test-and-types dependencies, not runtime ones — the
# wheel itself never imports either; the exchange surface hands frames to
# whichever consumer the user installed. pydantic is the same: `read(port,
# into=T)` constructs whatever target it is handed and names no library, so
# pydantic is here to prove that a model is one of them.
dev = [
    "pytest>=7.0",
    "numpy>=2.1",
    "torch>=2.0",
    "pydantic>=2.0",
    # `assert_type` at the 3.10 floor, and the stub's own `disjoint_base`.
    "typing_extensions>=4.6",
]

[tool.pytest.ini_options]
markers = [
    # `Runner::start()` initializes a GPU context, and the engine's DMA-BUF
    # pool pre-warm needs a driver that can actually allocate exportable
    # device memory. A software rasterizer (lavapipe) cannot, so a GPU-less
    # runner deselects these with `-m "not requires_gpu"`.
    "requires_gpu: needs a Vulkan device that can allocate exportable DMA-BUF memory",
]

[tool.maturin]
python-source = "python"
module-name = "streamlib._engine"
features = ["extension-module"]
# A local `maturin develop` leaves compiled bytecode next to the sources,
# and maturin globs the directory — without this an incremental build ships
# one interpreter's stale `.pyc` files inside an abi3 wheel.
exclude = ["**/__pycache__/**"]

[tool.pyright]
# The wheel's Python half, checked at the version floor rather than whatever
# interpreter the venv happens to be — `requires-python` is the promise.
include = ["python", "tests"]
# The package is checked from source, not from an install, so `tests/` needs
# the package root on the search path. Without it a checkout that has not run
# `maturin develop` reports every `import streamlib` unresolved — which is
# precisely the state the no-build job runs in.
extraPaths = ["python"]
pythonVersion = "3.10"
# Standard rather than strict: strict turns on `reportPrivateUsage`, which
# fights the `_engine` / `_NativeRuntime` shape this package is built on, and
# demands annotations on every pytest fixture parameter.
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
# The engine module is a compiled artifact, so a checkout has the stub and
# not the `.so` it describes. That is the intended shape here, not a gap —
# `mypy.stubtest` is what checks the stub against the real binary.
reportMissingModuleSource = "none"
