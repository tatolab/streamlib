[package]
name = "streamlib-processor-schema"
description = "Processor schema types and YAML parser shared between the streamlib runtime and streamlib-macros"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }  # used by schemars for enum_values literals
serde_yaml = { workspace = true }
thiserror = { workspace = true }
schemars = "0.8"  # JsonSchema impls on the processor-schema and descriptor types
# Host-only OpenAPI schema derive for the wire-facing types, behind the
# off-by-default `utoipa` feature. The engine's API layer enables it; a
# consumer built engine-free never compiles it.
utoipa = { version = "5.3", optional = true }

[features]
# Adds a `utoipa::ToSchema` derive to the types the control plane renders —
# `ProcessorClassImportPath` and the window contract — for host-side OpenAPI
# generation. Off by default so the engine-free authoring chain carries no
# OpenAPI machinery.
utoipa = ["dep:utoipa"]

[dev-dependencies]
rmp-serde = { workspace = true }

[lints]
workspace = true
