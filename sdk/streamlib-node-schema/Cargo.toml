[package]
name = "streamlib-node-schema"
description = "Node schema types shared between the streamlib runtime and streamlib-macros"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }  # used by schemars for enum_values literals
thiserror = { workspace = true }
unicode-normalization = { workspace = true }  # NFKD + combining-mark test the exposed-name cast drops accents with
schemars = { version = "1.2", features = ["uuid1"] }  # JsonSchema impls on the node-schema and descriptor types, which the control contract renders
uuid = { version = "1.11", features = ["serde"] }  # an Asset pin's stored value names its asset by UUID

[dev-dependencies]
rmp-serde = { workspace = true }

[lints]
workspace = true
