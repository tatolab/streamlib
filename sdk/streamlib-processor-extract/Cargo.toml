[package]
name = "streamlib-processor-extract"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true

[dependencies]
# The `#[processor(...)]` attribute grammar lives here (not in the proc-macro
# crate) so BOTH the macro AND the source-scan extractor parse it through the
# exact same parser — one grammar, never two. A `proc-macro = true` crate can
# only export proc-macros, so the grammar cannot be shared from there.
syn = { version = "2.0", features = ["full", "extra-traits"] }
proc-macro2 = "1.0"
# Renders a mirrored `#[cfg(...)]` predicate back to source text for the
# generated crate root — `syn`'s own `ToTokens` impls live behind this crate.
quote = "1.0"
toml = { workspace = true }

streamlib-idents = { path = "../streamlib-idents", version = "0.10.1" }
streamlib-processor-schema = { path = "../streamlib-processor-schema", version = "0.10.1" }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
serde_yaml = { workspace = true }
# The scan's prune diagnostics are asserted on, not just logged — a captured
# subscriber is what makes a `tracing::warn!` a testable contract.
tracing-subscriber = { workspace = true }

[lints]
workspace = true
