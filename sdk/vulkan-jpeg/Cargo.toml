[package]
name = "vulkan-jpeg"
version.workspace = true
edition = "2024"
authors.workspace = true
license-file.workspace = true
repository.workspace = true
description = "JPEG decode for streamlib — CPU parser + Huffman entropy decode + fused Vulkan compute kernel (dequant + IDCT + chroma upsample + YCbCr->RGB)"

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
bytemuck = { version = "1.16", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The streamlib facade — provides the FullAccess GPU surface the Vulkan-compute
# backend builds against (VulkanComputeKernel, StorageBuffer, TextureRing,
# ComputeKernelDescriptor, the color-math types, and the GpuContextFullAccess
# view) under `streamlib::sdk::*` and its `sdk::engine::host_rhi` tier.
streamlib = { path = "../streamlib-sdk", version = "0.18.46" }

[dev-dependencies]
jpeg-encoder = "0.6"
zune-jpeg = "0.4"

[lints]
workspace = true
