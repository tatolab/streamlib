[package]
name = "moq-gateway-test-subscriber"
version = "0.1.0"
edition = "2024"
license = "BUSL-1.1"
publish = false
description = "MoQ gateway fixture: subscribe to one MoQ gateway track, open the SLE1 envelope and parse what it carries, independently of the engine."

[dependencies]
# crates.io's upstream draft-16 moq-transport, not the engine's vendored copy:
# this subscriber exists to check the gateway against an independent reader.
moq-transport = "=0.16.2"
web-transport = "0.10.9"
quinn = "0.11.11"
rustls = { version = "0.23.43", features = ["ring"] }
rustls-native-certs = "0.8.4"
url = "2.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
aes-gcm = "0.10.3"
base64 = "0.22"
rmpv = "1.3"
serde_json = "1"
bytes = "1"

# Its own workspace root: fixture tooling, never a member of the engine workspace.
[workspace]
