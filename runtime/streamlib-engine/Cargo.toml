[package]
name = "streamlib-engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
description = "Engine internals for streamlib (RHI, IPC, surface-share, runtime executor). Customer apps depend on `streamlib` (the SDK), not on this crate directly."
keywords = ["video", "streaming", "gpu", "real-time", "ai"]
categories = ["multimedia::video", "multimedia", "api-bindings"]

[lib]
name = "streamlib_engine"
crate-type = ["rlib"]

[features]
default = []
# Strip `debug!` (and `trace!`) from release builds. Opt-in per deployment
# image. `warn!` / `error!` / `info!` are never stripped. See docs/logging.md.
strip_debug_logging = ["tracing/release_max_level_info"]
# Tier 2 — hardware-integration tests (`#[cfg_attr(not(feature =
# "hardware-tests"), ignore)]` on tests that construct a real
# `HostVulkanDevice`). Default `cargo test` is the tier-1 unit gate
# (parallel-safe, mocked). To run hardware tests:
#   cargo test --features streamlib/hardware-tests --workspace -- --test-threads=1
# See `docs/testing-hardware.md`.
hardware-tests = []

# In-memory constructors for engine primitives (e.g. `TapSubscription`) that
# normally require a live iceoryx2 channel, so a downstream consumer (the
# api-server tap tools) can be tested without one. Default-off; enabled only by
# a consumer's `[dev-dependencies]`, so it is physically excluded from a
# production build's dependency graph.
test-support = []

# Codec-layer debug knob (`vulkan/video/codec_utils/vk_buffer_resource.rs`):
# zero out bitstream buffers when (re)allocating, to make NAL-parser bugs
# easier to spot in raw memory. Off by default; opt-in for nvpro-style
# debugging only. Inherited from the former libs/vulkan-video crate's
# feature set; intent kept identical post-fold.
clear_bitstream_buffers_on_create = []

[dependencies]
# Processor schema types (shared with macros for code generation)
streamlib-processor-schema = { path = "../../sdk/streamlib-processor-schema", version = "0.26.19", features = ["utoipa"] }

# Canonical Error / Result / PortDirection, shared with the plugin-SDK so
# plugin cdylibs author against them without linking the engine. The engine
# re-exports them at `core::error`.
streamlib-error = { path = "../../sdk/streamlib-error", version = "0.26.19" }

# Procedural macros
streamlib-macros = { path = "../../sdk/streamlib-macros", version = "0.26.19" }

# Plugin ABI wire-protocol header. Dep direction reversed in #877:
# streamlib-plugin-abi no longer depends on streamlib (the SDK), so the
# cyclic dep this dep used to dodge (engine → plugin-abi → sdk → engine)
# is gone. The engine's dlopen loader uses `PluginDeclaration` and
# `STREAMLIB_ABI_VERSION` from this crate directly.

# Shared iceoryx2 payload types (for cross-process IPC)
streamlib-ipc-types = { path = "../streamlib-ipc-types", version = "0.26.19" }

# Consumer-side carve-out — owns the format primitives
# (TextureFormat / TextureUsages / PixelFormat), the trait machinery
# (VulkanRhiDevice, DevicePrivilege, *Like, ConsumerMarker), the
# Consumer* RHI types (Linux), and a slim ConsumerRhiError. streamlib
# re-exports the primitives so existing in-tree call sites (e.g.
# `crate::core::rhi::TextureFormat`) keep working unchanged.
streamlib-consumer-rhi = { path = "../streamlib-consumer-rhi", version = "0.26.19" }

# Core dependencies (always included)
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "sync"] }
crossbeam-channel = "0.5"
inventory = "0.3"
parking_lot = "0.12"  # Fast mutexes for all synchronization
crossbeam-queue = "0.3"  # Lock-free MPMC queue for thread-safe mailboxes
iceoryx2 = "0.9.3"  # Zero-copy IPC pub/sub for cross-process communication
iceoryx2-log = "0.9.3"  # Bridge iceoryx2's internal log records into streamlib tracing
rmp-serde = "1.3"  # MessagePack serialization for frame payloads
rmp.workspace = true  # Raw msgpack markers: the egress walk over a bag's top-level keys
serde_bytes.workspace = true  # `samples` rides the wire as msgpack `bin`, not an array
rubato.workspace = true  # Resampler behind the audio window contract's read-side stage
signal-hook = "0.3"  # Native signal handling (SIGTERM, SIGINT) for event bus
ctrlc = "3.4"  # Cross-platform Ctrl+C handler (works with GUI apps)
petgraph = "0.8.3"  # Directed graph for GraphOptimizer topology analysis
ahash = "0.8"  # Fast hashing for graph checksum computation
anymap2 = "0.13"  # TypeMap for embedded component storage on graph weights
cuid2 = "0.1"  # Collision-resistant unique identifiers for processor/link IDs
uuid = { version = "1.11", features = ["v4"] }  # UUID generation for PixelBufferPoolId
dirs = "6.0"   # Cross-platform home directory resolution
libloading = "0.8"  # Dynamic library loading for Rust dylib plugins
sha2.workspace = true  # SHA-256 hashing (escalate content hashing)
dotenvy = "0.15"  # Load .env files for development environment
# The runtime mesh's transport: one session per runtime, beside iceoryx2. The
# only crate in the tree that names it.
#
# `default-features = false` because the defaults turn on TLS, WebSocket,
# compression, multilink and both authentication schemes, none of which this
# mesh uses — and `transport_multilink` in particular would let two peers keep
# more than one link, which is the thing the QUIC-only listener exists to avoid.
# TCP stays pinnable by endpoint for a network that blocks UDP; `?rel=1` QUIC
# over UDP ships inside `transport_udp`. TLS `quic/` needs a provisioned key and
# certificate, so it waits for the security milestone.
zenoh = { version = "1.10.1", default-features = false, features = [
    "transport_tcp",
    "transport_udp",
] }

# Serialization
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
toml.workspace = true
schemars = "0.8"  # JSON Schema generation from Rust types


# OpenAPI schema derives on the JSON wire types in `core/json_schema.rs`.
utoipa = { version = "5.3", features = ["axum_extras"] }

# PNG encoding for the control plane's `exchange` verb (surface id in,
# image bytes out) and decoding for shader-output fixture comparisons.
# Pure Rust end to end (miniz_oxide / fdeflate), so it links nothing the
# wheel's portability contract forbids.
png = "0.17"

# Platform-specific: macOS/iOS
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2.workspace = true
objc2-metal.workspace = true
objc2-io-surface.workspace = true
objc2-core-foundation.workspace = true
objc2-foundation.workspace = true
objc2-av-foundation = { workspace = true, features = ["objc2-core-media", "objc2-core-video"] }
# The capture arm's sample buffers, their pixel buffers' IOSurfaces and colour
# attachments, and the host clock their stamps convert to.
objc2-core-media.workspace = true
objc2-core-video = { workspace = true, features = ["objc2-io-surface"] }
# The completion handler camera authorization answers through.
block2 = "0.6"
objc2-app-kit.workspace = true
objc2-quartz-core.workspace = true
objc2-core-text.workspace = true
objc2-core-graphics.workspace = true
libc.workspace = true

# Apple-specific crates
dispatch2 = "0.3"  # GCD dispatch queues
mach2 = "0.7"  # Mach kernel API: thread priorities, timing, and the surface-share channel
# Wire-format helpers for the per-runtime surface-share service's raw Mach
# channel, shared with the helper-process clients that talk to it.
streamlib-surface-client = { path = "../streamlib-surface-client", version = "0.26.19" }

# The one RHI and everything that compiles with it. Not workspace-wide: a
# workspace-wide entry would make a Windows or wasm target build a GPU stack
# and a C++ toolchain neither has a consumer for.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
vulkanalia = { workspace = true }
vulkanalia-vma = { workspace = true }
rspirv-reflect = { workspace = true }
shaderc = { workspace = true }
winit = "0.30"  # Window creation and event loop for display processor
raw-window-handle = "0.6"  # Raw window handle types for Vulkan surface creation
# Consumer-side carve-out — defines the trait machinery
# (VulkanRhiDevice, DevicePrivilege, *Like, ConsumerMarker), the
# Consumer* RHI types, and the format/error primitives shared with the
# host side. streamlib re-exports for in-tree consumers; subprocess
# cdylibs depend on it directly so the FullAccess capability boundary
# is enforced by the type system.
streamlib-consumer-rhi = { path = "../streamlib-consumer-rhi", version = "0.26.19" }

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
# rtkit (RealtimeKit) D-Bus client for unprivileged SCHED_FIFO / nice
# priority elevation on Linux. PipeWire / PulseAudio / JACK use the
# same path. Without it, `pthread_setschedparam(SCHED_FIFO|RR, ...)`
# fails with EPERM on every desktop process; rtkit-daemon does the
# privileged syscall on the requesting thread's behalf.
zbus = "5"
# Wire-format helpers for the per-runtime surface-sharing socket.
streamlib-surface-client = { path = "../streamlib-surface-client", version = "0.26.19" }
# The video device seam's V4L2 arm: device enumeration, format negotiation and
# the mmap capture stream. A kernel ABI binding — no user-space library is
# linked, so the wheel's `DT_NEEDED` set does not grow.
v4l = "0.14"

[dev-dependencies]
# Self-alias via the SDK so engine tests / benches that use
# `#[streamlib::processor(...)]` resolve macro-emitted `::streamlib::*`
# paths through the SDK (which transitively re-exports engine items).
# Dev-dep cycles are permitted by Cargo because they don't propagate.
streamlib = { path = "../../sdk/streamlib-sdk" }
# The codec built-ins the `codec_roundtrip_rig` example wires into a graph.
# Same permitted dev-dep cycle as the self-alias above: built-ins depend on
# the SDK, which re-exports this crate.
streamlib-media-builtins = { path = "../streamlib-media-builtins" }
# The control plane the `codec_roundtrip_rig` example hosts, so a rig run is
# reachable by `streamlib graph` / `tap` / `exchange` — the observation
# surface the codec proof is scored on. Same permitted dev-dep cycle.
streamlib-api-server = { path = "../streamlib-api-server" }
tokio = { workspace = true, features = ["full"] }
hound = "3.5"  # WAV file writing for examples
# The `codec_roundtrip_rig` example demuxes an `Mp4Sink` recording back into
# access units for its decode-back arm. Same pin the sink and `mp4-inspect`
# hold, so the arm reads what the writer wrote.
mp4-atom = "0.15"
serial_test = "3.2"  # Run tests sequentially to avoid global PUBSUB interference
tempfile = "3.14"  # Temporary directories for logging and runtime tests
criterion = { version = "0.5", features = ["html_reports"] }  # Benches for logging hot path (#447)
trybuild = "1.0.121"
# The real key-expression rules the mesh address grammar is checked against, so
# the engine's own validator is graded by Zenoh rather than by a second reading
# of the spec. Named directly rather than reached through `zenoh` because the
# grammar test wants `keyexpr`'s `internal` chunk inspection, which the facade
# does not re-export.
zenoh-keyexpr = { version = "1.10.1", features = ["internal"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# `testing::SubprocessCrashHarness` — drives a real subprocess crash against
# the surface-share service. Tests only: the engine's library code carries no
# surface-adapter types.
streamlib-surface-adapter = { path = "../../adapters/streamlib-surface-adapter", version = "0.26.19" }

[[bench]]
name = "logging"
harness = false

[[bench]]
name = "output_writer_ffi_hop"
harness = false

# The engine-owned codec round-trip rig: fixture source or camera → H.264
# encode → H.264 decode → display. Rig-only to run (Vulkan Video queues, a
# display server, optionally a /dev/video* device); CI compiles it so it
# cannot rot between rig runs.
[[example]]
name = "codec_roundtrip_rig"
path = "examples/codec_roundtrip_rig.rs"

[[bin]]
name = "log_emit_1000"
path = "tests/bin/log_emit_1000.rs"

# One runtime on a mesh in its own process, driven by the
# `runtime_mesh_two_processes` integration test. A `[[bin]]` rather than a
# helper module because the mesh is between processes by construction, and
# `CARGO_BIN_EXE_*` is how a test reaches a second one.
[[bin]]
name = "runtime_mesh_peer"
path = "tests/bin/runtime_mesh_peer.rs"

# The two-process mesh proof. Named in `.github/workflows/test.yml`'s engine
# slice and the `run_local_ci_gates` mirror, or it runs nowhere.
[[test]]
name = "runtime_mesh_two_processes"
path = "tests/runtime_mesh_two_processes.rs"

# One end of a cross-runtime link in its own process, driven by the
# `cross_runtime_links_two_processes` integration test. CI has no GPU, so it
# stands a runtime's mesh half up without a `Runner`.
[[bin]]
name = "cross_runtime_link_peer"
path = "tests/bin/cross_runtime_link_peer.rs"

# The two-process cross-runtime-link proof. Named in
# `.github/workflows/test.yml`'s engine slice and the `run_local_ci_gates`
# mirror, or it runs nowhere.
[[test]]
name = "cross_runtime_links_two_processes"
path = "tests/cross_runtime_links_two_processes.rs"

# One runtime asking for, or answering, a link request, driven by the
# `cross_runtime_link_requests_two_processes` test. Unlike the peer above it
# builds a real `Runner` — a request is applied through `connect`, so there has
# to be a graph to apply it into — and never starts it, which is what keeps it
# GPU-free.
[[bin]]
name = "cross_runtime_link_request_peer"
path = "tests/bin/cross_runtime_link_request_peer.rs"

# The link-request proof: push, third-party wiring, refusal, silence, cancel
# and disconnect across the mesh. Named in `.github/workflows/test.yml`'s
# engine slice and the `run_local_ci_gates` mirror, or it runs nowhere.
[[test]]
name = "cross_runtime_link_requests_two_processes"
path = "tests/cross_runtime_link_requests_two_processes.rs"
# A processor-owned window presented while the process's first thread drives
# the window event pump. `harness = false` because AppKit lets only the first
# thread drive the loop and libtest never runs a test there; display tier, so it
# builds only under `hardware-tests`. Its `main` is empty off Apple.
[[test]]
name = "processor_owned_window_on_the_first_thread"
path = "tests/processor_owned_window_on_the_first_thread.rs"
harness = false
required-features = ["hardware-tests"]
# The AVFoundation arm capturing from a real camera through the video device
# seam. Rig tier — a camera, the GPU, and camera access allowed for the
# terminal running it — so it builds only under `hardware-tests`. Empty off
# Apple.
[[test]]
name = "avfoundation_camera_captures_through_the_video_device_seam"
path = "tests/avfoundation_camera_captures_through_the_video_device_seam.rs"
required-features = ["hardware-tests"]

# Strace-backed no-syscalls test child. Built under `cargo test` via
# the path dep; not needed for normal builds.

[[bin]]
name = "surface_share_crash_helper"
path = "tests/bin/surface_share_crash_helper.rs"
# Subprocess fixture for the EPOLLHUP watchdog integration test
# (runtime/streamlib-engine/tests/surface_share_subprocess_crash.rs). Linux only.
required-features = []

# Helper process for the raw-Mach surface-share integration test: reads and
# edits a surface the engine shares, holds one to be killed, or plays the
# engine a helper outlives. Empty off macOS.
[[bin]]
name = "surface_share_mach_helper"
path = "tests/bin/surface_share_mach_helper.rs"

# The raw-Mach surface-share proof across processes. No GPU, so it runs on the
# macOS CI runner; named in `.github/workflows/test.yml`'s macOS job.
[[test]]
name = "surface_share_over_raw_mach"
path = "tests/surface_share_over_raw_mach.rs"

# The helper process the cross-process timeline test spawns: imports a
# surface's timeline pair as Metal shared events. Empty off macOS.
[[bin]]
name = "metal_shared_event_timeline_helper"
path = "tests/bin/metal_shared_event_timeline_helper.rs"

# The cross-process timeline pair across real processes: shared-event
# ordering, the host-side fallback, and a stalled helper that never costs the
# engine its device. Needs MoltenVK on a GPU, so it is a hardware test.
[[test]]
name = "timeline_crosses_to_a_helper_as_a_metal_shared_event"
path = "tests/timeline_crosses_to_a_helper_as_a_metal_shared_event.rs"

# The helper process the IOSurface texture test spawns: checks a texture out
# and reads its pixels back through its own import. Empty off macOS.
[[bin]]
name = "iosurface_texture_helper"
path = "tests/bin/iosurface_texture_helper.rs"

# A texture crossing to a helper process on an IOSurface: the registration
# whole over the Mach channel, the helper's own import, and the engine's GPU
# write read back pixel-exact. Needs MoltenVK on a GPU.
[[test]]
name = "texture_crosses_to_a_helper_on_an_iosurface"
path = "tests/texture_crosses_to_a_helper_on_an_iosurface.rs"

[build-dependencies]
serde_json = { workspace = true }
# Reads the manifests of the crates the engine links through path dependencies,
# whose edits rotate the engine build id.
toml = { workspace = true }

# Compiles `src/linux/pipewire_audio_shim.c`. SPA's pod builders and parsers
# are header-only inline C, so the PipeWire audio arm needs a C toolchain step
# even though it links no audio library — the same shape
# `vendor/tatolab-vulkanalia-vma` uses for VMA.
cc = "1.2"

[package.metadata.docs.rs]
# Generate docs for all platforms and features
all-features = true
targets = ["x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

[lints]
workspace = true
