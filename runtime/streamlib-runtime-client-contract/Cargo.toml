[package]
name = "streamlib-runtime-client-contract"
description = "The contract a running StreamLib runtime offers the clients on its machine: the files it leaves on disk and the names its local API speaks"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true

[lib]
name = "streamlib_runtime_client_contract"
path = "src/lib.rs"

[features]
# The JSON Schema of each result type the control contract file describes.
json-schema = ["dep:schemars"]
# Test builds only, never a release: the runtime directory, the state directory and the Linux
# machine runtime lock all move under the absolute path TATOLAB_TEST_MACHINE_ROOT, which must be
# set; the macOS lock is the loopback port TATOLAB_TEST_LOOPBACK_HTTP_PORT names, which must be set
# there too. A root too long for iceoryx2's socket paths reaches its iceoryx2 domain through a
# short symlink in /tmp named for the root.
machine-directories-under-a-test-root = []

[dependencies]
libc.workspace = true
schemars = { version = "1.2", features = ["uuid1"], optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid = { version = "1.11", features = ["serde"] }

[dev-dependencies]
serial_test = "3.2"
tempfile.workspace = true

[lints]
workspace = true
