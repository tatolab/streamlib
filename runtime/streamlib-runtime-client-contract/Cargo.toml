[package]
name = "streamlib-runtime-client-contract"
description = "The contract a running StreamLib runtime offers the clients on its machine: the files it leaves on disk and the names its local API speaks"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true

[lib]
name = "streamlib_runtime_client_contract"
path = "src/lib.rs"

[features]
# Test builds only, never a release: the runtime directory, the state directory and the machine
# runtime lock all move under the absolute path TATOLAB_TEST_MACHINE_ROOT, which must be set.
machine-directories-under-a-test-root = []

[dependencies]
libc.workspace = true
# The surface-image exchange route's surface-id segment.
percent-encoding = "2.3"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
serial_test = "3.2"
tempfile.workspace = true

[lints]
workspace = true
