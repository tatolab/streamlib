[package]
name = "tatolab-video-poster-frame"
description = "The runtime unit's poster frame helper: decodes one H.264 or H.265 access unit on the machine's hardware decoder, out of the runtime's process, and hands the picture back as RGBA."
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "tatolab-video-poster-frame"
path = "src/main.rs"

[features]
# Declared by every runtime-unit binary package; this helper keeps no machine directories.
machine-directories-under-a-test-root = []
# Gates the tests that decode on the machine's hardware decoder:
# `cargo test -p tatolab-video-poster-frame --features hardware-tests` on the rig.
hardware-tests = []

[dependencies]
streamlib-asset-media-facts = { path = "../streamlib-asset-media-facts", version = "0.68.82" }

[target.'cfg(target_os = "linux")'.dependencies]
streamlib-consumer-rhi = { path = "../streamlib-consumer-rhi", version = "0.68.82" }
streamlib-vulkan-video = { path = "../streamlib-vulkan-video", version = "0.68.82" }

[target.'cfg(target_os = "macos")'.dependencies]
streamlib-owned-device-video-codec-nodes = { path = "../streamlib-owned-device-video-codec-nodes", version = "0.68.82" }
streamlib-video-bitstream = { path = "../streamlib-video-bitstream", version = "0.68.82" }
objc2-core-video = { workspace = true, features = ["objc2-io-surface"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = { workspace = true }

[lints]
workspace = true
