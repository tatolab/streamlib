[package]
name = "tatolabd"
description = "The machine's runtime: hosts every stream loaded into it over its local API, and re-loads the kept ones at its start, in the foreground and with no Python in its process."
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "tatolabd"
path = "src/main.rs"

[features]
# The tests that start the engine on a GPU, gated the engine's way:
# `cargo test -p tatolabd --features hardware-tests,machine-directories-under-a-test-root` on the rig.
hardware-tests = ["streamlib/hardware-tests"]
# Test builds only, never a release: the machine runtime lock, the state directory and the runtime
# directory all move under the absolute path TATOLAB_TEST_MACHINE_ROOT, which must be set.
machine-directories-under-a-test-root = [
    "streamlib-runtime-client-contract/machine-directories-under-a-test-root",
    "streamlib-api-server/machine-directories-under-a-test-root",
    "streamlib/machine-directories-under-a-test-root",
]

[dependencies]
streamlib = { path = "../../sdk/streamlib-sdk", version = "0.43.1" }
streamlib-media-builtins = { path = "../streamlib-media-builtins", version = "0.43.1" }
streamlib-api-server = { path = "../streamlib-api-server" }
# The machine runtime lock and the state directory the runtime takes at start.
streamlib-runtime-client-contract = { path = "../streamlib-runtime-client-contract", version = "0.43.1" }
clap = { version = "4.5", features = ["derive"] }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
libc = { workspace = true }
# The tests call the runtime's stream tools over its local API with rmcp's own client.
rmcp = { version = "3.5.1", default-features = false, features = ["client", "transport-streamable-http-client-unix-socket"] }
tokio = { version = "1.48.0", features = ["rt"] }

[lints]
workspace = true
