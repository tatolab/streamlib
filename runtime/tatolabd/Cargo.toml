[package]
name = "tatolabd"
description = "The machine's runtime: hosts every stream loaded into it over its local API, and re-loads the kept ones at its start, in the foreground and with no Python in its process."
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "tatolabd"
path = "src/main.rs"

[features]
# The tests that start the engine on a GPU, gated the engine's way:
# `cargo test -p tatolabd --features hardware-tests,machine-directories-under-a-test-root` on the rig.
hardware-tests = ["streamlib/hardware-tests"]
# Test builds only, never a release: the machine runtime lock, the state directory and the runtime
# directory all move under the absolute path TATOLAB_TEST_MACHINE_ROOT, which must be set, and the
# crash-on-demand test node is registered.
machine-directories-under-a-test-root = [
    "dep:libc",
    "streamlib-runtime-client-contract/machine-directories-under-a-test-root",
    "streamlib-api-server/machine-directories-under-a-test-root",
    "streamlib/machine-directories-under-a-test-root",
]

[dependencies]
streamlib = { path = "../../sdk/streamlib-sdk", version = "0.57.0" }
streamlib-media-builtins = { path = "../streamlib-media-builtins", version = "0.57.0" }
streamlib-api-server = { path = "../streamlib-api-server" }
# The machine runtime lock and the state directory the runtime takes at start.
streamlib-runtime-client-contract = { path = "../streamlib-runtime-client-contract", version = "0.57.0" }
# The interface every relay adapter implements, and every adapter: the machine's
# local relay, Cloudflare's and moq.pro's.
streamlib-relay-adapter-sdk = { path = "../streamlib-relay-adapter-sdk" }
streamlib-relay-adapter-local = { path = "../streamlib-relay-adapter-local" }
streamlib-relay-adapter-cloudflare = { path = "../streamlib-relay-adapter-cloudflare" }
streamlib-relay-adapter-moqpro = { path = "../streamlib-relay-adapter-moqpro" }
# The publisher: a MoQ client of every joined relay, writing the stack's
# catalog layout.
moq-net = { version = "=0.3.15" }
moq-tokio = { version = "=0.19.28" }
moq-json = { version = "=0.5.13" }
hang = { version = "=0.21.16" }
bytes = "1"
# Relay secrets in the OS secret store: the keyring project's core API and
# the one store each floor answers through.
keyring-core = "=1.0.1"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
tracing = { workspace = true }
# The crash-on-demand test node, in a test build alone.
libc = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Secret Service over pure-Rust D-Bus, so the runtime links no libdbus.
zbus-secret-service-keyring-store = { version = "=1.0.1", features = ["rt-async-io-crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", features = ["keychain"] }

[dev-dependencies]
# The relay-adapter catalog's icons, read back from their `data:` URIs.
base64 = "0.22"
# The tests read a relay as every reader of one does.
streamlib-relay-track-reader = { path = "../streamlib-relay-track-reader" }
tokio = { version = "1.48.0", features = ["rt"] }
# The redaction tests capture what reached the log.
tracing-subscriber = { workspace = true, features = ["fmt"] }
tempfile = { workspace = true }
libc = { workspace = true }
# A moq.pro project's signing key, generated for the redaction tests.
moq-auth = { version = "=0.2.1", default-features = false }
# The tests call the runtime's stream tools over its local API with rmcp's own client.
rmcp = { version = "3.5.1", default-features = false, features = ["client", "transport-streamable-http-client-unix-socket"] }

[lints]
workspace = true
