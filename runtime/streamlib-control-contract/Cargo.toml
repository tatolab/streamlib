[package]
name = "streamlib-control-contract"
description = "engine-free: every operation a StreamLib runtime's control plane serves, declared once, and the versioned contract file generated from them"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false

[lib]
name = "streamlib_control_contract"
path = "src/lib.rs"

[dependencies]
schemars = { version = "1.2", features = ["uuid1"] }
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
streamlib-node-schema = { path = "../../sdk/streamlib-node-schema", version = "0.69.158", features = ["contract-json-schema"] }
streamlib-project-repository = { path = "../streamlib-project-repository", default-features = false, features = ["mcp-tool-json-schema"] }
streamlib-runtime-client-contract = { path = "../streamlib-runtime-client-contract", version = "0.69.158", features = ["json-schema"] }
uuid = { version = "1.11", features = ["serde"] }

[dev-dependencies]
jsonschema = { version = "0.60", default-features = false }

[lints]
workspace = true
