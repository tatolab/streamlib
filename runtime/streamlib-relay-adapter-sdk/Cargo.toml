[package]
name = "streamlib-relay-adapter-sdk"
description = "The one interface every relay adapter implements: joining a relay, the exposure levels it serves, the root it puts the machine's broadcasts under, the credential the runtime dials with, and its connection events."
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false

[dependencies]
streamlib = { path = "../../sdk/streamlib-sdk", version = "0.54.11" }
streamlib-processor-schema = { path = "../../sdk/streamlib-processor-schema", version = "0.54.11" }
# The shape `list_relays` answers in, which the CLI parses.
streamlib-runtime-client-contract = { path = "../streamlib-runtime-client-contract", version = "0.54.11" }
schemars = "0.8"
secrecy = "0.10.3"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
url = "2.5.8"

[lints]
workspace = true
