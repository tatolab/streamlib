[package]
name = "streamlib-relay-adapter-sdk"
description = "The one interface every relay adapter implements: joining a relay, the exposure levels it serves, the root it puts the machine's broadcasts under, the credential the runtime dials with, and its connection events."
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false

[dependencies]
# The relay-adapter catalog's icon `data:` URI.
base64 = "0.22"
streamlib = { path = "../../sdk/streamlib-sdk", version = "0.55.6" }
streamlib-processor-schema = { path = "../../sdk/streamlib-processor-schema", version = "0.55.6" }
# The shape `list_relays` answers in, which the CLI parses.
streamlib-runtime-client-contract = { path = "../streamlib-runtime-client-contract", version = "0.55.6" }
schemars = "0.8"
secrecy = "0.10.3"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
url = "2.5.8"
# Host-only OpenAPI schema derive for the relay-adapter catalog's setting
# fields, behind the off-by-default `utoipa` feature the local API enables.
utoipa = { version = "5.3", optional = true }

[features]
# Adds a `utoipa::ToSchema` derive to the setting-field types the
# relay-adapter catalog serves.
utoipa = ["dep:utoipa"]

[lints]
workspace = true
