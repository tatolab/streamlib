[package]
name = "streamlib-api-server"
version.workspace = true
edition = "2024"
authors = ["Jonathan Fontanez <fontanezj1@gmail.com>"]
description = "The local API a host serves for a streamlib engine — graph inspection per loaded stream, node catalogs, channel taps, WebSocket event streaming, MCP, OpenAPI spec."
keywords = ["api-server", "http", "websocket", "openapi", "streamlib"]
categories = ["multimedia", "web-programming::http-server"]
repository = "https://github.com/tato123/streamlib"
license = "BUSL-1.1"
# Host-side control plane — statically linked into `tatolabd`, not
# distributed through the registry. `publish = false` keeps it out of the
# release closure (`compute_release_closure` requires a publishable crate).
publish = false

[lib]
name = "streamlib_api_server"
# `rlib` only. The api-server is a host (it drives RuntimeOperations, the
# processor registry, pubsub, and the graph API), not a loadable plugin — a
# host cannot be dlopen'd across the plugin ABI, so it emits no `cdylib`.
crate-type = ["rlib"]

[[bin]]
name = "generate_openapi"
path = "src/bin/generate_openapi.rs"

[features]
# The tests that start a stream, whose start creates the engine's GPU context, gated the engine's
# way: `cargo test -p streamlib-api-server --features hardware-tests` on the rig.
hardware-tests = ["streamlib/hardware-tests"]
# Test builds only, never a release: the runtime directory the local API socket is bound in moves
# under the absolute path TATOLAB_TEST_MACHINE_ROOT, which must be set.
machine-directories-under-a-test-root = [
    "streamlib-runtime-client-contract/machine-directories-under-a-test-root",
    "streamlib/machine-directories-under-a-test-root",
]

[dependencies]
streamlib = { path = "../../sdk/streamlib-sdk", version = "0.68.44" }
# The runtime directory the local API's socket is bound in, and the wire names and tool result
# shapes it serves.
streamlib-runtime-client-contract = { path = "../streamlib-runtime-client-contract", version = "0.68.44" }
# The projects the asset tools open, each with its one writer.
streamlib-project-repository = { path = "../streamlib-project-repository", features = ["mcp-tool-json-schema"] }
uuid = "1.11"
# `read_project_file` and `write_project_file` carry a file's bytes as base64.
base64 = "0.22"

# `trace` for every request's span.
tower-http = { version = "0.6", features = ["trace"] }
tower = { version = "0.5", features = ["util"] }
futures-util = "0.3"

utoipa = { version = "5.3", features = ["axum_extras"] }
utoipa-axum = "0.2"

axum = {version = "0.8.8", features = ["ws"]}
# `/mcp/stdio`'s upgrade: hyper hands over the connection, hyper-util adapts it to tokio's IO.
hyper = { workspace = true, features = ["http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde = {version = "1.0", features = ["derive"]}

tokio = {version = "1.48.0", features = ["full", "rt-multi-thread", "net", "sync"]}
parking_lot = "0.12"

serde_json = {version = "1.0", features = ["preserve_order"]}
tracing = {version = "0.1.41", features = ["release_max_level_debug"]}

# The official MCP SDK: the protocol, its Streamable HTTP transport, and the
# tool / prompt routers the node's control vocabulary is declared through.
rmcp = { version = "3.5.1", features = ["server", "macros", "transport-streamable-http-server", "transport-async-rw"] }
tokio-util = "0.7"

[dev-dependencies]
# The MCP wire tests drive the real router over its socket with rmcp's own client.
rmcp = { version = "3.5.1", features = ["client", "transport-streamable-http-client-unix-socket"] }
tempfile = "3"
serial_test = "3.2"
# The handshake test reads `[workspace.package] version` from the workspace manifest.
toml.workspace = true
# The request-trace level test drives a request under a real `EnvFilter` and
# captures what reached the subscriber.
tracing-subscriber.workspace = true
# The project archive tests zip a project to import it.
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
