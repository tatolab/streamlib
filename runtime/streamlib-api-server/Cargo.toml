[package]
name = "streamlib-api-server"
version = "1.0.0"
edition = "2024"
authors = ["Jonathan Fontanez <fontanezj1@gmail.com>"]
description = "HTTP control-plane processor for streamlib runtimes — graph inspection, registry browsing, channel taps, WebSocket event streaming, MCP, OpenAPI spec."
keywords = ["api-server", "http", "websocket", "openapi", "streamlib"]
categories = ["multimedia", "web-programming::http-server"]
repository = "https://github.com/tato123/streamlib"
license = "BUSL-1.1"
# Host-side control plane — statically linked into `streamlib-runtime`, not
# distributed through the registry. `publish = false` keeps it out of the
# release closure (`compute_release_closure` requires a publishable crate).
publish = false

[lib]
name = "streamlib_api_server"
# `rlib` only. The api-server is a host (it drives RuntimeOperations, the
# processor registry, pubsub, and the graph API), not a loadable plugin — a
# host cannot be dlopen'd across the plugin ABI, so it emits no `cdylib`.
crate-type = ["rlib"]

[[bin]]
name = "generate_openapi"
path = "src/bin/generate_openapi.rs"

[dependencies]
streamlib = { path = "../../sdk/streamlib-sdk", version = "0.37.0" }
streamlib-macros = { path = "../../sdk/streamlib-macros", version = "0.37.0" }

tower-http = { version = "0.6", features = ["trace"] }
futures-util = "0.3"

utoipa = { version = "5.3", features = ["axum_extras"] }
utoipa-axum = "0.2"

axum = {version = "0.8.8", features = ["ws"]}
# `/mcp/stdio`'s upgrade: hyper hands over the connection, hyper-util adapts it to tokio's IO.
hyper = { workspace = true, features = ["http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde = {version = "1.0", features = ["derive"]}

tokio = {version = "1.48.0", features = ["full", "rt-multi-thread", "net", "sync"]}
parking_lot = "0.12"

serde_json = {version = "1.0", features = ["preserve_order"]}
thiserror = {workspace = true}
tracing = {version = "0.1.41", features = ["release_max_level_debug"]}

# The official MCP SDK: the protocol, its Streamable HTTP transport, and the
# tool / prompt routers the node's control vocabulary is declared through.
rmcp = { version = "3.5.1", features = ["server", "macros", "transport-streamable-http-server", "transport-async-rw"] }
tokio-util = "0.7"

# The MCP `exchange` tool's image content block: base64 for the inline PNG,
# percent-encoding for the surface id in the REST route the result names.
base64 = "0.22"
percent-encoding = "2.3"

[dev-dependencies]
# Enables the engine's `test-support` in-memory `TapSubscription` constructor
# for the MCP/REST tap-tool tests. A dev-dep feature: active for tests, absent
# from the production `cargo build` dependency graph.
streamlib = { path = "../../sdk/streamlib-sdk", version = "0.37.0", features = ["test-support"] }
# The MCP wire tests drive the real router over its socket with rmcp's own client.
rmcp = { version = "3.5.1", features = ["client", "transport-streamable-http-client-unix-socket"] }
tempfile = "3"
tower = {version = "0.5", features = ["util"]}
serial_test = "3.2"
# The request-trace level test drives a request under a real `EnvFilter` and
# captures what reached the subscriber.
tracing-subscriber.workspace = true
