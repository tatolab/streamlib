[package]
name = "streamlib-surface-client"
description = "Wire helpers for the StreamLib surface-sharing service: Unix socket + SCM_RIGHTS on Linux, raw Mach on macOS"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true

[lib]
name = "streamlib_surface_client"
path = "src/lib.rs"

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true
serde_json.workspace = true
# The Mach message, port and bootstrap bindings the macOS arm rides on.
mach2 = "0.7"

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Each test socket gets a directory of its own: the kernel answers uniqueness,
# and the socket is unlinked on drop instead of littering /tmp.
tempfile.workspace = true

[lints]
workspace = true
