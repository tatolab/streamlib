[package]
name = "streamlib-project-repository"
description = "A StreamLib project as a versioned repository of assets: its project file, asset sidecars with UUIDs, its content store, transactions and its own Git history"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true

[lib]
name = "streamlib_project_repository"
path = "src/lib.rs"

[dependencies]
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
parking_lot = "0.12"
# Git's smart HTTP over the runtime's own TLS stack, so libgit2 carries no OpenSSL.
rustls = "0.23"
rustls-platform-verifier = "0.7"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid = { version = "1.11", features = ["v4", "serde"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
