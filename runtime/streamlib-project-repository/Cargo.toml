[package]
name = "streamlib-project-repository"
description = "A StreamLib project as a versioned repository of assets: its project file, asset sidecars with UUIDs, its content store, transactions and its own Git history"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true

[lib]
name = "streamlib_project_repository"
path = "src/lib.rs"

[features]
default = ["history"]
# The project's own history and the one writer that commits to it. Without it the crate reads
# and writes a project's files alone, so a consumer such as the Python wheel links no libgit2.
history = ["dep:git2", "dep:parking_lot", "dep:rustls", "dep:rustls-platform-verifier", "dep:tokio"]

[dependencies]
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"], optional = true }
parking_lot = { version = "0.12", optional = true }
# Git's smart HTTP over the runtime's own TLS stack, so libgit2 carries no OpenSSL.
rustls = { version = "0.23", optional = true }
rustls-platform-verifier = { version = "0.7", optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true }
tracing.workspace = true
uuid = { version = "1.11", features = ["v4", "v5", "serde"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
