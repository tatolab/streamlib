[package]
name = "streamlib-project-repository"
description = "A StreamLib project as a versioned repository of assets: its project file, asset sidecars with UUIDs, its imports, transactions and its own local Git history"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true

[lib]
name = "streamlib_project_repository"
path = "src/lib.rs"

[features]
default = ["history"]
# The project's own history and the one writer that commits to it. Without it the crate reads
# and writes a project's files alone, so a consumer such as the Python wheel links no libgit2.
history = ["dep:git2", "dep:libz-sys", "dep:parking_lot", "dep:tokio", "dep:zip"]
# The JSON Schema of each graph action, in the schemars rmcp reads, for the MCP tools. Without it
# the engine and the SDK link only their own schemars, so a missing `JsonSchema` derive on a
# processor config is reported against one crate.
mcp-tool-json-schema = ["dep:schemars"]

[dependencies]
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"], optional = true }
# libgit2's zlib, compiled in: the runtime unit's executables may need only what manylinux
# promises a host, and `libz.so.1` is not among it.
libz-sys = { version = "1.1", default-features = false, features = ["static"], optional = true }
parking_lot = { version = "0.12", optional = true }
schemars = { version = "1.2", features = ["uuid1"], optional = true }
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
sha2.workspace = true
streamlib-processor-schema = { path = "../../sdk/streamlib-processor-schema", version = "0.68.52" }
thiserror.workspace = true
tokio = { workspace = true, optional = true }
toml_edit.workspace = true
tracing.workspace = true
uuid = { version = "1.11", features = ["v4", "v5", "serde"] }
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }

[dev-dependencies]
tempfile.workspace = true
toml.workspace = true
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true
