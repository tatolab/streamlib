[package]
name = "streamlib-ipc-types"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
description = "Shared iceoryx2 payload types for StreamLib IPC"

[dependencies]
iceoryx2 = "0.10.0"
streamlib-runtime-client-contract = { path = "../streamlib-runtime-client-contract", version = "0.69.6" }
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# The claim table's sealed memfd mapping.
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# The claim table's Mach memory entry mapping, and the send right that hands it over.
mach2 = "0.7"
streamlib-surface-client = { path = "../streamlib-surface-client", version = "0.69.6" }

[lints]
workspace = true

[target.'cfg(loom)'.dependencies]
loom = "0.7.2"
