<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>tatolab watch</title>
		<link rel="icon" href="data:," />
		<style>
			body {
				margin: 0;
				font-family: system-ui, sans-serif;
				background: #111;
				color: #ddd;
			}
			header {
				padding: 0.5rem 1rem;
			}
			#watch-canvas {
				display: block;
				width: 100%;
				max-height: 80vh;
				object-fit: contain;
				background: #000;
			}
			a {
				color: #8cf;
			}
			a[aria-current] {
				font-weight: bold;
			}
			/* `?video_only`: the playing video alone, fitted to the page with its aspect kept, for a window that frames the page. */
			:root[data-watch-page-shows="video_only"],
			:root[data-watch-page-shows="video_only"] body {
				height: 100%;
				overflow: hidden;
				background: transparent;
			}
			:root[data-watch-page-shows="video_only"] header,
			:root[data-watch-page-shows="video_only"] ul {
				display: none;
			}
			:root[data-watch-page-shows="video_only"] #watch-canvas {
				height: 100%;
				max-height: none;
				background: transparent;
			}
		</style>
		<!-- libav.js stays its own unmodified files, LGPL beside the bundle; the bundle imports it by this name. -->
		<script type="importmap">
			{ "imports": { "@libav.js/variant-opus-af": "/watch/libav-opus-af.mjs" } }
		</script>
		<!-- Absolute: the page answers at every /watch/<address>, below which a relative path would name no file. -->
		<script type="module" src="/watch/main.js"></script>
	</head>
	<body>
		<header>
			<div id="watch-address"></div>
			<div id="watch-status">loading</div>
		</header>
		<canvas id="watch-canvas"></canvas>
		<ul id="watch-video-tracks"></ul>
		<ul id="watch-streams"></ul>
	</body>
</html>
