[package]
name = "tatolab-cli"
description = "The `tatolab` CLI: `new` writes a stream project; `run` and `dev` compile a stream in its project's venv and start `tatolabd` attached."
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "tatolab"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
# The compile entry's JSON document in, the stream graph file out.
serde_json = { workspace = true }
# The stream graph file `tatolabd` reads, deleted when it exits.
tempfile = { workspace = true }
# Signal mask, sigwait, kill and the parent-death signal: the attached `tatolabd`'s lifecycle.
libc = { workspace = true }

[lints]
workspace = true
