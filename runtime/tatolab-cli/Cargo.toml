[package]
name = "tatolab-cli"
description = "The `tatolab` CLI: `new` writes a stream project; `run` and `dev` compile a stream in its project's venv and start `tatolabd` attached; `nodes` lists the runtimes running on this machine, and `graph` and `tap` read one through its local API socket; `enable-virtual-camera` grants this machine's users the virtual camera's loopback device, once."
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "tatolab"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
# The compile entry's JSON document in; its stream graph copied byte-for-byte to the graph file.
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
# The stream graph file `tatolabd` reads, deleted when it exits.
tempfile = { workspace = true }
# Signal mask, sigwait, kill and the parent-death signal: the attached `tatolabd`'s lifecycle.
libc = { workspace = true }
# What a running runtime leaves on disk: the runtime directory and the node registry it is found in.
streamlib-runtime-on-disk-contract = { path = "../streamlib-runtime-on-disk-contract", version = "0.41.0" }
# The MCP client of a runtime's local API: the official SDK's, over the local API socket.
rmcp = { version = "3.5.1", default-features = false, features = ["client", "transport-streamable-http-client-unix-socket"] }
# One current-thread runtime per client or request, driving it to completion.
tokio = { version = "1.48.0", features = ["rt", "time", "net"] }
# Plain HTTP/1.1 over the local API socket, for the routes reached without MCP.
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
# `exchange --channel`: a tapped bag's frame header stripped by the transport's own accessor, then
# its msgpack payload decoded.
streamlib-ipc-types = { path = "../streamlib-ipc-types", version = "0.41.0" }
rmpv = { workspace = true }

[dev-dependencies]
# The stub local API the observation verbs are driven against: the official MCP SDK's server,
# mounted on axum beside a stub of the surface-image route.
rmcp = { version = "3.5.1", features = ["server", "transport-streamable-http-server"] }
axum = { workspace = true }
tokio = { version = "1.48.0", features = ["rt", "time", "net", "sync"] }
