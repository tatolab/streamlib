[package]
name = "streamlib-owned-device-video-codec-nodes"
description = "The H.264 and H.265 encoder and decoder node bodies the tatolab-h264 and tatolab-h265 modules run, on a Vulkan Video device they own on Linux and on VideoToolbox on macOS, reading and writing their ports through the module host table"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true

[lib]
name = "streamlib_owned_device_video_codec_nodes"
path = "src/lib.rs"

[dependencies]
tatolab-module-sdk = { path = "../../sdk/tatolab-module-sdk", version = "1.5.0" }
serde.workspace = true
rmp-serde.workspace = true
tracing.workspace = true
streamlib-consumer-rhi = { path = "../streamlib-consumer-rhi", version = "0.68.13" }
streamlib-video-bitstream = { path = "../streamlib-video-bitstream", version = "0.68.13" }

[target.'cfg(target_os = "linux")'.dependencies]
streamlib-vulkan-video = { path = "../streamlib-vulkan-video", version = "0.68.13" }
streamlib-surface-client = { path = "../streamlib-surface-client", version = "0.68.13" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation.workspace = true
objc2-core-media.workspace = true
objc2-core-video = { workspace = true, features = ["objc2-io-surface"] }
objc2-io-surface.workspace = true
objc2-video-toolbox = { workspace = true, features = ["std", "VTSession", "VTCompressionSession", "VTCompressionProperties", "VTDecompressionSession", "VTDecompressionProperties", "VTErrors", "objc2-core-media", "objc2-core-video"] }

[lints]
workspace = true
