[package]
name = "streamlib-media-builtins"
description = "First-party media built-ins: native pre-built blocks (test-pattern source, camera, display) statically linked into the wheel and instantiated from Python by configuration. Written against the SDK's handle-shaped primitives, never engine internals."
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true

[lib]
name = "streamlib_media_builtins"
path = "src/lib.rs"

[dependencies]
streamlib = { path = "../../sdk/streamlib-sdk", version = "0.26.9", default-features = false }
serde = { workspace = true }
serde_bytes = { workspace = true }
rmp-serde = { workspace = true }
tracing = { workspace = true }
# libopus, statically linked through `opusic-sys`'s bundled copy (cmake, no
# bindgen at build). Not target-gated: the Opus pair registers unconditionally
# beside the audio built-ins, and nothing in it is platform-bound. The static
# link is load-bearing — `test_wheel_portability.py` fails if `DT_NEEDED` grows.
opus = "0.4"
# Pure-Rust ISOBMFF box codec for `Mp4Sink`. No ffmpeg and no new `DT_NEEDED` —
# `test_wheel_portability.py` is the pass/fail on that.
mp4-atom = "0.15"

[target.'cfg(target_os = "linux")'.dependencies]
v4l = "0.14"
libc = { workspace = true }

[features]
# Forwarded so a display-tier test in this crate gates the same way the engine's
# do: `cargo test -p streamlib-media-builtins --features hardware-tests`.
hardware-tests = ["streamlib/hardware-tests"]

[dev-dependencies]
# An independent ISOBMFF parser, used only as a conformance oracle. The writer
# and every hand-written test here share `mp4-atom`, so a box that crate treats
# as optional is invisible to both — which is exactly how a missing `stco`
# shipped. This one enforces the spec's mandatory boxes.
mp4 = "0.14"
serde_json = { workspace = true }
rmp-serde = { workspace = true }
rmpv = { workspace = true }

# The window-server assertions of the macOS display test.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = { workspace = true }
objc2-app-kit = { workspace = true }
objc2-core-foundation = { workspace = true }
objc2-core-graphics = { workspace = true }
dispatch2 = "0.3"
libc = { workspace = true }
# The camera→display harness writes the frame it scores.
png = "0.17"

# Two `DisplayWindow`s asserted against the macOS window server. `harness =
# false` because `App::run` must drive the window event pump on the process's
# first thread, where libtest never runs a test; display tier, so it builds only
# under `hardware-tests`. Its `main` is empty off Apple.
[[test]]
name = "two_display_windows_on_the_macos_window_server"
path = "tests/two_display_windows_on_the_macos_window_server.rs"
harness = false
required-features = ["hardware-tests"]

# `CameraSource` → `DisplayWindow` asserted against the macOS window server,
# with the camera's frames scored beside the window. `harness = false` for the
# same first-thread reason; rig tier — a camera, and camera access allowed for
# the terminal running it — so it builds only under `hardware-tests`. Its
# `main` is empty off Apple.
[[test]]
name = "camera_to_display_window_on_the_macos_window_server"
path = "tests/camera_to_display_window_on_the_macos_window_server.rs"
harness = false
required-features = ["hardware-tests"]

[lints]
workspace = true
