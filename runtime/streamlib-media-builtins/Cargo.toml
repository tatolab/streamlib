[package]
name = "streamlib-media-builtins"
description = "First-party media built-ins: native pre-built blocks (the relay track source) statically linked into the wheel and instantiated from Python by configuration. Written against the SDK's handle-shaped primitives, never engine internals."
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true

[lib]
name = "streamlib_media_builtins"
path = "src/lib.rs"

[dependencies]
streamlib = { path = "../../sdk/streamlib-sdk", version = "0.68.93", default-features = false }
serde = { workspace = true }
serde_bytes = { workspace = true }
rmp-serde = { workspace = true }
# A Records message is a msgpack map the conversion nodes read and write as values.
rmpv = { workspace = true }
tracing = { workspace = true }

[features]
# Forwarded so a hardware-tier test in this crate gates the same way the engine's
# do: `cargo test -p streamlib-media-builtins --features hardware-tests`.
hardware-tests = ["streamlib/hardware-tests"]

[dev-dependencies]
streamlib = { path = "../../sdk/streamlib-sdk", version = "0.68.93", default-features = false, features = ["test-support"] }
serde_json = { workspace = true }
# Pins each golden graph's bytes, so a golden is added beside the others and never edited.
sha2 = { workspace = true }
rmp-serde = { workspace = true }
rmpv = { workspace = true }
# The project directory each golden graph's stream loads in.
tempfile = { workspace = true }

[lints]
workspace = true
