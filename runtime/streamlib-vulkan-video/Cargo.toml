[package]
name = "streamlib-vulkan-video"
description = "Vulkan Video encode and decode for StreamLib, on a device a codec module owns"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true

[features]
# Gates the tests that mint codec resources on a real GPU:
#   cargo test -p streamlib-vulkan-video --features hardware-tests -- --test-threads=1
hardware-tests = []
# Zero bitstream buffers when (re)allocating them, so a NAL-parser bug is
# easier to spot in raw memory. A debugging knob, off by default.
clear_bitstream_buffers_on_create = []

[lib]
name = "streamlib_vulkan_video"
path = "src/lib.rs"

[target.'cfg(target_os = "linux")'.dependencies]
vulkanalia.workspace = true
vulkanalia-vma.workspace = true
tracing.workspace = true

# The owned-device tier a codec module encodes on, and the layout vocabulary
# shared with the rest of the RHI.
[target.'cfg(target_os = "linux")'.dependencies.streamlib-consumer-rhi]
path = "../streamlib-consumer-rhi"
version = "0.68.27"

# The SPS parsing and Annex-B start codes the decoder reads streams with.
[target.'cfg(target_os = "linux")'.dependencies.streamlib-video-bitstream]
path = "../streamlib-video-bitstream"
version = "0.68.27"

# The hardware tests map an exported DMA-BUF the way an importer reads one.
[target.'cfg(target_os = "linux")'.dev-dependencies]
libc.workspace = true

[lints]
workspace = true
