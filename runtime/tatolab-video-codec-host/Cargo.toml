[package]
name = "tatolab-video-codec-host"
description = "The runtime unit's video codec host: one Vulkan Video encode device and one decode device per GPU, shared by every H.264 and H.265 encoder and decoder node on it, run once for the machine as a shared native service."
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "tatolab-video-codec-host"
path = "src/main.rs"

[features]
# Declared by every runtime-unit binary package; this host keeps no machine directories.
machine-directories-under-a-test-root = []

[dependencies]
streamlib-runtime-client-contract = { path = "../streamlib-runtime-client-contract", version = "0.69.214" }
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
streamlib-owned-device-video-codec-nodes = { path = "../streamlib-owned-device-video-codec-nodes", version = "0.69.214" }

[lints]
workspace = true
