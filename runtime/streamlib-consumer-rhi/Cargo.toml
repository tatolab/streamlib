[package]
name = "streamlib-consumer-rhi"
description = "Consumer-side carve-out of the StreamLib Vulkan RHI: DMA-BUF FD import (Linux) or IOSurface host-memory import (macOS) + bind + map and the trait machinery surface adapters use to abstract over device flavors. Cdylibs depend on this crate (NOT the full streamlib) so the FullAccess capability boundary is type-system enforced."
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true

[lib]
name = "streamlib_consumer_rhi"
path = "src/lib.rs"

[dependencies]
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
vulkanalia.workspace = true
libc.workspace = true

# The DMA-BUF plane cap the fd-import path is checked against on Linux; the
# Mach send right a Metal shared event crosses as on macOS.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies.streamlib-surface-client]
path = "../streamlib-surface-client"
version = "0.26.34"

# The IOSurface a macOS helper imports; its pages map as host memory. The
# Metal shared event behind an imported timeline.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-io-surface.workspace = true
objc2-core-foundation.workspace = true
objc2-metal.workspace = true
objc2.workspace = true

[lints]
workspace = true
