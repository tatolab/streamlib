[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# Logging — `main` installs the subscriber that surfaces
# check-vendored-trees' `tracing::info!` output.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }

# `toml` reads Cargo.toml; `serde_json` reads `cargo metadata` output.
serde_json = { version = "1.0", features = ["preserve_order"] }
toml = "0.8"

# Error handling
anyhow = "1.0"

# Scratch temp dirs for xtask check tests (compile-then-discard).
tempfile = "3.15"

# Recursive file walk for the source-walking gates
walkdir = "2.5"

# Pure-Rust ISOBMFF box reader for `xtask mp4-inspect`. Same pin as the sink
# that writes the files it reads, so the writer and the reader cannot drift.
mp4-atom = "0.15"

# PNG decode/encode for `xtask psnr` — the codec proof's image measurements.
# Same pin as the engine's, which decodes the very same reference set.
png = "0.17"

# Rust AST parsing for lint-logging — matches clippy's disallowed_macros
# semantics (respects #[cfg(test)], #[allow(clippy::disallowed_macros)], and
# file-level #![allow(...)]) without having to compile the workspace.
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }

