[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# Logging — `main` installs the subscriber that surfaces
# check-vendored-trees' `tracing::info!` output.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }

# `toml` reads Cargo.toml; `serde_json` reads `cargo metadata` output.
serde_json = { version = "1.0", features = ["preserve_order"] }
toml = "0.8"
# Rewrites a sample project's pyproject.toml keeping its comments and layout.
toml_edit = "0.22"

# Reads the built-in descriptors `generate-built-in-node-classes` renders.
serde = { version = "1.0", features = ["derive"] }

# The operation registry `generate-control-contract` renders.
streamlib-control-contract = { path = "../runtime/streamlib-control-contract" }
# The local API routes and headers `generate-runtime-client` writes into the TypeScript client.
streamlib-runtime-client-contract = { path = "../runtime/streamlib-runtime-client-contract" }
# The upgrade of a stream document, which `check-graph-document-node-types` finds no work for in
# an in-tree document.
streamlib-project-repository = { path = "../runtime/streamlib-project-repository", default-features = false }

# Error handling
anyhow = "1.0"

# Scratch temp dirs for xtask check tests (compile-then-discard).
tempfile = "3.15"

# Recursive file walk for the source-walking gates
walkdir = "2.5"

# Unpacks the runtime unit's wheel into its lend for `xtask build-runtime`,
# keeping each member's unix mode. Deflate only: that is all maturin writes.
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Checks the runtime unit's uv archive against its pinned sha256.
sha2 = "0.10"

# A wheel RECORD's hash: the urlsafe base64 of a member's sha256.
base64 = "0.22"

# The Slang compiler release and library file names `runtime_unit_layout`
# reads, included by path above.
streamlib-slang-shader-compiler = { path = "../runtime/streamlib-slang-shader-compiler" }

# PNG decode/encode for `xtask psnr` — the codec proof's image measurements.
# Same pin as the engine's, which decodes the very same reference set.
png = "0.17"

# Parses the module host table ABI source for `check-module-host-table-surface` and
# `generate-module-host-table-c-header`.
syn = { version = "2", features = ["full"] }
# Renders a refused type back to source for a gate's message.
quote = "1"


[lints.rust]
unreachable_pub = "deny"

# stdout and stderr are the output channel of a development tool.
[lints.clippy]
allow_attributes_without_reason = "deny"
disallowed_macros = "allow"
