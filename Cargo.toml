[workspace]
resolver = "2"
members = [
    "sdk/streamlib-error", # engine-free: canonical Error + Result
    "sdk/vulkan-jpeg", # engine-free JPEG decoder — CPU parser + Huffman entropy decode + fused Vulkan-compute kernel (nvJPEG backend parked in the engine)
    "xtask",                    # Development tasks (cargo xtask <command>)
    "sdk/streamlib-sdk",       # Public authoring API surface — customer apps depend on this (Cargo name `streamlib`)
    "runtime/streamlib-engine",    # Engine internals (RHI, IPC, surface-share, runtime executor) — private dep of the SDK
    "runtime/streamlib-surface-client", # Wire-format helpers for the per-runtime surface-sharing socket (Linux)
    "runtime/streamlib-media-builtins", # First-party media built-ins (test pattern, camera, display) — native blocks statically linked into the wheel
    "sdk/streamlib-processor-schema", # Processor schema types + YAML parser shared between the engine and streamlib-macros
    "sdk/streamlib-macros",    # Procedural macros — owns the `#[processor]` authoring grammar
    "adapters/streamlib-surface-adapter", # Surface adapter contract shared by every adapter core
    "runtime/streamlib-consumer-rhi", # Consumer-side carve-out of the Vulkan RHI — DMA-BUF FD import + bind + map. Adapters depend on this NOT the full engine, so the FullAccess capability boundary is type-system enforced (Linux)
    "adapters/streamlib-adapter-vulkan", # Vulkan-native surface adapter — canonical implementor of VulkanWritable / VulkanImageInfoExt (Linux)
    "adapters/streamlib-adapter-opengl", # OpenGL/EGL surface adapter — canonical implementor of GlWritable; DMA-BUF + DRM modifier import (Linux)
    "adapters/streamlib-adapter-cpu-readback", # Explicit GPU→CPU surface adapter — sole implementor of CpuReadable / CpuWritable (Linux)
    "adapters/streamlib-adapter-cuda", # CUDA surface adapter — Vulkan↔CUDA OPAQUE_FD interop foundation for GPU-resident AI inference (Linux, #587)
    "adapters/streamlib-adapter-skia", # Skia surface adapter — composes on streamlib-adapter-vulkan; customer sees skia::Surface directly, never GrVkImageInfo / VkImageLayout (Linux)
    "sdk/streamlib-python-wheel", # The importable Python wheel — the app's CPython imports the engine and authors pipelines; every `@processor` runs in its own helper process
    "runtime/streamlib-ipc-types",  # Shared iceoryx2 payload types for cross-process IPC
    "runtime/streamlib-api-server", # The one control plane — HTTP + WebSocket + MCP. crate-type rlib, statically linked into the wheel and the streamlib crate
    "runtime/streamlib-moq",        # MoQ-over-QUIC transport library (sessions + catalog); the @tatolab/moq package's processors + the api-server build on it
    "vendor/tatolab-vulkanalia",     # Vendored vulkanalia fork (Apache-2.0) — see docs/architecture/vendored-vulkanalia.md
    "vendor/tatolab-vulkanalia-sys", # Vendored vulkanalia-sys fork (Apache-2.0) — see docs/architecture/vendored-vulkanalia.md
    "vendor/tatolab-vulkanalia-vma", # Vendored vulkanalia-vma fork (Apache-2.0, VMA 3.3.0 + Vulkan-Headers 1.4.309) — see docs/architecture/vendored-vulkanalia.md
    # `examples/*` and the rest of `packages/*` are NOT workspace members.
    # Only the zone crates (`runtime/*`, `sdk/*`, `adapters/*`, `vendor/*`)
    # and `xtask` form this workspace. Build a non-member Rust consumer with
    # `cd <dir> && cargo build`.
    #
    # Everything under both trees other than `test-fixtures` is a downstream
    # CONSUMER — standalone, its own `[workspace]` self-root, never a contract
    # source; `docs/plan/ARCHITECTURE.md` §Consumers sets each one's
    # disposition. `test-fixtures` below is INTERNAL test infrastructure — it
    # path-deps the zone crates and is the one package that stays a workspace
    # member (`publish = false`, which also keeps it out of the release
    # closure).
    "packages/test-fixtures",    # Attribute-macro test fixtures (TestConfiguredProcessor)
]

[workspace.package]
version = "0.18.49"
edition = "2024"
rust-version = "1.88"
authors = ["Jonathan Fontanez <fontanezj1@gmail.com>"]
license-file = "LICENSE"
repository = "https://github.com/tato123/streamlib"

# Workspace-wide clippy lints. Library crates opt in by adding
# `[lints] workspace = true` in their own Cargo.toml. Binary-only crates
# (xtask, examples) do not opt in, because
# stdout IS the user output channel for them. The `disallowed-macros` list
# itself lives in clippy.toml at the workspace root. See docs/logging.md.
[workspace.lints.clippy]
disallowed_macros = "deny"

[workspace.dependencies]
# Core dependencies
thiserror = "2.0.17"
anyhow = "1.0.100"
tracing = { version = "0.1.41", features = ["release_max_level_debug"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
tokio = { version = "1.48.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"
toml = "0.8"
toml_edit = "0.22"
rmp-serde = "1.3"
# `#[serde(with = "serde_bytes")]` — the annotation that puts a byte buffer on
# the wire as msgpack `bin` rather than as an array of one integer element per
# byte, which is what serde's blanket `Vec<u8>` impl emits.
serde_bytes = "0.11"
# Low-level msgpack encode primitives (write_map_len / write_str) used to
# stream a `Bag` to bytes without cloning the value tree. Same msgpack-rust
# project as `rmp-serde` / `rmpv`, which already pull it transitively.
rmp = "0.8"
# msgpack dynamic value tree (Value enum with a native `bin` variant) backing
# the engine-free SDK `Bag`. Companion crate to `rmp-serde` from the same
# msgpack-rust project; `with-serde` enables `rmpv::ext::{from_value,to_value}`.
rmpv = { version = "1.3", features = ["with-serde"] }

# The resampler behind the audio window contract's read-side stage. Pure Rust,
# no `DT_NEEDED` growth — which `test_wheel_portability.py` enforces regardless
# of what anyone believes about a crate. `default-features = false` drops the
# FFT resampler and with it `realfft` / `num-complex`: the stage takes the
# asynchronous sinc arm, which handles an arbitrary rate ratio and reports the
# group delay and reset seams the stage's stamp and flush rules are built on.
rubato = { version = "5.0", default-features = false }

# Hashing
sha2 = "0.10"
tempfile = "3.14"

# Typed bitflags (used by streamlib-surface-adapter)
bitflags = "2.6"

# Platform bindings (objc2 ecosystem - latest versions)
# Note: All objc2 crates must use compatible versions
objc2 = "0.6.3"
objc2-metal = "0.3.2"
objc2-io-surface = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-video = "0.3.2"
objc2-core-media = "0.3.2"
objc2-foundation = "0.3.2"
objc2-av-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-quartz-core = "0.3.2"
objc2-core-text = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-vision = "0.3.2"
libc = "0.2.177"

# Vulkan bindings (vendored tatolab fork — VMA 3.3.0 + Vulkan-Headers 1.4.309
# patches; Apache-2.0). The `package =` renames keep `use vulkanalia::` code
# untouched while the workspace resolves the vendored crates by path locally
# and by `version` from the package source in a published closure. See
# docs/architecture/vendored-vulkanalia.md.
vulkanalia = { package = "tatolab-vulkanalia", path = "vendor/tatolab-vulkanalia", version = "0.35.0", features = ["libloading", "provisional", "window"] }
vulkanalia-vma = { package = "tatolab-vulkanalia-vma", path = "vendor/tatolab-vulkanalia-vma", version = "0.9.0" }

# SPIR-V reflection for descriptor-set-layout validation in the compute-kernel RHI.
rspirv-reflect = "0.9.0"

# The engine's runtime GLSL compiler. `build-from-source` is not a preference:
# it forbids the build script's system-library probe, so the wheel can never
# link a `libshaderc.so` that happens to sit on the build machine. The crate
# carries shaderc, glslang, SPIRV-Tools and SPIRV-Headers as sources and links
# `libshaderc_combined.a`, which is what lets a kernel author need no shader
# toolchain at all. Pinned exact: the compiler version is part of the
# compilation cache key, and a silent minor bump would change emitted SPIR-V
# under a key that did not move.
shaderc = { version = "=0.10.1", features = ["build-from-source"] }

# DLPack v0.8 + v1.0 `#[repr(C)]` ABI mirrors for cross-framework
# zero-copy tensor handoff (PyTorch / JAX / NumPy `from_dlpack`).
# Pinned exact (`=0.6.0`) so the upgrade story is explicit — a layout
# change upstream is an API-break here, not a silent minor bump.
# `default-features = false` keeps the dep surface to `bitflags` +
# `snafu`; the optional `pyo3` / `ndarray` / `cudarc` features stay off
# so a consumer of this crate doesn't pick up Python or ML transitive deps.
dlpark = { version = "=0.6.0", default-features = false }

# CUDA bindings — used by `streamlib-adapter-cuda` (optional, behind its
# `cuda` Cargo feature) and by `streamlib-python-wheel` (unconditional,
# Linux-only) to import OPAQUE_FD Vulkan memory + timeline semaphores
# into CUDA via `cudaImportExternalMemory` /
# `cudaImportExternalSemaphore`. `fallback-dynamic-loading` means
# libcuda.so is only required at runtime — build hosts without a CUDA
# toolkit still compile, and runtime detection via
# `cudarc::runtime::sys::is_culib_present()` lets the adapter fail
# gracefully on CUDA-less machines.
#
# A fixed `cuda-*` feature (rather than `cuda-version-from-build-system`)
# keeps the build free of nvcc. The version is the FLOOR of every
# libcudart the process may dlopen, not the newest available: torch cu126
# wheels bundle libcudart 12.6 into the venv, and when that copy wins the
# dlopen race, any symbol newer than 12.6 in cudarc's table panics its
# loader. The external-memory + external-semaphore APIs we use predate
# 12.0, so the floor costs nothing. `default-features = false` skips
# cuBLAS / cuRAND / NVRTC; we only need `runtime`.
cudarc = { version = "0.19", default-features = false, features = ["driver", "runtime", "fallback-dynamic-loading", "cuda-12060"] }

# Skia bindings for the streamlib-adapter-skia crate.
#
# - `vulkan`: GrDirectContext + GrVkImageInfo + GrBackendRenderTarget
#   machinery needed to wrap a host-allocated VkImage as a SkSurface.
# - `binary-cache` (default): pull pre-built Skia binaries from the
#   rust-skia release tarballs instead of compiling Skia C++ from
#   source. Without this the build needs `git-sync-deps`, GN, ninja,
#   and 15+ minutes — way out of scope for this repo's CI.
#
# We deliberately do NOT enable `textlayout` / `embed-icudtl` / `pdf`
# (the rust-skia defaults) — those drag fontconfig + freetype + harfbuzz
# + ICU / harfbuzz-icu link deps that aren't available in dev-package
# form on a baseline Linux install. The text-rendering Python smoke
# test from the v1 issue body moves to the polyglot Skia follow-up
# along with the rest of the wrapper layer; the Rust adapter doesn't
# render text.
skia-safe = { version = "0.86", features = ["vulkan", "gl"] }

# Shader compilation
# TODO: Add when implementing HLSL shader compilation:
#   - hassle-rs (DXC wrapper for HLSL → SPIR-V)
#   - spirv-cross-rs (SPIR-V → Metal/Vulkan)

# WebRTC
str0m = "0.11.1"

# MoQ (Media over QUIC) - optional transport layer (cloudflare/moq-rs)
moq-transport = "0.14.1"
web-transport = "0.10"
quinn = "0.11"
rustls-native-certs = "0.8"

# HTTP/Web
axum = { version = "0.8.8", features = ["ws"] }
tower-http = "0.6.8"
hyper = "1.7.0"


# YUV/RGB conversion - REMOVED (now using GPU-accelerated VTPixelTransferSession)
# yuv = "0.8"


# The lint gates walk the whole tree — ~7400 files against every banned shape —
# so they are the one dev-profile build where codegen dominates. Three xtask
# tests each do a full-workspace scan, which unoptimised costs 155s of the
# workspace test run's 207s; at opt-level 3 the same binary finishes in 7.6s.
# Scoped to xtask alone so nothing else pays the compile time.
[profile.dev.package.xtask]
opt-level = 3
