# Member of the standalone `camera-rust-plugin` workspace — inherits its
# `[workspace.package]` fields and resolves every dependency by version
# via `[workspace.dependencies]`. No path deps.
[package]
name = "grayscale-plugin"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[lib]
# The crate root is generated from `processors/` before every cargo
# invocation (`cargo xtask generate-crate-roots` in-tree; the build
# orchestrator's pre-cargo staging step everywhere else). It is a build
# artifact — gitignored, and excluded from the packed `.slpkg`.
path = "_generated_rust_crate_root_/lib.rs"
crate-type = ["rlib", "cdylib"]


[dependencies]
streamlib-plugin-sdk = { workspace = true }
streamlib-macros = { workspace = true }
streamlib-plugin-abi = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
