[project]
name = "fisheye-object-detection"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "tatolab-stream>=0.54.3",
    # The tensor the detector runs on and the slice assignments that draw the
    # boxes. 2.10 is the floor where a frame's Metal DLPack capsule imports,
    # sliced tensors included.
    "torch>=2.10",
    # YOLOv8n and its weights fetcher. Pulls opencv and its own dependency set
    # — a detector is not a small dependency, and this stream is about what one
    # costs to wire up, not about avoiding it.
    "ultralytics>=8.3",
]
