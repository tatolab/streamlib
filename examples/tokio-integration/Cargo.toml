[package]
name = "tokio-integration"
version = "0.1.0"
edition = "2024"
publish = false

# A downstream consumer, not a workspace member. The empty `[workspace]` makes
# this directory its own workspace root, so `cargo run` from here builds it
# against the checkout it ships inside.
[workspace]

[dependencies]
# The one engine dependency. In-repo it resolves through the checkout beside
# it; out of tree the same app writes `streamlib = "0.18"`. No version
# requirement is stated on the path, because an example is never published and
# a bare path dependency always resolves.
streamlib = { path = "../../sdk/streamlib-sdk" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
# A bag is msgpack, and the engine hands a tap the bytes verbatim — so the
# async consumer decodes them with an ordinary msgpack crate.
rmp-serde = "1.3"
tracing = "0.1"
