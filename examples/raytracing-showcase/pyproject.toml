[project]
name = "raytracing-showcase"
version = "0.1.0"
requires-python = ">=3.12"
# Only the wheel. The scene is generated in Python, the shaders are strings
# the engine compiles, and no pixel ever reaches the host — so there is no
# third-party GPU package here at all.
dependencies = [
    "streamlib",
]

# streamlib is served from its own simple index until the PyPI publication that
# follows the project rename; everything else resolves from PyPI as usual.
[[tool.uv.index]]
name = "streamlib"
url = "https://tatolab.github.io/streamlib/simple/"
explicit = true

[tool.uv.sources]
streamlib = { index = "streamlib" }
