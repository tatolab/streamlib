[project]
name = "camera-python-effects"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "tatolab-stream>=0.54.3",
    "numpy>=2.1",
    # The overlay generator's 2D canvas, an ordinary PyPI dependency of this
    # stream like any other.
    "skia-python>=138",
    # Pose detection: 33 landmarks with real depth, model fetched once and
    # cached, CPU-fast — no torch, no CUDA stack to disagree with. 1.0.1's
    # macOS arm64 wheel aborts the process when the landmarker graph opens
    # ("graph_service.h: Service is unavailable" from its Metal helper).
    "mediapipe>=0.10.14,!=1.0.1",
    # The avatar's own GL world: offscreen render of the posed android.
    "moderngl>=5.10",
]

# The nodes live in an installable package, so `uv sync` installs it into the
# stream's venv and every node's child interpreter imports it by name.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/camera_python_effects"]

[project.optional-dependencies]
# The LeRobot bridge: `uv sync --extra lerobot`. Only the recorder node's
# child process imports it.
lerobot = ["lerobot[dataset]>=0.6"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# The stream's own package, so its imports sort as first-party.
src = ["src"]
