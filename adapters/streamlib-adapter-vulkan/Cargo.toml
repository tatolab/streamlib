[package]
name = "streamlib-adapter-vulkan"
description = "Vulkan-native StreamLib surface adapter (Linux). No-copy passthrough — exposes host-allocated VkImage to consumers that speak Vulkan natively. Canonical implementor of the VulkanWritable / VulkanImageInfoExt capability traits from streamlib-surface-adapter."
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true

[lib]
name = "streamlib_adapter_vulkan"
path = "src/lib.rs"

[dependencies]
streamlib-surface-adapter = { path = "../streamlib-surface-adapter", version = "0.18.59" }
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
streamlib-consumer-rhi = { path = "../../runtime/streamlib-consumer-rhi", version = "0.18.59" }
streamlib-surface-client = { path = "../../runtime/streamlib-surface-client", version = "0.18.59" }
vulkanalia.workspace = true
libc.workspace = true
serde = { workspace = true }
serde_json.workspace = true

[dev-dependencies]
tracing-subscriber.workspace = true

# `streamlib` and the helper-binary crate are *test*-only deps: the
# round-trip / conformance tests bring up a `HostVulkanDevice` and
# spawn the helper bin to exercise the host↔subprocess seam. The
# runtime crate (above) does NOT pull `streamlib`, so subprocess
# cdylibs depending on `streamlib-adapter-vulkan` get the consumer-rhi
# carve-out only, with `streamlib` absent from their dep graph. The
# same reason — see that crate's Cargo.toml for the rationale.
[target.'cfg(target_os = "linux")'.dev-dependencies]
streamlib-engine = { path = "../../runtime/streamlib-engine" }
streamlib = { path = "../../sdk/streamlib-sdk" }
serde = { workspace = true }
# Serialize Vulkan-device-touching tests; concurrent `VkDevice` /
# `VkInstance` creation on NVIDIA Linux trips the dual-device crash
# documented in `docs/learnings/nvidia-dual-vulkan-device-crash.md`.
serial_test = "3.2"

[[test]]
name = "conformance"
path = "tests/conformance.rs"

[[test]]
name = "sync_correctness"
path = "tests/sync_correctness.rs"

[[test]]
name = "write_excludes_read"
path = "tests/write_excludes_read.rs"

# Subprocess round-trip / crash tests — Linux only. They spawn the
# `vulkan_adapter_subprocess_helper` test binary that lives below.
[[test]]
name = "round_trip_host_writes_subprocess_reads"
path = "tests/round_trip_host_writes_subprocess_reads.rs"

[[test]]
name = "round_trip_subprocess_writes_host_reads"
path = "tests/round_trip_subprocess_writes_host_reads.rs"

[[test]]
name = "concurrent_reads_two_subprocesses"
path = "tests/concurrent_reads_two_subprocesses.rs"

[[test]]
name = "subprocess_crash_mid_write"
path = "tests/subprocess_crash_mid_write.rs"

[[test]]
name = "persistent_command_pool"
path = "tests/persistent_command_pool.rs"

[[test]]
name = "consumer_carve_out"
path = "tests/consumer_carve_out.rs"

# (a dev-dependency of this crate). Tests reach it via
# `env!("CARGO_BIN_EXE_vulkan_adapter_subprocess_helper")` — Cargo
# sets this when the helpers crate is referenced as a dev-dep.

[lints]
workspace = true

# Subprocess test helper. Built as a normal binary by `cargo test` and
# discovered at runtime via `env!("CARGO_BIN_EXE_…")`. Imports the
# host-exported DMA-BUF + timeline through the `streamlib-consumer-rhi`
# carve-out — the same path the wheel's helper children use — so
# `streamlib` never enters this crate's dep graph.
[[bin]]
name = "vulkan_adapter_subprocess_helper"
path = "tests/bin/vulkan_adapter_subprocess_helper.rs"
test = false
