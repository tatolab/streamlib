[package]
name = "streamlib-adapter-cuda"
description = "CUDA surface adapter (Linux). Imports a host-allocated Vulkan resource into a CUDA context via VK_KHR_external_memory_fd ↔ cudaImportExternalMemory + VK_KHR_external_semaphore_fd ↔ cudaImportExternalSemaphore. Foundation for GPU-resident AI inference (PyTorch / TensorRT / ONNX-Runtime CUDA backend) on subprocess customers without the CPU readback round-trip."
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true

[lib]
name = "streamlib_adapter_cuda"
path = "src/lib.rs"

[features]
# Default OFF. The feature does exactly one thing: pull optional `cudarc`
# in so the `cuda_carve_out` test (its `required-features`) compiles.
# Nothing in `src/` is feature-gated. cudarc must stay a regular optional
# dep rather than a dev-dep because Cargo has no optional dev-dependencies,
# and `dep:` can only name a real dependency. cudarc loads `libcuda.so`
# lazily via dlopen (`fallback-dynamic-loading`), so toolkit absence is a
# graceful runtime skip — enabling the feature never demands a CUDA
# toolkit on the builder.
default = []
cuda = ["dep:cudarc"]

[dependencies]
# DLPack ABI mirrors only — `default-features = false` pulls in only
# `bitflags` + `snafu`. Platform-agnostic and outside the Linux target
# table on purpose: the `dlpack` module is the workspace's home for the
# spec's `#[repr(C)]` types, and off-Linux consumers (the wheel's CPU
# capsule path) need exactly it.
dlpark.workspace = true
streamlib-surface-adapter = { path = "../streamlib-surface-adapter", version = "0.18.57" }
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
streamlib-consumer-rhi = { path = "../../runtime/streamlib-consumer-rhi", version = "0.18.57" }
streamlib-surface-client = { path = "../../runtime/streamlib-surface-client", version = "0.18.57" }
vulkanalia.workspace = true
libc.workspace = true
cudarc = { workspace = true, optional = true }

# `streamlib` is a *test*-only dep: the carve-out tests bring up a
# `HostVulkanDevice`, allocate an OPAQUE_FD-exportable buffer + timeline,
# and (under the `cuda` feature) import both into CUDA via cudarc to
# assert byte-equal. The runtime crate (above) does NOT pull `streamlib`,
# so helper processes depending on `streamlib-adapter-cuda` get the
# consumer-rhi carve-out only, with `streamlib` absent from their dep
# graph.
[target.'cfg(target_os = "linux")'.dev-dependencies]
streamlib-engine = { path = "../../runtime/streamlib-engine" }
streamlib = { path = "../../sdk/streamlib-sdk" }
tracing-subscriber.workspace = true
# Serialize Vulkan-device-touching tests; concurrent `VkDevice` /
# `VkInstance` creation on NVIDIA Linux trips the dual-device crash
# documented in `docs/learnings/nvidia-dual-vulkan-device-crash.md`.
serial_test = "3.2"
# The OPAQUE_FD round-trip tests drive the surface-share daemon directly
# so they exercise the same wire format helper processes consume.
serde_json.workspace = true
# Each test socket gets a directory of its own: the kernel answers uniqueness,
# and the socket is unlinked on drop instead of littering /tmp.
tempfile.workspace = true

[[test]]
name = "conformance"
path = "tests/conformance.rs"

[[test]]
name = "persistent_command_pool"
path = "tests/persistent_command_pool.rs"

[[test]]
name = "opaque_fd_consumer_rhi_round_trip"
path = "tests/opaque_fd_consumer_rhi_round_trip.rs"

[[test]]
name = "opaque_fd_image_consumer_rhi_round_trip"
path = "tests/opaque_fd_image_consumer_rhi_round_trip.rs"

[[test]]
name = "cuda_carve_out"
path = "tests/cuda_carve_out.rs"
required-features = ["cuda"]

[lints]
workspace = true
