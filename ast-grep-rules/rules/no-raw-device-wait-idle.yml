id: no-raw-device-wait-idle
language: rust
severity: error
message: A raw `device_wait_idle()` races concurrent queue submits; call `HostVulkanDevice::wait_idle`, which holds every per-queue mutex first.
note: >-
  vkDeviceWaitIdle is externally synchronized over the VkDevice and every queue it
  owns. A raw call that skips the per-queue mutexes races vkQueueSubmit2 and
  vkQueuePresentKHR during multi-processor setup and crashes the NVIDIA driver
  (UNASSIGNED-Threading-Info: vkDeviceWaitIdle(): Couldn't find VkQueue Object).
  The one raw call is `HostVulkanDevice::wait_idle` in
  vulkan/rhi/device/vulkan_device/queue_submission.rs. Test code is exempt.
files:
  - runtime/streamlib-engine/src/**/*.rs
ignores:
  - runtime/streamlib-engine/src/vulkan/rhi/device/vulkan_device/queue_submission.rs
  - "**/*_test.rs"
  - "**/*_tests.rs"
  - "**/tests.rs"
  - "**/tests/**"
rule:
  any:
    - pattern: $DEVICE.device_wait_idle($$$ARGUMENTS)
    - kind: identifier
      regex: '^device_wait_idle$'
      inside:
        kind: token_tree
      follows:
        regex: '^\.$'
      precedes:
        kind: token_tree
  not:
    matches: inside-rust-test-code
