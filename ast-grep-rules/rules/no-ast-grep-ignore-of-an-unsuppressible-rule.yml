id: no-ast-grep-ignore-of-an-unsuppressible-rule
language: rust
severity: error
message: This rule takes no `ast-grep-ignore`; fix the code it flags, or change the rule with the owner's say-so.
note: >-
  The rules listed here guard against faults that fail silently or only in a
  grandchild process, so none has a per-line way past it.
ignores:
  - "**/vendor/**"
rule:
  any:
    - kind: line_comment
    - kind: block_comment
  regex: 'ast-grep-ignore:.*\b(no-inheritable-descriptor|no-iceoryx2-node-outside-the-engine-owned-domain|no-iceoryx2-global-config|no-publish-subscribe-service-outside-the-engine-wrapper|no-ast-grep-ignore-of-an-unsuppressible-rule)\b'
