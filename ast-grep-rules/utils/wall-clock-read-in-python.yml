# A read of the wall clock in Python: `time.time()`, `time.time_ns()`,
# `datetime.now()`, `datetime.utcnow()`, `datetime.today()`, and the
# `CLOCK_REALTIME` clock ids (`_COARSE` and `_ALARM` too).
id: wall-clock-read-in-python
language: python
rule:
  any:
    - kind: call
      has:
        field: function
        kind: attribute
        all:
          - has:
              field: object
              regex: '(^|\.)\s*time$'
          - has:
              field: attribute
              regex: '^time(_ns)?$'
    - kind: call
      has:
        field: function
        kind: attribute
        all:
          - has:
              field: object
              regex: '(^|\.)\s*datetime$'
          - has:
              field: attribute
              regex: '^(now|utcnow|today)$'
    - kind: identifier
      regex: '^CLOCK_REALTIME'
