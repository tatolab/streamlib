# Code that only builds or runs under test: an item under `#[cfg(test)]`, a
# `#[test]` or `#[tokio::test]` function, or a file whose first attribute is
# `#![cfg(test)]` or `#![cfg(all(test, …))]`. A rule that exempts test code
# adds `not: { matches: inside-rust-test-code }`; files that are test code by
# name are left out with the rule's `ignores`.
id: inside-rust-test-code
language: rust
rule:
  any:
    - inside:
        stopBy: end
        follows:
          stopBy:
            not:
              any:
                - kind: attribute_item
                - kind: line_comment
                - kind: block_comment
          kind: attribute_item
          regex: '^#\[(cfg\((all\()?test\b|(\w+::)*test[(\]])'
    - inside:
        stopBy: end
        kind: source_file
        has:
          kind: inner_attribute_item
          regex: '^#!\[cfg\((all\()?test\b'
