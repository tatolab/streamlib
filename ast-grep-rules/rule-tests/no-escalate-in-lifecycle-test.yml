id: no-escalate-in-lifecycle
valid:
  - |
    impl Processor for P {
        fn process(&mut self, ctx: &RuntimeContextLimitedAccess<'_>) -> Result<()> {
            ctx.gpu_limited_access().escalate(|gpu| gpu.do_it())
        }
    }
  - |
    impl Processor for P {
        fn setup(&mut self, ctx: &RuntimeContextFullAccess<'_>) -> Result<()> {
            ctx.gpu_full_access().do_it()
        }
    }
  - |
    impl Processor for P {
        fn start(&mut self, ctx: &RuntimeContextLimitedAccess<'_>) -> Result<()> {
            ctx.gpu_limited_access().escalate(|gpu| gpu.do_it())
        }
    }
  - |
    fn setup(config: &Config) -> Result<()> {
        limited.escalate(|gpu| gpu.do_it())
    }
  - |
    fn run_my_smoke(&self, ctx: &RuntimeContextFullAccess<'_>) -> Result<()> {
        ctx.gpu_limited_access().escalate(|gpu| gpu.do_it())
    }
  - |
    impl Processor for P {
        fn process(&mut self, ctx: &RuntimeContextLimitedAccess<'_>) -> Result<()> {
            expect_ok!(ctx.gpu_limited_access().escalate(|gpu| gpu.do_it()));
            Ok(())
        }
    }
invalid:
