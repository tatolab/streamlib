    impl Processor for P {
        fn setup(&mut self, ctx: &RuntimeContextFullAccess<'_>) -> Result<()> {
            ctx.gpu_limited_access().escalate(|gpu| gpu.do_it())
        }
    }
  - |
    impl P {
        fn setup_inner(&mut self, ctx: &RuntimeContextFullAccess<'_>) -> Result<()> {
            ctx.gpu_limited_access().escalate(|gpu| gpu.do_it())?;
            Ok(())
        }
    }
  - |
    impl Processor for P {
        fn teardown(&mut self, ctx: &RuntimeContextFullAccess<'_>) -> Result<()> {
            ctx.gpu_limited_access().escalate::<()>(|gpu| gpu.do_it())
        }
    }
  - |
    impl Processor for P {
        fn stop(
            &mut self,
            ctx: &streamlib::sdk::context::RuntimeContextFullAccess<'_>,
        ) -> Result<()> {
            ctx.gpu_limited_access().escalate(|gpu| gpu.do_it())
        }
    }
  - |
    impl Processor for P {
        fn start(&mut self, ctx: &RuntimeContextFullAccess<'_>) -> Result<()> {
            let run = || ctx.gpu_limited_access().escalate(|gpu| gpu.do_it());
            run()
        }
    }
  - |
    impl Processor for P {
        fn setup(&mut self, ctx: &RuntimeContextFullAccess<'_>) -> Result<()> {
            assert!(ctx.gpu_limited_access().escalate(|_| true).is_ok());
            Ok(())
        }
    }
  - |
    impl Processor for P {
        fn setup(&mut self, ctx: &RuntimeContextFullAccess<'_>) -> Result<()> {
            expect_ok!(ctx.gpu_limited_access().escalate::<()>(|gpu| gpu.do_it()));
            Ok(())
        }
    }
