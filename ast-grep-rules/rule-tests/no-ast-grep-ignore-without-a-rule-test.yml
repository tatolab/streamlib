id: no-ast-grep-ignore-without-a-rule
valid:
  - |
    // ast-grep-ignore: no-device-api-version-read
    let reported = properties.api_version;
  - "// a comment about ast-grep-ignore comments in general: they name a rule"
invalid:
  - |
    // ast-grep-ignore
    let reported = properties.api_version;
  - "let reported = properties.api_version; /* ast-grep-ignore */"
