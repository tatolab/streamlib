id: no-ast-grep-ignore-of-an-unsuppressible-rule
valid:
  - |
    // ast-grep-ignore: no-device-api-version-read
    let reported = properties.api_version;
  - "// no-inheritable-descriptor refuses a plain libc::dup"
invalid:
  - |
    // ast-grep-ignore: no-inheritable-descriptor
    let fd = unsafe { libc::dup(fd) };
  - |
    // ast-grep-ignore: no-device-api-version-read, no-iceoryx2-global-config
    let config = Config::global_config();
  - "// ast-grep-ignore: no-ast-grep-ignore-of-an-unsuppressible-rule"
