  - "let node = NodeBuilder::new().create::<ipc::Service>()?;"
  - "let node = iceoryx2::prelude::NodeBuilder::new().create::<ipc::Service>()?;"
  - "let node = expect_ok!(NodeBuilder::new().create::<ipc::Service>());"
  - |
    #[cfg(test)]
    mod tests {
        fn node() { let _ = NodeBuilder::new().create::<ipc::Service>(); }
    }
