    pub fn create_iceoryx2_node_in_domain(config: &Config) -> Result<Node<ipc::Service>> {
        NodeBuilder::new().config(config).create::<ipc::Service>()
    }
  - "let node = Iceoryx2Node::for_this_test_process()?;"
  - "// NodeBuilder::new() reads the ambient configuration"
