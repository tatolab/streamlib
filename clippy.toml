disallowed-macros = [
    { path = "std::println", reason = "Use tracing::info! / tatolab.stream.log.info() instead" },
    { path = "std::eprintln", reason = "Use tracing::warn! / tracing::error! / tatolab.stream.log.warn() instead" },
    { path = "std::print", reason = "Use tracing::info! / tatolab.stream.log.info() instead" },
    { path = "std::eprint", reason = "Use tracing::warn! / tracing::error! / tatolab.stream.log.warn() instead" },
    { path = "std::dbg", reason = "Use tracing::debug! instead" },
]
