# The test runs CI makes with cargo-nextest. `ci.yml` builds every test target
# of the selected packages once and runs these filters over that one build;
# `cargo xtask run-local-ci-gates` runs the same profiles.

[profile.default]
# A hang is a finding: a test still running after five minutes is killed and
# fails.
slow-timeout = { period = "60s", terminate-after = 5 }

# trybuild compiles its fail cases against the engine in a target directory of
# its own, shaderc's C++ included.
[[profile.default.overrides]]
filter = "binary_id(streamlib-engine::compile_fail_config_without_json_schema)"
slow-timeout = { period = "60s", terminate-after = 25 }

[profile.ci]
fail-fast = false
# The deviceless half of the Linux suite. CI's Linux runner has no Vulkan
# device, so `streamlib-engine`'s lib and integration tests run by name: each
# entry below needs no GPU, camera, display or audio device. Named one by one
# rather than by module prefix, so a device test cannot join without someone
# adding it. Every other test target these packages hold is still compiled.
default-filter = """
  (
      package(streamlib)
    | package(streamlib-runtime-client-contract)
    | package(tatolab-cli)
    | (package(streamlib-macros) & kind(lib))
    | (package(streamlib-processor-schema) & kind(lib))
    | (package(streamlib-ipc-types) & kind(lib))
    | (package(streamlib-surface-client) & kind(lib))
    | (package(streamlib-error) & kind(lib))
    | (package(streamlib-consumer-rhi) & kind(lib))
    | (package(streamlib-python-wheel) & kind(lib))
    | (package(streamlib-media-builtins) & (kind(lib) | binary_id(streamlib-media-builtins::every_golden_graph_loads)))
  )
  | (
      binary_id(streamlib-engine::attribute_macro_test)
    | binary_id(streamlib-engine::graph_snapshot_round_trip_test)
    | binary_id(streamlib-engine::node_name_test)
    | binary_id(streamlib-engine::rust_port_name_cast_test)
    | binary_id(streamlib-engine::unknown_processor_type_test)
    | binary_id(streamlib-engine::output_port_exposure_test)
    | binary_id(streamlib-engine::compile_fail_config_without_json_schema)
    | binary_id(streamlib-engine::silent_null_arm_plays_what_it_is_given)
    | binary_id(streamlib-engine::silent_null_arm_captures_without_ever_dying)
