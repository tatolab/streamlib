[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tatolab-ops"
version = "0.68.34"
description = "The small function nodes every Tatolab stream can wire: shaping, time and values, compiled to native code."
readme = "README.md"
requires-python = ">=3.12"
license = "BUSL-1.1"
license-files = ["LICENSE"]
authors = [{ name = "Jonathan Fontanez", email = "fontanezj1@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
# The stream package, and Numba, which compiles each node's body when the
# helper that reads it loads. A minimum, never an exact pin.
dependencies = ["tatolab-stream>=0.68.32", "numba>=0.61"]

# The node catalog lists these in every stream whose environment installs this
# distribution, before a graph names them.
[project.entry-points."tatolab.nodes"]
Lfo = "tatolab.ops:Lfo"
Remap = "tatolab.ops:Remap"
Clamp = "tatolab.ops:Clamp"

[project.urls]
Homepage = "https://tatolab.com"
Install = "https://tatolab.com/docs/install"
Source = "https://github.com/tatolab/streamlib"

[dependency-groups]
test = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
# `tatolab` is a PEP 420 namespace shared with `tatolab.stream`, so no
# distribution ships `tatolab/__init__.py`.
packages = ["python/tatolab"]
exclude = ["**/__pycache__"]

[tool.hatch.build.targets.sdist]
only-include = ["python/tatolab", "tests", "README.md", "pyproject.toml", "hatch_build.py"]
exclude = ["**/__pycache__"]

[tool.hatch.build.targets.sdist.hooks.custom]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["python", "tests"]
extraPaths = ["python"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
