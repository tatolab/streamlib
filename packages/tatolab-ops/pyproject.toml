[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tatolab-ops"
version = "0.68.73"
description = "The small function nodes every Tatolab stream can wire: math, shaping, logic, gating, values, noise and time, compiled to native code."
readme = "README.md"
requires-python = ">=3.12"
license = "BUSL-1.1"
license-files = ["LICENSE"]
authors = [{ name = "Jonathan Fontanez", email = "fontanezj1@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
# The stream package; Numba, which compiles each node's body when the helper
# that reads it loads; and NumPy and Pillow, with which `ImageFile` decodes an
# image asset. A minimum, never an exact pin.
dependencies = ["tatolab-stream>=0.68.73", "numba>=0.61", "numpy>=1.26", "pillow>=10.0"]  # x-release-please-version

# The node catalog lists these in every stream whose environment installs this
# distribution, before a graph names them.
[project.entry-points."tatolab.nodes"]
Add = "tatolab.ops:Add"
Subtract = "tatolab.ops:Subtract"
Multiply = "tatolab.ops:Multiply"
Divide = "tatolab.ops:Divide"
Power = "tatolab.ops:Power"
Minimum = "tatolab.ops:Minimum"
Maximum = "tatolab.ops:Maximum"
Absolute = "tatolab.ops:Absolute"
Modulo = "tatolab.ops:Modulo"
Lerp = "tatolab.ops:Lerp"
Clamp = "tatolab.ops:Clamp"
Remap = "tatolab.ops:Remap"
Smoothstep = "tatolab.ops:Smoothstep"
Step = "tatolab.ops:Step"
Compare = "tatolab.ops:Compare"
Switch = "tatolab.ops:Switch"
Select = "tatolab.ops:Select"
Constant = "tatolab.ops:Constant"
Random = "tatolab.ops:Random"
PerlinNoise = "tatolab.ops:PerlinNoise"
Lfo = "tatolab.ops:Lfo"
Timer = "tatolab.ops:Timer"
Lag = "tatolab.ops:Lag"
Trigger = "tatolab.ops:Trigger"
Counter = "tatolab.ops:Counter"
SampleAndHold = "tatolab.ops:SampleAndHold"
Feedback = "tatolab.ops:Feedback"
Gate = "tatolab.ops:Gate"
HoldFrame = "tatolab.ops:HoldFrame"
ImageFile = "tatolab.ops.image_file:ImageFile"

[project.urls]
Homepage = "https://tatolab.com"
Install = "https://tatolab.com/docs/install"
Source = "https://github.com/tatolab/streamlib"

[dependency-groups]
test = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
# `tatolab` is a PEP 420 namespace shared with `tatolab.stream`, so no
# distribution ships `tatolab/__init__.py`.
packages = ["python/tatolab"]
exclude = ["**/__pycache__"]

[tool.hatch.build.targets.sdist]
only-include = ["python/tatolab", "tests", "README.md", "pyproject.toml", "hatch_build.py"]
exclude = ["**/__pycache__"]

[tool.hatch.build.targets.sdist.hooks.custom]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["python", "tests"]
extraPaths = ["python"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
