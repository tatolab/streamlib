[project]
name = "tatolab-core-nodes"
version = "0.1.0"
requires-python = ">=3.12"
# Numba compiles each number node's body when the helper that reads it loads;
# NumPy and Pillow decode an `ImageFile`'s asset.
dependencies = ["tatolab-stream>=0.54.3", "numba>=0.61", "numpy>=2.1", "pillow>=10.0"]

[dependency-groups]
test = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
