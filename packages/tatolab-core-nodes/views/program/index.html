<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Program</title>
<link rel="stylesheet" href="program_view.css">
</head>
<body>
<main class="program">
  <div class="program-picture">
    <canvas class="program-picture-canvas" aria-label="The picture wired into video"></canvas>
    <p class="program-picture-notice" role="status"></p>
  </div>
  <div class="program-audio">
    <div class="program-audio-meters" role="img" aria-label="Audio level per channel"></div>
    <p class="program-audio-notice" role="status"></p>
  </div>
</main>
<script type="module" src="program_view.js"></script>
</body>
</html>
