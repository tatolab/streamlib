package:
  org: tatolab
  name: test-fixtures
  version: 1.0.0
  description: "Attribute-macro test fixtures (TestConfiguredProcessor) for streamlib SDK macro contract tests"

dependencies:
  "@tatolab/core": "^1.0.0"

# Dev-time path override; `streamlib pkg publish` rejects this.
patch:
  "@tatolab/core":
    path: ../core

schemas:
  # Local config schema this package owns.
  TestConfiguredProcessorConfig:
    file: schemas/test_configured_processor_config.yaml
  GpuAcquireTestProcessorConfig:
    file: schemas/gpu_acquire_test_processor_config.yaml
  EscalateSmokeTestProcessorConfig:
    file: schemas/escalate_smoke_test_processor_config.yaml
  ComputeKernelTestProcessorConfig:
    file: schemas/compute_kernel_test_processor_config.yaml
  GraphicsKernelSmokeTestProcessorConfig:
    file: schemas/graphics_kernel_smoke_test_processor_config.yaml
  RayTracingKernelSmokeTestProcessorConfig:
    file: schemas/ray_tracing_kernel_smoke_test_processor_config.yaml
  LifecycleProbeProcessorConfig:
    file: schemas/lifecycle_probe_processor_config.yaml
  PanickingManualLifecycleProcessorConfig:
    file: schemas/panicking_manual_lifecycle_processor_config.yaml
  PanickingContinuousLifecycleProcessorConfig:
    file: schemas/panicking_continuous_lifecycle_processor_config.yaml
  ConcurrentEscalateTestProcessorConfig:
    file: schemas/concurrent_escalate_test_processor_config.yaml

processors:
  - name: TestConfiguredProcessor
    description: "Attribute-macro test fixture verifying config-emit against a streamlib.yaml package block"
    execution: continuous
    config:
      name: config
      schema: TestConfiguredProcessorConfig

  - name: GpuAcquireTestProcessor
    description: "GPU integration test fixture — exercises acquire_pixel_buffer, plane_base_address_pixel_buffer, and the pixel-buffer lifecycle through GpuContextLimitedAccess"
    execution: manual
    config:
      name: config
      schema: GpuAcquireTestProcessorConfig

  - name: EscalateSmokeTestProcessor
    description: "Escalate smoke test fixture — runs gpu.escalate(|_full| Ok(())) end-to-end through escalate_begin/escalate_end and FullAccess construction"
    execution: manual
    config:
      name: config
      schema: EscalateSmokeTestProcessorConfig

  - name: ComputeKernelTestProcessor
    description: "Compute-kernel CPU-reference integration test fixture — creates a kernel via FullAccess, allocates input + output storage buffers via LimitedAccess, dispatches output[i] = input[i] * 2, and asserts CPU-reference match"
    execution: manual
    config:
      name: config
      schema: ComputeKernelTestProcessorConfig

  - name: GraphicsKernelSmokeTestProcessor
    description: "Graphics-kernel smoke test fixture — creates a graphics kernel via FullAccess, acquires a render-target Texture, runs a single offscreen_render() to assert the binding methods don't panic. Smoke-only; pixel correctness not asserted."
    execution: manual
    config:
      name: config
      schema: GraphicsKernelSmokeTestProcessorConfig

  - name: RayTracingKernelSmokeTestProcessor
    description: "Ray-tracing-kernel smoke test fixture — builds a single-triangle BLAS + identity TLAS via FullAccess, creates an RT kernel, acquires a STORAGE_BINDING Texture, runs a single trace_rays() to assert the binding methods (set_acceleration_structure / set_storage_image / set_push_constants / trace_rays) don't panic. Smoke-only; pixel correctness not asserted."
    execution: manual
    config:
      name: config
      schema: RayTracingKernelSmokeTestProcessorConfig

  - name: LifecycleProbeProcessor
    description: "Lifecycle-probe processor — appends marker lines for each lifecycle hook (setup / process / on_pause / on_resume / teardown) to a file so the integration test can confirm every hook dispatched correctly."
    execution: continuous
    config:
      name: config
      schema: LifecycleProbeProcessorConfig

  - name: PanickingManualLifecycleProcessor
    description: "Panic-injection Manual fixture. Panics in the configured lifecycle hook (setup / start / stop / teardown / on_pause / on_resume); the host's panic-safety net is expected to absorb the panic and keep the runtime alive."
    execution: manual
    config:
      name: config
      schema: PanickingManualLifecycleProcessorConfig

  - name: PanickingContinuousLifecycleProcessor
    description: "Panic-injection Continuous fixture. Panics in the configured lifecycle hook (process); the host's panic-safety net is expected to absorb the panic and keep the runtime alive."
    execution: continuous
    config:
      name: config
      schema: PanickingContinuousLifecycleProcessorConfig

  - name: ConcurrentEscalateTestProcessor
    description: "Concurrent-escalate fixture. Spawns thread_count threads from start(); each clones gpu_limited_access() and calls escalate concurrently. Output captures overlap count; expected overlaps=0 — proves the escalate gate serializes concurrent callers."
    execution: manual
    config:
      name: config
      schema: ConcurrentEscalateTestProcessorConfig
