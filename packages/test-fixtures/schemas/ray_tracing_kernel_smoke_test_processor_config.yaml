#
# Test-only config schema for the ray-tracing-kernel smoke test. The
# processor:
#   1. Builds a single-triangle BLAS + identity TLAS via FullAccess
#      (build_triangles_blas / build_tlas).
#   2. Creates a ray-tracing kernel via FullAccess
#      (create_ray_tracing_kernel).
#   3. Acquires a STORAGE_BINDING + COPY_SRC render-target Texture via
#      LimitedAccess (acquire_texture).
#   4. Exercises the binding methods (set_acceleration_structure,
#      set_storage_image, set_push_constants) plus trace_rays()
#      end-to-end.
#   5. Writes "OK" (or "ERR:<message>") to the configured output_path.
#
# The smoke test asserts the calls don't panic and the processor's
# start() body completes without an error code — it does NOT compare
# pixel output to a CPU reference. If the device doesn't support
# ray-tracing pipelines (no VK_KHR_ray_tracing_pipeline), the
# processor writes "OK" without exercising the kernel — the runtime
# itself must succeed regardless; per-platform RT capability is a
# host concern.

metadata:
  type: RayTracingKernelSmokeTestProcessorConfig
  description: "Test config schema for the ray-tracing-kernel smoke test."

properties:
  output_path:
    metadata:
      description: "Filesystem path where the processor writes its result. Format: 'OK' on success, 'ERR:<message>' on failure."
    type: string
