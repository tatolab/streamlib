#
# Test-only config schema for the escalate smoke test. The processor
# runs `gpu.escalate(|_full| Ok(()))` once and writes "OK" or
# "ERR:<msg>" to `output_path`, exercising the escalate scope
# end-to-end.

metadata:
  type: EscalateSmokeTestProcessorConfig
  description: "Test config schema for the escalate smoke test."

properties:
  output_path:
    metadata:
      description: "Filesystem path where the processor writes its result. Format: 'OK' on success, 'ERR:<message>' on failure."
    type: string
