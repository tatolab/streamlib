#
# Test-only config schema for the panic-injection lifecycle Manual
# processor. `panic_at_hook` names which hook the processor panics in
# (`setup`, `start`, `stop`, `teardown`, `on_pause`, `on_resume`, or
# `"none"` for the no-panic baseline). All other hooks no-op. The
# companion integration test loads this fixture, runs the runtime, and
# asserts the host's panic-safety net caught the panic instead of
# letting it crash the runtime.

metadata:
  type: PanickingManualLifecycleProcessorConfig
  description: "Test config schema for the panic-injection Manual lifecycle processor."

properties:
  panic_at_hook:
    metadata:
      description: "Name of the hook to inject a panic in. One of: setup, start, stop, teardown, on_pause, on_resume, or 'none' for the no-panic baseline."
    type: string
