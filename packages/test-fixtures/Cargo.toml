[package]
name = "streamlib-test-fixtures"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false
description = "Attribute-macro test fixtures (TestConfiguredNode) for streamlib SDK macro contract tests."
keywords = ["streamlib", "test-fixtures", "macros"]
categories = ["development-tools::testing"]

[lib]
name = "streamlib_test_fixtures"
crate-type = ["rlib"]

[dependencies]
# Engine substrate — runtime context and node traits.
streamlib = { path = "../../sdk/streamlib-sdk", version = "0.69.91" }


# Serialization (config dataclass ships as serde-derived).
serde.workspace = true

[dev-dependencies]
# Round-trip assertions pinning each fixture config's JSON encoding.
serde_json.workspace = true

[build-dependencies]
# Compiles the fixtures' shaders for `include_bytes!`.
streamlib-slang-shader-compiler = { path = "../../runtime/streamlib-slang-shader-compiler", version = "0.69.91" }

[lints]
workspace = true
