[package]
name = "streamlib-test-fixtures"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false
description = "Attribute-macro test fixture nodes for streamlib SDK macro contract tests."
keywords = ["streamlib", "test-fixtures", "macros"]
categories = ["development-tools::testing"]

[lib]
name = "streamlib_test_fixtures"
crate-type = ["rlib"]

[dependencies]
# Engine substrate — runtime context and node traits.
streamlib = { path = "../../sdk/streamlib-sdk", version = "0.69.220" }

# Serialization (each fixture's settings are serde-derived).
serde.workspace = true

[build-dependencies]
# Compiles the fixtures' shaders for `include_bytes!`.
streamlib-slang-shader-compiler = { path = "../../runtime/streamlib-slang-shader-compiler", version = "0.69.220" }

[lints]
workspace = true
