[package]
name = "streamlib-test-fixtures"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false
description = "Attribute-macro test fixture nodes for streamlib SDK macro contract tests."
keywords = ["streamlib", "test-fixtures", "macros"]
categories = ["development-tools::testing"]

[lib]
name = "streamlib_test_fixtures"
crate-type = ["rlib"]

[dependencies]
# Engine substrate — runtime context and node traits.
streamlib = { path = "../../sdk/streamlib-sdk", version = "0.70.35" }

[dev-dependencies]
# A stream the lifecycle tests run a fixture in, on the engine's test project.
streamlib = { path = "../../sdk/streamlib-sdk", version = "0.70.35", features = ["test-support"] }
# The diagnostic a failed build reports.
streamlib-runtime-client-contract = { path = "../../runtime/streamlib-runtime-client-contract", version = "0.70.35" }
tempfile.workspace = true
serial_test = "3.2"

[features]
# Tier 2: the lifecycle tests start a stream, which creates the engine's GPU context.
hardware-tests = ["streamlib/hardware-tests"]

[build-dependencies]
# Compiles the fixtures' shaders for `include_bytes!`.
streamlib-slang-shader-compiler = { path = "../../runtime/streamlib-slang-shader-compiler", version = "0.70.35" }

[lints]
workspace = true
