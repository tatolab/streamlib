[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "tatolab-camera"
version = "0.1.0"
description = "A camera node as an extension wheel: V4L2 or AVFoundation capture handed to the engine as DMA-BUFs or IOSurfaces and converted on the GPU, with no CPU copy."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BUSL-1.1" }
license-files = ["LICENSE"]
authors = [{ name = "Jonathan Fontanez", email = "fontanezj1@gmail.com" }]
# A minimum, never an exact pin, as a third party's package depends on it.
dependencies = ["tatolab-stream>=0.68.7"]

[project.entry-points."tatolab.nodes"]
CameraSource = "tatolab.camera.camera_source:CameraSource"
CaptureToDownstreamLatencyProbe = "tatolab.camera.capture_to_downstream_latency_probe:CaptureToDownstreamLatencyProbe"

[tool.maturin]
python-source = "python"
module-name = "tatolab.camera._native"
features = ["pyo3/extension-module"]

[tool.pyright]
include = ["python", "streams"]
extraPaths = ["python"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
reportMissingModuleSource = "none"
