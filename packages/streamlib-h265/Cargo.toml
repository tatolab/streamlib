[package]
name = "streamlib-h265"
version = "0.68.97"
edition = "2024"
rust-version = "1.88"
authors = ["Jonathan Fontanez <fontanezj1@gmail.com>"]
description = "H.265 encode and decode for StreamLib on Vulkan Video or VideoToolbox, as the tatolab-h265 extension wheel."
repository = "https://github.com/tato123/streamlib"
license = "BUSL-1.1"
publish = false

# `_native` is the module `tatolab.h265.processors` imports. cdylib only:
# nothing links this crate as a Rust library.
[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
# abi3-py312 matches the streamlib wheel's floor, so one built artifact covers
# CPython 3.12 and every later GIL-enabled release.
pyo3 = { version = "0.29.2", features = ["abi3-py312"] }
# The module host table the coding threads read and write their node's ports
# through, with no Python attached.
tatolab-module-sdk = { path = "../../sdk/tatolab-module-sdk", version = "1.11.0", features = ["pyo3"] }
# The encoder and decoder node bodies, shared with tatolab-h264: on Linux they
# code on a Vulkan device this helper owns, on macOS on VideoToolbox.
streamlib-owned-device-video-codec-nodes = { path = "../../runtime/streamlib-owned-device-video-codec-nodes", version = "0.68.97" }

# Not a member of the engine workspace: an extension wheel is built exactly as a
# third party would build one, with its own root, its own lockfile and its own
# release cadence.
[workspace]
