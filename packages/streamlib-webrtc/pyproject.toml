[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "streamlib-webrtc"
version = "0.3.0"
description = "WHIP publish and WHEP play for StreamLib."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BUSL-1.1" }
# PEP 639. What lands in `.dist-info/licenses/`, which is the only way a wheel
# discharges the reproduce-the-notice terms it ships under: `LICENSE` for our
# own, `THIRD-PARTY-NOTICES.md` for every dependency's. The SPDX id above says
# BUSL-1.1 and nothing about who the Licensor is or when the Change Date falls
# — the parameters are the licence, so the text has to travel too.
#
# `LICENSE` is a symlink to the repo root, which maturin follows; the notices
# are this project's own, generated over its own closure by `cargo xtask
# generate-third-party-notices --extension-package-directory <this directory>`.
# The engine wheel's notices cover the engine wheel and are not inherited here.
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md"]
authors = [{ name = "Jonathan Fontanez", email = "fontanezj1@gmail.com" }]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Multimedia :: Video",
]
# The engine is a binary dependency, never a source one: this wheel links no
# streamlib crate and speaks no engine internals.
#
# What this wheel needs arrived across two releases: the capability-extension
# mechanism `extension.py:load` is declared against in 0.18.48, and
# `read_from_inbound_link_with_timestamp`, which every bag is read through, in
# 0.18.49. Both resolved by `git describe --contains` on the commit that
# introduced each into `_engine.pyi`, not from a changelog.
#
# The binding half is newer than both and cannot be named. These processors take
# a config class, which only an engine whose helper constructs one can host, and
# that engine ships in the release *after* this floor was last touched — a
# version the ceiling rule below forbids naming. So 0.20.0 is the highest floor
# that is legal here, not the floor that is true: an install against exactly
# 0.20.0 resolves and then fails in the helper child. Bump this to the release
# carrying config-class hosting once it exists.
#
# The ceiling is the last *published* engine version, not the one in the tree.
# Two lanes install this wheel and they resolve differently: the PR lane
# installs the engine wheel built from this same checkout, while the release
# lane installs from the published index, which is rebuilt only after the
# extension wheels are built. So a floor naming the engine version released in
# the same run would fail the release smoke test.
dependencies = ["streamlib>=0.20.0"]

# What pip records at install and the engine reads back through
# `importlib.metadata` when a process takes an engine role.
[project.entry-points."streamlib.extensions"]
webrtc = "streamlib_webrtc.extension:load"

[tool.maturin]
python-source = "python"
module-name = "streamlib_webrtc._native"
features = ["pyo3/extension-module"]

[tool.pyright]
include = ["python", "tests"]
# The package is checked from source, not from an install, so `tests/` needs the
# package root on the search path.
extraPaths = ["python"]
# Checked at the version floor rather than whatever interpreter the venv happens
# to be — `requires-python` is the promise.
pythonVersion = "3.10"
# Standard rather than strict, matching the engine wheel: strict turns on
# `reportPrivateUsage`, which fights the `_native` shape this package is built
# on, and demands annotations on every pytest fixture parameter.
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
# `_native` is a compiled artifact, so a checkout has the stub and not the `.so`
# it describes. `mypy.stubtest` is what checks the stub against the real binary.
reportMissingModuleSource = "none"

[tool.pytest.ini_options]
markers = [
    "requires_gpu: needs a real GPU; deselected in CI with -m 'not requires_gpu'",
]
