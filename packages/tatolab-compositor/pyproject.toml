[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tatolab-compositor"
version = "0.68.83"
description = "Video compositing nodes for Tatolab streams: layer frames with alpha on the GPU."
readme = "README.md"
requires-python = ">=3.12"
license = "BUSL-1.1"
license-files = ["LICENSE"]
authors = [{ name = "Jonathan Fontanez", email = "fontanezj1@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Typing :: Typed",
]
# The stream package and nothing of the engine: the node runs in a processor
# interpreter, which borrows `tatolab.runtime` from the runtime that starts it.
# A minimum, never an exact pin, as a third party's package depends on it.
dependencies = ["tatolab-stream>=0.68.83"]  # x-release-please-version

# The node catalog lists this in every stream whose environment installs this
# distribution, before a graph names it.
[project.entry-points."tatolab.nodes"]
AlphaOverCompositor = "tatolab.compositor.alpha_over_compositor:AlphaOverCompositor"

[project.urls]
Homepage = "https://tatolab.com"
Install = "https://tatolab.com/docs/install"
Source = "https://github.com/tatolab/streamlib"

[dependency-groups]
test = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
# `tatolab` is a PEP 420 namespace shared with `tatolab.stream`, so no
# distribution ships `tatolab/__init__.py`.
packages = ["python/tatolab"]
exclude = ["**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["python", "tests"]
extraPaths = ["python"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
