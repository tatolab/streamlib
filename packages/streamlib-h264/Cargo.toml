[package]
name = "streamlib-h264"
version = "0.68.10"
edition = "2024"
rust-version = "1.88"
authors = ["Jonathan Fontanez <fontanezj1@gmail.com>"]
description = "H.264 encode for StreamLib on a Vulkan device the module owns, as the tatolab-h264 extension wheel."
repository = "https://github.com/tato123/streamlib"
license = "BUSL-1.1"
publish = false

# `_native` is the module `tatolab.h264.processors` imports. cdylib only:
# nothing links this crate as a Rust library.
[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
# abi3-py310 matches the streamlib wheel's floor, so one built artifact covers
# CPython 3.10 and every later GIL-enabled release.
pyo3 = { version = "0.29.2", features = ["abi3-py310"] }
# The module host table the encoder's thread reads and writes its node's ports
# through, with no Python attached.
tatolab-module-sdk = { path = "../../sdk/tatolab-module-sdk", version = "1.0.0", features = ["pyo3"] }
serde = { version = "1.0", features = ["derive"] }
rmp-serde = "1.3"
tracing = "0.1.44"
# The H.273 colour vocabulary the SPS VUI is minted from, and on Linux the
# owned-device tier the encoder runs on.
streamlib-consumer-rhi = { path = "../../runtime/streamlib-consumer-rhi", version = "0.68.9" }

# The Vulkan Video encoder and the surface-share wire a published frame is
# checked out over. Linux only: the encoder is Vulkan Video.
[target.'cfg(target_os = "linux")'.dependencies]
streamlib-vulkan-video = { path = "../../runtime/streamlib-vulkan-video", version = "0.68.9" }
streamlib-surface-client = { path = "../../runtime/streamlib-surface-client", version = "0.68.9" }

# Not a member of the engine workspace: an extension wheel is built exactly as a
# third party would build one, with its own root, its own lockfile and its own
# release cadence.
[workspace]
