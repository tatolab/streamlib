#
# JSON Type Definition (RFC 8927) schema for polyglot GPU escalation responses.
#
# Sent from the Rust host processor over the subprocess's stdin in reply to an
# [`EscalateRequest`]. Correlated by `request_id`.
#
metadata:
  type: EscalateResponse
  description: "Polyglot subprocess escalate-on-behalf response (host → subprocess)"

discriminator: result
mapping:
  ok:
    properties:
      request_id:
        metadata:
          description: "Correlates response with request. Matches request_id in EscalateRequest."
        type: string
      handle_id:
        metadata:
          description: >
            Opaque handle returned by the host. For acquire_pixel_buffer this
            is the PixelBufferPoolId the host registered with its
            pixel-buffer pool and SurfaceStore. For acquire_texture this is
            a host-side UUID keying the EscalateHandleRegistry's texture
            slot. For register_compute_kernel this is the SHA-256 hex of
            the SPIR-V blob — re-registering identical SPIR-V returns the
            same handle_id and re-uses the cached `VulkanComputeKernel`.
            For release_handle this echoes the released id. For
            run_compute_kernel this echoes the kernel_id (compute is
            synchronous host-side; nothing extra travels).
        type: string
    optionalProperties:
      width:
        metadata:
          description: "Width in pixels (set on acquire_pixel_buffer and acquire_texture responses)."
        type: uint32
      height:
        metadata:
          description: "Height in pixels (set on acquire_pixel_buffer and acquire_texture responses)."
        type: uint32
      format:
        metadata:
          description: "Resolved pixel or texture format identifier."
        type: string
      usage:
        metadata:
          description: >
            Resolved usage tokens (set on acquire_texture responses). Array
            reflects the exact flags the host honored.
        elements:
          type: string
      timeline_value:
        metadata:
          description: >
            Decimal-string-encoded u64 timeline value the host signaled on
            the surface's shared timeline semaphore at end-of-submit. Set
            on `run_cpu_readback_copy` and `try_run_cpu_readback_copy`
            responses, and on `refill_device_export_staging` /
            `copy_device_export_staging_back_to_surface` responses, where
            the timeline is the staging's own `refill_done`. The subprocess
            waits on its imported `ConsumerVulkanTimelineSemaphore` for
            this value before reading or writing the staging buffer mapped
            at registration time. JTD has no native u64 — wire form is
            decimal-string, parsed back to u64 on the subprocess side.
        type: string
      staging_byte_size:
        metadata:
          description: >
            Decimal-string-encoded u64 byte size of the device-export
            staging buffer — the span an imported device pointer covers.
            Set on `open_device_export_staging` responses. JTD has no
            native u64; same decimal-string convention as
            `timeline_value`.
        type: string
      bytes_per_row:
        metadata:
          description: >
            Decimal-string-encoded u64 row pitch of the device-export
            staging, derived from the staging's own geometry rather than
            from the requesting surface's — the staging is the object the
            byte span was sized for. Set on `open_device_export_staging`
            responses.
        type: string
      writable:
        metadata:
          description: >
            Whether the host can honour a write-back for this export. Set
            on `open_device_export_staging` responses. False for
            texture-backed exports, which are read-only by construction —
            a subprocess that takes a write lock over one is refused
            rather than silently dropping the edit at unlock.
        type: boolean
      exporting_device_uuid:
        metadata:
          description: >
            Lowercase hex of the exporting Vulkan device's
            `VkPhysicalDeviceIDProperties::deviceUUID` (32 characters, no
            separators). Set on `open_device_export_staging` responses.
            The external device API must import onto the GPU that owns the
            memory; matching this UUID is the entire device-binding
            contract, and falling through to device ordinal 0 corrupts
            silently on a multi-GPU host.
        type: string
  err:
    properties:
      request_id:
        metadata:
          description: "Correlates response with request."
        type: string
      message:
        metadata:
          description: "Human-readable error message from the host side."
        type: string
  contended:
    properties:
      request_id:
        metadata:
          description: >
            Correlates response with request. Returned by
            [`try_acquire_cpu_readback`] (and any future `try_*` op that
            opts into the same shape) when the host's adapter would have
            blocked on a competing reader/writer. The subprocess gets no
            handle, no planes, and no surface-share registrations to
            release — `contended` is purely advisory, the customer skips
            the frame and re-tries later.
        type: string
