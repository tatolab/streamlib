[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "tatolab-virtualcamera"
version = "0.68.27"
description = "A virtual camera for Tatolab streams: video frames in, a v4l2loopback or PipeWire camera any Linux application can select out."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "BUSL-1.1" }
# PEP 639: `LICENSE` for our own terms, `THIRD-PARTY-NOTICES.md` for every
# dependency's, generated over this project's own closure by `cargo xtask
# generate-third-party-notices --extension-package-directory <this directory>`.
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md"]
authors = [{ name = "Jonathan Fontanez", email = "fontanezj1@gmail.com" }]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Video",
    "Typing :: Typed",
]
# The stream package and nothing of the engine: the node runs in a processor
# interpreter, which borrows `tatolab.runtime` from the runtime that starts it.
# A minimum, never an exact pin, as a third party's package depends on it.
dependencies = ["tatolab-stream>=0.68.7"]

# The node catalog lists this in every stream whose environment installs this
# distribution, before a graph names it.
[project.entry-points."tatolab.nodes"]
VirtualCameraSink = "tatolab.virtualcamera:VirtualCameraSink"

[project.urls]
Homepage = "https://tatolab.com"
Install = "https://tatolab.com/docs/install"
Source = "https://github.com/tatolab/streamlib"

[dependency-groups]
test = ["pytest>=7.0"]

[tool.maturin]
python-source = "python"
module-name = "tatolab.virtualcamera._native"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["python", "tests"]
extraPaths = ["python"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
# `_native` is a compiled artifact; `mypy.stubtest` checks the stub against it.
reportMissingModuleSource = "none"
