[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "tatolab-browser"
version = "0.68.31"
description = "A web page as a stream source: the machine's shared Chromium (CEF) browser host renders it offscreen as a tab, and its frames, audio and events are published through the module host table."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "BUSL-1.1" }
# PEP 639: `LICENSE` for our own terms, `THIRD-PARTY-NOTICES.md` for every
# dependency's.
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md"]
authors = [{ name = "Jonathan Fontanez", email = "fontanezj1@gmail.com" }]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Multimedia :: Video",
]
# A minimum, never an exact pin, as a third party's package depends on it.
dependencies = ["tatolab-stream>=0.68.8"]

[project.entry-points."tatolab.nodes"]
BrowserSource = "tatolab.browser.browser_source:BrowserSource"
BrowserSourceOutputProbe = "tatolab.browser.browser_source_output_probe:BrowserSourceOutputProbe"

[project.urls]
Homepage = "https://tatolab.com"
Source = "https://github.com/tatolab/streamlib"

[tool.maturin]
python-source = "python"
module-name = "tatolab.browser._native"
features = ["pyo3/extension-module"]
# A CEF runtime the in-wheel layout once staged here is never packed again.
exclude = ["python/tatolab/browser/cef/**"]

[tool.pyright]
include = ["python", "streams"]
extraPaths = [
    "python",
    "../streamlib-h264/python",
    "../tatolab-camera/python",
    "../tatolab-compositor/python",
    "../tatolab-microphone/python",
]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
reportMissingModuleSource = "none"
