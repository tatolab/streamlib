<html>
<head>
<meta charset="utf-8">
<title>Raymarched scene</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<script>
  // A full-screen fragment shader: a field of morphing, reflective shapes,
  // soft shadows and fog, marched per pixel every frame at the page's size.
  const canvas = document.getElementById("scene");
  const gl = canvas.getContext("webgl2", { antialias: false, preserveDrawingBuffer: false });
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const vertexSource = `#version 300 es
  in vec2 corner;
  void main() { gl_Position = vec4(corner, 0.0, 1.0); }`;

  const fragmentSource = `#version 300 es
  precision highp float;
  uniform vec2 resolution;
  uniform float seconds;
  out vec4 color;

  mat2 rotation(float angle) { float c = cos(angle), s = sin(angle); return mat2(c, -s, s, c); }

  float shapeDistance(vec3 point, out float material) {
    vec3 cell = point;
    cell.xz = mod(cell.xz + 3.0, 6.0) - 3.0;
    vec2 cellId = floor((point.xz + 3.0) / 6.0);
    float phase = seconds * 0.9 + dot(cellId, vec2(1.7, 2.3));
    cell.y -= 1.2 + 0.5 * sin(phase);
    cell.xy *= rotation(phase * 0.6);
    cell.yz *= rotation(phase * 0.4);
    float sphere = length(cell) - 1.1;
    vec2 torusRing = vec2(length(cell.xz) - 1.3, cell.y);
    float torus = length(torusRing) - 0.32;
    vec3 boxCorner = abs(cell) - vec3(0.85);
    float box = length(max(boxCorner, 0.0)) + min(max(boxCorner.x, max(boxCorner.y, boxCorner.z)), 0.0) - 0.08;
    float morph = 0.5 + 0.5 * sin(phase * 0.7);
    float shape = mix(min(sphere, torus), box, morph);
    float floorPlane = point.y + 0.2 * sin(point.x * 0.7 + seconds) * sin(point.z * 0.6 - seconds * 0.8);
    material = shape < floorPlane ? 1.0 + mod(cellId.x + cellId.y, 3.0) : 0.0;
    return min(shape, floorPlane);
  }

  float sceneDistance(vec3 point) { float material; return shapeDistance(point, material); }

  vec3 surfaceNormal(vec3 point) {
    vec2 offset = vec2(0.0015, 0.0);
    return normalize(vec3(
      sceneDistance(point + offset.xyy) - sceneDistance(point - offset.xyy),
      sceneDistance(point + offset.yxy) - sceneDistance(point - offset.yxy),
      sceneDistance(point + offset.yyx) - sceneDistance(point - offset.yyx)));
  }

  float softShadow(vec3 origin, vec3 direction) {
    float light = 1.0, travelled = 0.05;
    for (int i = 0; i < 48; i++) {
      float gap = sceneDistance(origin + direction * travelled);
      light = min(light, 10.0 * gap / travelled);
      travelled += clamp(gap, 0.02, 0.4);
      if (gap < 0.001 || travelled > 20.0) break;
    }
    return clamp(light, 0.0, 1.0);
  }

  float march(vec3 origin, vec3 direction, out float material) {
    float travelled = 0.0;
    material = -1.0;
    for (int i = 0; i < 160; i++) {
      float hitMaterial;
      float gap = shapeDistance(origin + direction * travelled, hitMaterial);
      if (gap < 0.0008 * travelled) { material = hitMaterial; return travelled; }
      travelled += gap * 0.8;
      if (travelled > 60.0) break;
    }
    return -1.0;
  }

  vec3 sky(vec3 direction) {
    return mix(vec3(0.02, 0.03, 0.08), vec3(0.35, 0.18, 0.55), pow(max(direction.y, 0.0), 0.6));
  }

  vec3 shade(vec3 origin, vec3 direction, out vec3 hitPoint, out vec3 normal, out float reflectivity) {
    float material;
    float travelled = march(origin, direction, material);
    reflectivity = 0.0;
    if (travelled < 0.0) { hitPoint = origin + direction * 60.0; normal = vec3(0.0, 1.0, 0.0); return sky(direction); }
    hitPoint = origin + direction * travelled;
    normal = surfaceNormal(hitPoint);
    vec3 lightDirection = normalize(vec3(0.6, 0.8, -0.4));
    vec3 albedo = material < 0.5
      ? vec3(0.12) + 0.08 * step(0.0, sin(hitPoint.x * 2.0) * sin(hitPoint.z * 2.0))
      : material < 1.5 ? vec3(0.95, 0.35, 0.2) : material < 2.5 ? vec3(0.2, 0.75, 0.95) : vec3(0.9, 0.85, 0.3);
    reflectivity = material < 0.5 ? 0.25 : 0.55;
    float diffuse = max(dot(normal, lightDirection), 0.0) * softShadow(hitPoint + normal * 0.01, lightDirection);
    float specular = pow(max(dot(reflect(direction, normal), lightDirection), 0.0), 48.0);
    vec3 lit = albedo * (0.12 + 0.95 * diffuse) + vec3(1.0) * specular * 0.8;
    float fog = 1.0 - exp(-0.0016 * travelled * travelled);
    return mix(lit, sky(direction), fog);
  }

  void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * resolution) / resolution.y;
    float orbit = seconds * 0.15;
    vec3 eye = vec3(9.0 * sin(orbit), 3.2 + sin(seconds * 0.3), 9.0 * cos(orbit) + seconds * 2.0);
    vec3 target = vec3(0.0, 1.0, seconds * 2.0);
    vec3 forward = normalize(target - eye);
    vec3 right = normalize(cross(vec3(0.0, 1.0, 0.0), forward));
    vec3 up = cross(forward, right);
    vec3 direction = normalize(forward * 1.6 + right * uv.x + up * uv.y);
    vec3 hitPoint, normal; float reflectivity;
    vec3 pixel = shade(eye, direction, hitPoint, normal, reflectivity);
    if (reflectivity > 0.0) {
      vec3 bouncePoint, bounceNormal; float bounceReflectivity;
      vec3 reflected = shade(hitPoint + normal * 0.02, reflect(direction, normal), bouncePoint, bounceNormal, bounceReflectivity);
      pixel = mix(pixel, reflected, reflectivity);
    }
    pixel = pow(pixel, vec3(0.8));
    color = vec4(pixel, 1.0);
  }`;

  function compiled(type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      window.tatolab?.publish({ scene_shader_error: gl.getShaderInfoLog(shader) });
    }
    return shader;
  }
  const program = gl.createProgram();
  gl.attachShader(program, compiled(gl.VERTEX_SHADER, vertexSource));
  gl.attachShader(program, compiled(gl.FRAGMENT_SHADER, fragmentSource));
  gl.linkProgram(program);
  gl.useProgram(program);
  const corners = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, corners);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const cornerLocation = gl.getAttribLocation(program, "corner");
  gl.enableVertexAttribArray(cornerLocation);
  gl.vertexAttribPointer(cornerLocation, 2, gl.FLOAT, false, 0, 0);
  const resolutionLocation = gl.getUniformLocation(program, "resolution");
  const secondsLocation = gl.getUniformLocation(program, "seconds");

  // Each `data` message is answered once the frame after it is drawn, so the
  // probe reports the data round trip.
  let sentNsAwaitingPaint = [];
  window.addEventListener("tatolab:data", (event) => {
    if (typeof event.detail?.sent_ns === "number") sentNsAwaitingPaint.push(event.detail.sent_ns);
  });

  const started = performance.now();
  function draw(now) {
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform2f(resolutionLocation, canvas.width, canvas.height);
    gl.uniform1f(secondsLocation, (now - started) / 1000);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    for (const sentNs of sentNsAwaitingPaint) window.tatolab?.publish({ data_painted: sentNs });
    sentNsAwaitingPaint = [];
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
</script>
</body>
</html>
