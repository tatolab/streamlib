[project]
name = "tatolab-browser-page-mixes-inputs"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "tatolab-stream>=0.68.32",
    "tatolab-browser",
    "tatolab-camera",
    "tatolab-microphone",
]

# The wheels as a third party's stream would take them, built from this checkout
# rather than an index: ordinary non-editable dependencies.
[tool.uv.sources]
tatolab-browser = { path = "../..", editable = false }
tatolab-camera = { path = "../../../tatolab-camera", editable = false }
tatolab-microphone = { path = "../../../tatolab-microphone", editable = false }
