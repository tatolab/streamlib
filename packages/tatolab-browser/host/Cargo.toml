[package]
name = "tatolab-browser-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Tatolab LLC <hello@tatolab.com>"]
description = "The machine's browser host: one CEF offscreen browser the runtime supervises, rendering every BrowserSource node's page as a tab, each stream under its own profile."
repository = "https://github.com/tatolab/streamlib"
license = "GPL-3.0-only"
publish = false

[[bin]]
name = "tatolab-browser-host"
path = "src/main.rs"

[dependencies]
cef = { version = "=156.3.0", default-features = false }
libc = "0.2"
serde_json = "1"
tatolab-browser-page-bridge = { path = "../page-bridge" }
tatolab-browser-tab-protocol = { path = "../tab-protocol" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
