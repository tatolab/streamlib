[package]
name = "tatolab-browser-page-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Tatolab LLC <hello@tatolab.com>"]
description = "The renderer half of tatolab-browser: the `window.tatolab` bridge a page publishes through, and the `tatolab-browser-subprocess` binary CEF re-executes for its child processes."
repository = "https://github.com/tatolab/streamlib"
license = "GPL-3.0-only"
publish = false

[lib]
name = "tatolab_browser_page_bridge"

[[bin]]
name = "tatolab-browser-subprocess"
path = "src/main.rs"

[dependencies]
cef = { version = "=156.3.0", default-features = false }
libc = "0.2"
