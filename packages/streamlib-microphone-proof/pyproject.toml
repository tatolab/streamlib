[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "tatolab-microphone-proof"
version = "0.1.0"
description = "Throwaway proof: a microphone captured in a Python node's helper process, A/B against the built-in."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BUSL-1.1" }
license-files = ["LICENSE"]
authors = [{ name = "Jonathan Fontanez", email = "fontanezj1@gmail.com" }]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
]
# The stream package and nothing of the engine, as a third party's package depends on it.
dependencies = ["tatolab-stream>=0.68.0"]

[tool.maturin]
python-source = "python"
module-name = "tatolab.microphone_proof._native"
features = ["pyo3/extension-module"]

[tool.pyright]
include = ["python", "tests"]
extraPaths = ["python", "../../sdk/streamlib-python-wheel/python"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
reportMissingModuleSource = "none"
