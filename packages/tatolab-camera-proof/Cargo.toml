[package]
name = "tatolab-camera-proof"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Jonathan Fontanez <fontanezj1@gmail.com>"]
description = "A Linux camera built the way a third party would build one: V4L2 capture in the wheel's own Rust, conversion in its own GLSL."
repository = "https://github.com/tatolab/streamlib"
license = "BUSL-1.1"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.2", features = ["abi3-py310"] }

[target.'cfg(target_os = "linux")'.dependencies]
v4l = "0.14"
libc = "0.2"

# Not a member of the engine workspace: an extension wheel is built exactly as a
# third party would build one, with its own root, its own lockfile and no
# engine crate.
[workspace]
