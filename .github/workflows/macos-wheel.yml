name: macOS Wheel

# The aarch64-apple-darwin runtime unit, built the way a release builds it and
# then proven on a runner that has never seen a Vulkan SDK. Called by
# python-wheel.yml on every PR — the portability proof must fail on the PR that
# breaks it, not on release day — and by release-wheel.yml, where a failure
# here withholds the release's upload to PyPI.
#
# A stock Mac has no Vulkan driver, so the wheel — and the runtime unit's lend,
# which is that wheel unpacked — carries the loader and MoltenVK
# (`scripts/stage_macos_bundled_vulkan_driver.sh`, which `cargo xtask
# build-runtime` runs first). The runner image ships neither, which is what
# makes it a clean machine for that claim: a scaffolded stream that runs here on
# `tatolabd` ran on the driver inside the lend.
on:
  workflow_call:
    inputs:
      ref:
        description: "What to check out and build (blank = the calling run's own ref)"
        type: string
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build-and-prove-macos-wheel:
    name: aarch64-apple-darwin wheel
    # Pinned, not `macos-latest` (macOS 26): the image decides the SDK the wheel
    # links against, and the wheel's deployment target is the newest macOS this
    # label can both build for and run.
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          # Builds and runs PR-authored code; a persisted token would be
          # readable by it.
          persist-credentials: false

      # `glslc` stages the engine's SPIR-V for `include_bytes!`; cmake and ninja
      # build the `shaderc` crate's C++ and the bundled Vulkan loader.
      - name: Install glslc and the C++ build tools
        run: brew install shaderc cmake ninja

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-macos-wheel-release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # Stages the Vulkan loader and MoltenVK, builds the release wheel at the
      # deployment target the maturin project pins, lays out its lend, and
      # builds `tatolabd` and `tatolab` into `bin/`. It refuses a lend missing a
      # driver file, and a wheel carrying anything beside `tatolab/runtime/`
      # and its `.dist-info`. Every step through the uploads below runs on this
      # release unit; the integration suite's test-root unit replaces it at the
      # same path afterwards.
      - name: Build the runtime unit
        run: cargo xtask build-runtime --release

      # The stream package every venv below holds, at a version no index
      # carries before release.
      - name: Build the tatolab-stream wheel the venvs below install
        run: uv build --wheel --out-dir sdk/tatolab-stream/dist sdk/tatolab-stream

      # The signature is file content, so the zip round-trip and pip should
      # both preserve it — but a binary whose signature did not survive fails
      # on every user's machine and never on this one, so it is checked on the
      # lend, which is the wheel unpacked, and again after install.
      # `-exec … +`, not a `while read` loop: find's status is non-zero if any
      # codesign fails, where a loop reports only the last one.
      - name: Every binary in the lend is still signed
        run: |
          find target/tatolab-runtime/lib/tatolab/lend \( -name '*.so' -o -name '*.dylib' \) \
            -exec codesign --verify --strict --verbose=1 {} +

      # The linker signs an arm64 executable ad hoc; one whose signature is
      # missing or broken is killed by the kernel before its first instruction.
      - name: tatolabd and tatolab are signed
        run: |
          codesign --verify --strict --verbose=1 \
            target/tatolab-runtime/bin/tatolabd target/tatolab-runtime/bin/tatolab

      # Against the lend a processor interpreter borrows, from a venv holding
      # `tatolab-stream` and pytest and nothing of the runtime: the lend is the
      # only `tatolab.runtime` on the path. The portability proof reads every
      # Mach-O the lend carries, and the macOS floor from its `.dist-info`.
      - name: Portability and driver-search tests against the lend
        run: |
          python3 -m venv /tmp/lend-check
          /tmp/lend-check/bin/pip install --no-index --find-links sdk/tatolab-stream/dist tatolab-stream
          /tmp/lend-check/bin/pip install pytest
          cd sdk/streamlib-python-wheel
          PYTHONPATH="$GITHUB_WORKSPACE/target/tatolab-runtime/lib/tatolab/lend" \
            /tmp/lend-check/bin/python -m pytest -v \
            tests_against_the_runtime_unit_lend/

      - name: Install the wheel into a fresh venv
        run: |
          python3 -m venv /tmp/wheel-check
          # The engine wheel declares no dependency; the notices tests' conftest
          # imports `tatolab.stream`.
          /tmp/wheel-check/bin/pip install --no-index --find-links sdk/tatolab-stream/dist \
            tatolab-stream target/tatolab-runtime/wheel/*.whl
          # The scaffolded effect's own declared dependency, and the tests'.
          /tmp/wheel-check/bin/pip install 'numpy>=2.1' pytest
          # Compared against the venv's own site-packages, resolved on both
          # sides: macOS's `/tmp` is a symlink to `/private/tmp`.
          installed_package="$(/tmp/wheel-check/bin/python - <<'EOF'
          import pathlib, sysconfig, tatolab.runtime
          installed_package = pathlib.Path(tatolab.runtime.__file__).resolve().parent
          site_packages = pathlib.Path(sysconfig.get_path("purelib")).resolve()
          assert installed_package.parent.parent == site_packages, (
              f"tatolab.runtime imported from {installed_package}, not the installed wheel in {site_packages}"
          )
          print(installed_package)
          EOF
          )"
          find "$installed_package" \( -name '*.so' -o -name '*.dylib' \) \
            -exec codesign --verify --strict --verbose=1 {} +

      # Against the installed artifact, not a checkout: the notices are read
      # out of `.dist-info/licenses/`.
      - name: Notices tests against the installed wheel
        working-directory: sdk/streamlib-python-wheel
        run: |
          /tmp/wheel-check/bin/python -m pytest -v tests/test_third_party_notices.py

      # The MVP sentence on a clean machine, minus the camera no runner has:
      # `tatolab new`'s test-pattern variant through the Python effect into a
      # window, run attached on the machine's `tatolabd` on the Vulkan driver
      # the lend carries. The project's venv holds what a user's `uv sync`
      # gives it — `tatolab-stream`, from the wheel built above because no
      # index carries this version yet, and the numpy the scaffold declares —
      # and no runtime. The machine lock is the root-owned file Tatolab.app
      # creates at first launch; a runner has no app, so this step creates it.
      # `tatolabd` mirrors every record a stream emits on its standard error,
      # so the evidence is read from its log.
      - name: The scaffolded stream runs on the driver the lend carries
        run: |
          tatolabd_executable="$GITHUB_WORKSPACE/target/tatolab-runtime/bin/tatolabd"
          tatolab_executable="$GITHUB_WORKSPACE/target/tatolab-runtime/bin/tatolab"
          machine_runtime_lock_directory="/Library/Application Support/Tatolab"
          sudo mkdir -p "$machine_runtime_lock_directory"
          sudo touch "$machine_runtime_lock_directory/runtime.lock"
          sudo chown root "$machine_runtime_lock_directory" "$machine_runtime_lock_directory/runtime.lock"
          sudo chmod 0755 "$machine_runtime_lock_directory"
          sudo chmod 0666 "$machine_runtime_lock_directory/runtime.lock"

          "$tatolabd_executable" > /tmp/tatolabd.log 2>&1 &
          tatolabd_pid=$!
          trap 'kill -KILL "$tatolabd_pid" 2>/dev/null || true' EXIT
          local_api_deadline=$((SECONDS + 60))
          until "$tatolab_executable" streams > /dev/null 2>&1; do
            if ! kill -0 "$tatolabd_pid" 2>/dev/null; then
              cat /tmp/tatolabd.log
              echo "::error::tatolabd exited before its local API socket answered"
              exit 1
            fi
            if [ "$SECONDS" -ge "$local_api_deadline" ]; then
              cat /tmp/tatolabd.log
              echo "::error::tatolabd's local API socket did not answer within 60s"
              exit 1
            fi
            sleep 1
          done

          "$tatolab_executable" new /tmp/scaffold-check --test-pattern
          python3 -m venv /tmp/scaffold-check/.venv
          /tmp/scaffold-check/.venv/bin/pip install --no-index --find-links sdk/tatolab-stream/dist tatolab-stream
          /tmp/scaffold-check/.venv/bin/pip install 'numpy>=2.1'
          if /tmp/scaffold-check/.venv/bin/python -c '
          import importlib.util, sys
          sys.exit(0 if importlib.util.find_spec("tatolab.runtime") is not None else 1)
          '; then
            echo "::error::the scaffold's venv can import tatolab.runtime — a stream's venv holds no runtime"
            exit 1
          fi

          # SIGINT a process, failing the step unless it exits 0 within 30s.
          interrupt_and_expect_a_clean_exit() {
            process_name="$1"
            process_pid="$2"
            process_log="$3"
            kill -INT "$process_pid" 2>/dev/null || true
            stop_deadline=$((SECONDS + 30))
            while kill -0 "$process_pid" 2>/dev/null && [ "$SECONDS" -lt "$stop_deadline" ]; do
              sleep 1
            done
            if kill -0 "$process_pid" 2>/dev/null; then
              pkill -KILL -P "$process_pid" || true
              kill -KILL "$process_pid" || true
              cat "$process_log"
              echo "::error::$process_name did not stop within 30s of SIGINT"
              exit 1
            fi
            process_exit_status=0
            wait "$process_pid" || process_exit_status=$?
            if [ "$process_exit_status" -ne 0 ]; then
              cat "$process_log"
              echo "::error::$process_name exited $process_exit_status after SIGINT, not 0"
              exit 1
            fi
          }

          cd /tmp/scaffold-check
          "$tatolab_executable" run > /tmp/scaffold-run.log 2>&1 &
          tatolab_pid=$!
          sleep 20
          interrupt_and_expect_a_clean_exit "tatolab run" "$tatolab_pid" /tmp/scaffold-run.log
          interrupt_and_expect_a_clean_exit tatolabd "$tatolabd_pid" /tmp/tatolabd.log
          trap - EXIT
          echo "::group::tatolab run"
          cat /tmp/scaffold-run.log
          echo "::endgroup::"
          echo "::group::tatolabd"
          cat /tmp/tatolabd.log
          echo "::endgroup::"

          if ! grep -q 'Vulkan loader library opened.*_vulkan_driver/libvulkan.1.dylib' /tmp/tatolabd.log; then
            echo "::error::tatolabd did not open the Vulkan loader the lend carries"
            exit 1
          fi
          if grep -q 'process() failed' /tmp/tatolabd.log; then
            echo "::error::the scaffolded effect raised on a live frame"
            exit 1
          fi
          frames_shown="$(sed -n 's/.*DisplayWindow: stopped (\([0-9]*\) frames).*/\1/p' /tmp/tatolabd.log | tail -1)"
          # Far enough to prove the graph runs end to end, not a frame-rate bar:
          # the runner's GPU is a paravirtual device.
          if [ -z "$frames_shown" ] || [ "$frames_shown" -lt 60 ]; then
            echo "::error::the window showed ${frames_shown:-no} frames in 20s"
            exit 1
          fi
          echo "the window showed $frames_shown frames"

      # The unit as an install prefix, for python-wheel.yml's macOS extension
      # lane. Tarred, because an artifact keeps no file modes.
      - name: Pack the runtime unit
        run: tar -C target/tatolab-runtime -czf "$RUNNER_TEMP/tatolab-runtime-unit.tar.gz" bin lib

      - uses: actions/upload-artifact@v4
        with:
          name: tatolab-runtime-unit-macos
          path: ${{ runner.temp }}/tatolab-runtime-unit.tar.gz
          retention-days: 1
          if-no-files-found: error

      - name: Keep the wheel for a clean-machine run
        uses: actions/upload-artifact@v4
        with:
          name: streamlib-macos-wheel
          path: target/tatolab-runtime/wheel/*.whl
          retention-days: 14

      # The integration suite drives a unit whose `tatolabd` and `tatolab` keep
      # the machine lock, the state directory and the runtime directory under a
      # throwaway root the harness names, so no test takes this machine's real
      # lock; the harness refuses a unit without that build's marker. Built
      # last: it replaces the release unit at the same path, after every step
      # above has used that one.
      - name: Build the integration suite's test-root runtime unit
        run: cargo xtask build-runtime --release --machine-directories-under-a-test-root

      # The integration suite's GPU-free half on this floor, run as the Linux
      # lane runs it: the suite's own venv, holding `tatolab-stream` and nothing
      # of the runtime, and streams on the test-root `tatolabd` built above.
      - name: The suite's venv, from its lockfile
        working-directory: tests/stream-on-runtime
        # --frozen: registry packages stay hash-pinned; the editable tatolab-stream's locked version is never read.
        run: uv sync --frozen

      - name: Integration suite (GPU-free half)
        working-directory: tests/stream-on-runtime
        run: .venv/bin/pytest -v -m "not requires_gpu"
