name: Release to PyPI

# The release channel: release-please cuts a GitHub release, and this publishes
# `tatolab-stream` and every first-party extension to PyPI at that release's
# version. A stream's venv takes them from PyPI like any other dependency. The
# engine wheel is not published: a processor interpreter borrows the runtime
# from the runtime unit's lend, so no stream's venv installs it.
#
# Every distribution carries the repository's one version and releases on its
# one tag, and the upload waits for every one of them and for the macOS proof of
# the runtime unit, so a release publishes all of them or none.
#
# Called from release-please.yml rather than triggered by `on: release`:
# release-please runs on the default GITHUB_TOKEN, and GitHub does not start
# workflow runs from events that token raises. An `on: release` trigger here
# would simply never fire.
#
# Only a run whose `dry_run` is false uploads. release-please's call passes
# false; every other run is a dry run unless dispatched with `dry_run` unticked,
# which is how a release whose upload failed is published by hand. A dry run
# builds and checks every distribution and stops short of PyPI.
on:
  workflow_call:
    inputs:
      tag_name:
        description: "Release tag to build and publish"
        type: string
        required: false
        default: ""
      dry_run:
        description: "Build and check every distribution without uploading"
        type: boolean
        required: false
        default: true
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to build (blank = the ref this run was dispatched on; an upload needs one)"
        type: string
        required: false
      dry_run:
        description: "Build and check every distribution without uploading"
        type: boolean
        required: false
        default: true

env:
  # The uv that builds, locks and uploads every distribution.
  PINNED_UV_VERSION: "0.12.23"

jobs:
  build-tatolab-stream-distribution:
    name: tatolab-stream wheel and sdist
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.PINNED_UV_VERSION }}

      # Pure Python, so this one wheel serves every platform a stream runs on.
      # uv builds the sdist first and the wheel from it, so a file the sdist
      # drops is missing from the wheel too.
      - name: Build the tatolab-stream wheel and sdist
        run: uv build --out-dir sdk/tatolab-stream/dist sdk/tatolab-stream

      # PEP 420: `tatolab` is a namespace package. A regular `tatolab/__init__.py`
      # would shadow every other distribution's `tatolab.*` portion installed
      # beside it, and `tatolab/runtime/` is the lend's, never a stream venv's.
      # Each listing is required to name the stream package's `__init__.py`, so
      # a distribution missing it, or an empty or unreadable listing, fails
      # rather than passing.
      - name: The wheel and the sdist ship tatolab as a namespace package
        run: |
          set -euo pipefail
          unzip -Z1 sdk/tatolab-stream/dist/*.whl > /tmp/stream-wheel-member-names.txt
          # An sdist's members sit under its `<name>-<version>/` directory.
          tar -tzf sdk/tatolab-stream/dist/*.tar.gz | sed 's|^[^/]*/||' \
            > /tmp/stream-sdist-member-names.txt
          for member_names in /tmp/stream-wheel-member-names.txt /tmp/stream-sdist-member-names.txt; do
            if ! grep -qx 'tatolab/stream/__init__.py' "$member_names"; then
              echo "::error::$member_names does not list tatolab/stream/__init__.py"
              exit 1
            fi
            if grep -q '^tatolab/runtime/' "$member_names"; then
              echo "::error::$member_names lists tatolab/runtime/, which is the lend's and never a stream venv's"
              exit 1
            fi
            if grep -qx 'tatolab/__init__.py' "$member_names"; then
              echo "::error::$member_names lists tatolab/__init__.py — tatolab must stay a PEP 420 namespace package"
              exit 1
            fi
          done

      # `tatolab new` writes the scaffold.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # The native CLI links no engine, so no Vulkan or shader compiler, but it
      # reads a tapped bag's frame through streamlib-ipc-types, which builds
      # iceoryx2, and iceoryx2's bindgen needs libclang. `timeout-minutes` is the
      # native backstop the composite action cannot declare for itself;
      # `check-bounded-apt-install` fails the build if it goes missing.
      - name: Install libclang for iceoryx2's bindgen
        timeout-minutes: 12
        uses: ./.github/actions/install-linux-engine-build-dependencies
        with:
          packages: >-
            libclang1-18
            libclang-common-18-dev

      - name: Build the native tatolab CLI
        run: cargo build --locked --release -p tatolab-cli

      # What a user's `uv sync` gives a scaffolded stream: this run's
      # `tatolab-stream` and the numpy the scaffold declares, and nothing of
      # the runtime. Importing a node runs its decorator and boots no engine, so
      # this needs no GPU.
      - name: A scaffolded stream's nodes import beside this run's tatolab-stream
        run: |
          python3 -m venv /tmp/scaffold-venv
          /tmp/scaffold-venv/bin/pip install --no-index --find-links sdk/tatolab-stream/dist tatolab-stream
          /tmp/scaffold-venv/bin/pip install 'numpy>=2.1'
          # BUSL-1.1's parameters are in its text, not its SPDX id, so the text
          # has to reach what a user installs. Read through importlib.metadata,
          # so a licence present in the checkout and absent from the wheel fails.
          /tmp/scaffold-venv/bin/python -c "
          from importlib.metadata import distribution
          license_text = distribution('tatolab-stream').read_text('licenses/LICENSE') or ''
          assert 'Business Source License' in license_text, 'LICENSE is absent from .dist-info/licenses/'
          "

          target/release/tatolab new /tmp/scaffold-check --test-pattern
          test -f /tmp/scaffold-check/stream.py
          test -f /tmp/scaffold-check/nodes/inverting_effect.py
          test -f /tmp/scaffold-check/nodes/brightness_meter.py
          # A node class in the entry file identifies as `__main__:<Type>`
          # and is a wiring error: the entry runs as `__main__`, and the child
          # interpreter that runs the node imports the class by name.
          # An explicit `if`, not `! grep` — `set -e` does not abort on a
          # command whose status is inverted with `!`, so the negated form
          # could never have failed this step.
          if grep -q '@node' /tmp/scaffold-check/stream.py; then
            echo "::error::the scaffold put a node class in stream.py — it would identify as __main__:<Type>"
            exit 1
          fi
          cd /tmp/scaffold-check && /tmp/scaffold-venv/bin/python -c '
          from nodes.brightness_meter import BrightnessMeter
          from nodes.inverting_effect import InvertingEffect
          '

      # A user's `uv sync` resolves `tatolab-stream` from PyPI, where every
      # earlier release is a candidate. This run's distributions are not there
      # yet, so they join PyPI as find-links, and the scaffold must lock the
      # `tatolab-stream` just built — one that capped the version or named
      # another index would lock something else.
      - name: A scaffolded stream locks the tatolab-stream this run built
        run: |
          set -euo pipefail
          (cd /tmp/scaffold-check && UV_FIND_LINKS="$GITHUB_WORKSPACE/sdk/tatolab-stream/dist" uv lock)
          built_stream_package_version="$(/tmp/scaffold-venv/bin/python -c \
            "from importlib.metadata import version; print(version('tatolab-stream'))")"
          locked_stream_package_version="$(python3 -c "
          import tomllib
          lock = tomllib.load(open('/tmp/scaffold-check/uv.lock', 'rb'))
          print(next(package['version'] for package in lock['package'] if package['name'] == 'tatolab-stream'))
          ")"
          if [ "$locked_stream_package_version" != "$built_stream_package_version" ]; then
            echo "::error::a scaffolded stream locks tatolab-stream $locked_stream_package_version, not the $built_stream_package_version this run built"
            exit 1
          fi

      # Every `pypi-distribution-*` artifact of this run is what publish-to-pypi
      # uploads.
      - name: Keep the distributions for the upload
        uses: actions/upload-artifact@v4
        with:
          name: pypi-distribution-tatolab-stream
          path: |
            sdk/tatolab-stream/dist/*.whl
            sdk/tatolab-stream/dist/*.tar.gz
          if-no-files-found: error

  # An extension is a standalone project built from the same ref. A named block
  # rather than a matrix over a JSON array: an empty `include` is a matrix
  # expansion failure, and a second extension is one more block like this one.
  # Its install check resolves `tatolab-stream` from this run's distribution,
  # which is why it waits for it.
  build-tatolab-webrtc-distribution:
    needs: build-tatolab-stream-distribution
    permissions:
      contents: read
    uses: ./.github/workflows/release-extension-wheel.yml
    with:
      extension_package_directory: packages/streamlib-webrtc
      extension_distribution_name: tatolab-webrtc
      extension_import_package_name: tatolab.webrtc
      ref: ${{ inputs.tag_name }}
      tatolab_stream_distribution_artifact_name: pypi-distribution-tatolab-stream

  # macOS is a supported floor, so a macOS-only regression in the runtime unit
  # blocks the release exactly as a Linux one does, though nothing it builds is
  # uploaded.
  prove-the-runtime-unit-on-macos:
    permissions:
      contents: read
    uses: ./.github/workflows/macos-wheel.yml
    with:
      ref: ${{ inputs.tag_name }}

  publish-to-pypi:
    name: Publish to PyPI
    needs:
      - build-tatolab-stream-distribution
      - build-tatolab-webrtc-distribution
      - prove-the-runtime-unit-on-macos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.PINNED_UV_VERSION }}
          # No checkout and nothing to resolve, so nothing to cache.
          enable-cache: false

      - name: Collect every distribution this run built
        uses: actions/download-artifact@v4
        with:
          pattern: pypi-distribution-*
          path: dist
          merge-multiple: true

      # PyPI never takes a file name twice, so a distribution uploaded at the
      # wrong version cannot be replaced by the right one.
      - name: Every distribution carries the release's version
        if: inputs.tag_name != ''
        env:
          RELEASE_TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG_NAME#v}"
          for distribution_path in dist/*; do
            distribution_file_name="$(basename "$distribution_path")"
            # The version is the second `-`-separated field of a wheel's or an
            # sdist's file name; the name before it is normalized to underscores.
            distribution_version="$(echo "${distribution_file_name%.tar.gz}" | cut -d- -f2)"
            if [ "$distribution_version" != "$release_version" ]; then
              echo "::error::$distribution_file_name is version $distribution_version, not the $release_version $RELEASE_TAG_NAME releases"
              exit 1
            fi
          done
          ls -l dist

      - name: An upload names the release it publishes
        if: ${{ !inputs.dry_run && inputs.tag_name == '' }}
        run: |
          echo "::error::an upload to PyPI publishes a release — name its tag in tag_name"
          exit 1

      # Reads every file's metadata as the upload would, and uploads nothing.
      - name: Check every distribution without uploading
        if: inputs.dry_run
        run: uv publish --dry-run --trusted-publishing never dist/*

      # `--check-url` makes a re-run after a partial upload skip the files PyPI
      # already holds rather than fail on the first of them.
      - name: Upload every distribution to PyPI
        if: ${{ !inputs.dry_run }}
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish --trusted-publishing never --check-url https://pypi.org/simple/ dist/*
