name: Repo Gates

# The toolchain-free gates: bash, git and jq only, no Rust, no Python, no
# network. Two of them began as their own workflows; all finish in seconds, so
# they share one runner.
#
# - License headers: every Rust and Python file carries the BUSL header. The
#   implementation is `scripts/check-license-headers.sh` rather than inline YAML
#   so that `cargo xtask run-local-ci-gates` runs the identical check — inline
#   workflow bash is, by construction, something no one can run before pushing.
# - license-header-gate: unit tests for that check's exemption list. The list is
#   the half that fails silently — a pathspec that stops covering first-party
#   code goes green — and running the check over this repo can never exercise
#   it, because a vendored tree only ever appears here in its exempt state.
# - ship-change-removed-gate: unit tests for the only mechanism that proves a
#   change's REMOVED inventory actually left the tree before the change may
#   archive. The gate shipped without tests and was green on 25 of 36 bullets
#   whose artifacts were all still on disk. Only the gate's own tests run here —
#   active change files legitimately fail the gate, since their removals have
#   not happened yet, so CI never runs it against them.
# - rig-brake: unit tests for the PreToolUse hook that escalates rig-consuming
#   commands to the human. It guards in both directions — a key that can never
#   fire reports safe on a command nobody vetted, and one that fires on a benign
#   probe trains the owner to click through. This workflow has no paths-ignore,
#   which is what keeps the hook's tests running on the `.claude/`-only PRs that
#   are the ones most likely to change it.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repo-gates:
    name: License headers + repo script gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Both gate-test suites run over throwaway repos they create
          # themselves — no authenticated git operation, so the checkout token
          # has no business in the local git config.
          persist-credentials: false
          # `check-license-headers.sh` discovers files with `git ls-files`, which
          # needs the work tree but not its history.
          fetch-depth: 1

      - name: License headers (Rust + Python)
        run: bash scripts/check-license-headers.sh

      - name: license-header-gate tests
        run: bash .claude/scripts/tests/license-header-gate.test.sh

      - name: ship-change-removed-gate tests
        run: bash .claude/scripts/tests/ship-change-removed-gate.test.sh

      - name: rig-brake tests
        run: bash .claude/scripts/tests/rig-brake.test.sh
