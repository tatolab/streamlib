name: CI

# What a pull request must prove before it merges: the code is formatted and
# lint-clean and its unit tests pass. The merge queue and `main` also prove the
# Apple path builds; a nightly run on `main` proves a stream still runs end to
# end on the runtime. It builds nothing that ships: release.yml builds and
# publishes the distributables, and distribution-checks.yml checks them nightly.
#
#   Lint                       formatting, clippy, the source gates, licences,
#                              Python types
#   Unit Test (Linux)          every Rust test suite, the hardware tests on a
#                              software GPU (the lavapipe the runtime carries);
#                              skipped on a pull request that changes no path the
#                              workspace's Rust build reads; the loom model,
#                              doctests and test-root suites run off pull requests
#   Integration test (Linux)   real streams on a real `tatolabd`: builds the
#                              runtime binaries those tests drive (a test fixture,
#                              never shipped), then the stream package, wheel and
#                              end-to-end stream tests; nightly on `main`
#   Build (macOS)              the Apple path compiles, is lint-clean and its test
#                              suites pass; merge queue and `main`
#   Integration test (macOS)   the same end-to-end tests on macOS; nightly on
#                              `main`
#   Report a failed nightly    opens or comments on the open "Nightly
#   integration run            integration run failed" issue when either
#                              integration job fails on the schedule
#
# A change that touches only prose or code CI never builds skips every job, and a
# skipped job satisfies a required check. Caches
# are saved by `main` alone and restored by pull requests. A failed job cancels
# the rest of its run, and a newer push cancels the run before it.

on:
  # No path filter: a required check must report on every pull request, so a
  # pull request that touches only paths CI never builds runs and skips its jobs.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.claude/**'
      - 'LICENSES/**'
      - 'examples/**'
      - 'docker/**'
      - 'installer/**'
  merge_group:
  # The integration jobs run here and on a manual dispatch alone: they take too
  # long to hold every change in the merge queue.
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job compiles or runs pull-request-authored code, so the token reads and
# does nothing else.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A runner never rebuilds after an edit.
  CARGO_INCREMENTAL: 0
  # Line tables keep a panic's file and line and drop the rest of the debug
  # info, which is most of a debug build's link time and cache size.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  RUST_BACKTRACE: 1
  # Homebrew's update and cleanup passes cost minutes on a macOS runner and buy
  # nothing: the image's formula index is days old at most.
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
  NEXTEST_VERSION: 0.9.148
  # The runtime unit's cache entries. Bump to drop every unit cached so far.
  RUNTIME_UNIT_CACHE_GENERATION: 1


jobs:
  # Everything that needs no test build.
  lint:
    name: Lint
    needs: changes-on-the-pull-request
    if: needs.changes-on-the-pull-request.outputs.paths_ci_checks_changed == 'true'
    # Pinned, as the macOS jobs are: the Rust cache restored under `shared-key` was
    # built on this image, and cargo cannot see which libpython a cached artifact links.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: License headers (Rust + Python)
        run: bash scripts/check-license-headers.sh

      # iceoryx2's PAL crates run bindgen. The image's own cmake and ninja build
      # aws-lc-sys's C. The engine loads the Vulkan loader at run time and VMA
      # builds against its vendored headers, so no Vulkan package is installed.
      # The action fetches only the packages the image lacks.
      # `timeout-minutes` is the backstop the composite action cannot declare itself.
      - name: Install system dependencies
        timeout-minutes: 15
        uses: ./.github/actions/install-linux-engine-build-dependencies
        with:
          packages: >-
            pkg-config
            libclang1-18
            libclang-common-18-dev

      - name: Install the Rust toolchain rust-toolchain.toml pins
        run: rustup toolchain install

      - name: Cache Rust dependencies
        uses: ./.github/actions/cache-rust-dependencies
        with:
          shared-key: lint

      # Slang takes minutes to build in manylinux; the staging script reuses a
      # build whose key matches, and these two files are the key.
      - name: Cache the Slang compiler build
        uses: actions/cache@v5
        with:
          path: target/slang_compiler_cache
          key: slang-compiler-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/stage_slang_compiler_libraries.sh', 'scripts/manylinux_2_28_image.sh') }}

      # The engine's build script compiles its shaders through the Slang
      # compiler this stages under target/.
      - name: Stage the Slang compiler
        run: bash scripts/stage_slang_compiler_libraries.sh

      - name: cargo fmt --all --check
        run: cargo fmt --all --check

      - name: cargo xtask check-all-source-gates
        run: cargo run --locked -q -p xtask -- check-all-source-gates

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2

      - name: cargo deny check licenses
        run: cargo deny --locked --workspace check licenses -D license-not-encountered

      # Compiler warnings and clippy lints are errors in every first-party crate and target.
      # The vendored vulkanalia trees are excluded because a change to them is a recorded
      # patch against upstream. Tests, examples and benches may print, so the `println!` ban
      # (`clippy::disallowed_macros`) holds for libraries and binaries only.
      - name: Clippy is fatal (workspace libraries and binaries)
        run: >-
          cargo clippy --locked --keep-going --workspace --lib --bins --no-deps
          --exclude streamlib-adapter-skia
          --exclude tatolab-vulkanalia --exclude tatolab-vulkanalia-sys --exclude tatolab-vulkanalia-vma
          -- -D warnings

      - name: Clippy is fatal (workspace tests, examples and benches)
        run: >-
          cargo clippy --locked --keep-going --workspace --tests --examples --benches --no-deps
          --exclude streamlib-adapter-skia
          --exclude tatolab-vulkanalia --exclude tatolab-vulkanalia-sys --exclude tatolab-vulkanalia-vma
          -- -A clippy::disallowed_macros -D warnings

      - name: Generated built-in node classes match the runtime's built-ins
        run: cargo run --locked -q -p xtask -- generate-built-in-node-classes --check

      - name: The control contract file matches the operation registry
        run: cargo run --locked -q -p xtask -- generate-control-contract --check

      # The earlier file is read through the API: this checkout holds no credentials and no
      # history to fetch it with.
      - name: A breaking change to the control contract bumps its version
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          EARLIER_COMMIT: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/${GITHUB_REPOSITORY}/contents/runtime/streamlib-control-contract/contract.json?ref=${EARLIER_COMMIT}" \
            > "${RUNNER_TEMP}/earlier-control-contract.json"
          cargo run --locked -q -p xtask -- check-control-contract-compatibility \
            --earlier-contract-file "${RUNNER_TEMP}/earlier-control-contract.json"

      - name: The TypeScript runtime client matches the control contract file
        run: cargo run --locked -q -p xtask -- generate-runtime-client --check

      - name: Install the TypeScript runtime client's dependencies
        run: npm ci --prefix sdk/tatolab-runtime-client --no-audit --no-fund

      - name: Type-check the TypeScript runtime client against its fixtures
        run: npx --yes --package typescript@6.0.2 tsc -p sdk/tatolab-runtime-client/type_check_fixtures

      - name: The TypeScript runtime client's own tests
        run: node --test 'sdk/tatolab-runtime-client/client_tests/*.test.mjs'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Prepare the environment pyright resolves against
        working-directory: sdk/streamlib-python-wheel
        run: |
          uv venv --python 3.12 .venv
          VIRTUAL_ENV="$PWD/.venv" uv pip install pytest numpy numba pydantic typing_extensions
          VIRTUAL_ENV="$PWD/.venv" uv pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Type-check the wheel's Python surface
        working-directory: sdk/streamlib-python-wheel
        run: uvx pyright@1.1.411

      # A failed job ends the run: the rest of it cannot make this change
      # mergeable, so it stops spending runners.
      - name: Cancel the rest of the run
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" || true

  # Which checks a pull request's changed paths call for. Prose, the Claude
  # rules, examples, docker and the installer call for none. Consumer packages,
  # the stream suite, the Python SDK and Python files call for no workspace Rust
  # build; every other path does. Every non-pull-request event calls for all.
  changes-on-the-pull-request:
    name: Changes on the pull request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      paths_ci_checks_changed: ${{ steps.classify.outputs.paths_ci_checks_changed }}
      workspace_rust_build_affected: ${{ steps.classify.outputs.workspace_rust_build_affected }}
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: classify
        env:
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "paths_ci_checks_changed=true" >> "$GITHUB_OUTPUT"
            echo "workspace_rust_build_affected=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          paths_ci_checks="$(
            git diff --name-only "$PULL_REQUEST_BASE_SHA" HEAD \
              | grep -Ev '^(docs|\.claude|LICENSES|examples|docker|installer)/' \
              | grep -Ev '\.md$' || true
          )"
          if [ -n "$paths_ci_checks" ]; then
            echo "paths_ci_checks_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "paths_ci_checks_changed=false" >> "$GITHUB_OUTPUT"
          fi
          paths_affecting_the_workspace_rust_build="$(
            printf '%s\n' "$paths_ci_checks" \
              | grep -Ev '^packages/[^/]+/' \
              | grep -Ev '^(tests/stream-on-runtime|sdk/tatolab-stream)/' \
              | grep -Ev '\.pyi?$' \
              | grep -v '^$' || true
          )"
          printf '%s\n' "$paths_ci_checks" | grep -q '^packages/test-fixtures/' \
            && paths_affecting_the_workspace_rust_build="packages/test-fixtures"
          if [ -n "$paths_affecting_the_workspace_rust_build" ]; then
            echo "workspace_rust_build_affected=true" >> "$GITHUB_OUTPUT"
          else
            echo "workspace_rust_build_affected=false" >> "$GITHUB_OUTPUT"
          fi

  # One test build: every test target of the packages CI tests,
  # `hardware-tests` included, compiled once and run on the Linux runtime
  # unit's bundled lavapipe rather than a GPU. `.config/nextest.toml` holds what
  # runs. A test that needs what this runner cannot give skips through
  # `rig_only_capability_skip` naming one closed-list reason; any other skip
  # fails the job.
  test-linux:
    name: Unit Test (Linux)
    needs: changes-on-the-pull-request
    if: needs.changes-on-the-pull-request.outputs.workspace_rust_build_affected == 'true'
    # Pinned, as the macOS jobs are: the Rust cache restored under `shared-key` was
    # built on this image, and cargo cannot see which libpython a cached artifact links.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    env:
      # The skip line `runtime/streamlib-engine/tests/support/rig_only_capability_skip.rs`
      # prints, and the closed list it may name; a unit test there holds both to it.
      HARDWARE_TEST_SKIP_LINE_PREFIX: "hardware test skipped, needing "
      HARDWARE_TEST_SKIP_LINE_REASONS: "Vulkan Video|DMA-BUF modifiers|CUDA|a camera|an audio device"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install system dependencies
        timeout-minutes: 15
        uses: ./.github/actions/install-linux-engine-build-dependencies
        with:
          packages: >-
            pkg-config
            libclang1-18
            libclang-common-18-dev
            python3-dev
            strace

      # Engine tests run the system `python3` against msgpack, which PyPI serves
      # without the Ubuntu mirrors.
      - name: Install msgpack for the system Python
        timeout-minutes: 5
        run: python3 -m pip install --user --break-system-packages 'msgpack>=1.0'

      - name: Install the Rust toolchain rust-toolchain.toml pins
        run: rustup toolchain install

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}

      - name: Cache Rust dependencies
        id: cache-rust-dependencies
        uses: ./.github/actions/cache-rust-dependencies
        with:
          shared-key: linux

      - name: Restore the compile-fail tests' build
        if: github.event_name != 'pull_request'
        id: restore-trybuild
        uses: actions/cache/restore@v5
        with:
          path: target/tests/trybuild
          key: trybuild-${{ runner.os }}-${{ steps.cache-rust-dependencies.outputs.external-crate-set-digest }}
          restore-keys: trybuild-${{ runner.os }}-

      - name: Cache the Linux bundled Vulkan driver build
        uses: actions/cache@v5
        with:
          path: target/linux_bundled_vulkan_driver_cache
          key: linux-bundled-vulkan-driver-${{ hashFiles('scripts/stage_linux_bundled_vulkan_driver.sh', 'scripts/manylinux_2_28_image.sh', 'scripts/stage_macos_bundled_vulkan_driver.sh') }}

      - name: Name the bundled Vulkan driver to the loader
        run: |
          bundled_vulkan_driver_directory="$RUNNER_TEMP/bundled_vulkan_driver"
          bash scripts/stage_linux_bundled_vulkan_driver.sh "$bundled_vulkan_driver_directory"
          test -f "$bundled_vulkan_driver_directory/lvp_icd.x86_64.json"
          for driver_search_replacing_variable in VK_DRIVER_FILES VK_ICD_FILENAMES; do
            if [ -n "${!driver_search_replacing_variable:-}" ]; then
              echo "::error::$driver_search_replacing_variable is set, so the loader would ignore the bundled driver"
              exit 1
            fi
          done
          # Every directory the loader searches for driver manifests on Linux.
          shopt -s nullglob
          driver_manifests_the_runner_carries=()
          IFS=: read -r -a xdg_config_directories <<< "${XDG_CONFIG_DIRS:-/etc/xdg}"
          IFS=: read -r -a xdg_data_directories <<< "${XDG_DATA_DIRS:-/usr/local/share:/usr/share}"
          for driver_search_directory in \
              "${XDG_CONFIG_HOME:-$HOME/.config}" "${xdg_config_directories[@]}" /etc \
              "${XDG_DATA_HOME:-$HOME/.local/share}" "${xdg_data_directories[@]}" \
              /usr/local/share /usr/share; do
            driver_manifests_the_runner_carries+=("$driver_search_directory"/vulkan/icd.d/*.json)
          done
          if (( ${#driver_manifests_the_runner_carries[@]} )); then
            printf '%s\n' "${driver_manifests_the_runner_carries[@]}"
            echo "::error::the runner carries a Vulkan driver of its own; the lane runs on the bundled one alone"
            exit 1
          fi
          echo "VK_ADD_DRIVER_FILES=$bundled_vulkan_driver_directory/lvp_icd.x86_64.json" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$bundled_vulkan_driver_directory" >> "$GITHUB_ENV"

      # Slang takes minutes to build in manylinux; the staging script reuses a
      # build whose key matches, and these two files are the key.
      - name: Cache the Slang compiler build
        uses: actions/cache@v5
        with:
          path: target/slang_compiler_cache
          key: slang-compiler-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/stage_slang_compiler_libraries.sh', 'scripts/manylinux_2_28_image.sh') }}

      # The engine's build script compiles its shaders through the Slang
      # compiler this stages under target/, and a debug build's tests open it
      # there at run time.
      - name: Stage the Slang compiler
        run: bash scripts/stage_slang_compiler_libraries.sh

      # The compile-fail test builds the engine a second time, in trybuild's
      # own target directory; it runs on `main` and in the merge queue.
      # The api-server's tests run the TypeScript runtime client, which imports zod.
      - name: Install the TypeScript runtime client's dependencies
        run: npm ci --prefix sdk/tatolab-runtime-client --no-audit --no-fund

      - name: Unit, integration and hardware tests
        env:
          TEST_FILTER: ${{ github.event_name == 'pull_request' && 'not binary_id(streamlib-engine::compile_fail_config_without_json_schema)' || 'all()' }}
        run: >-
          cargo nextest run --locked --profile ci -E "$TEST_FILTER"
          -p streamlib -p streamlib-macros -p streamlib-processor-schema
          -p streamlib-ipc-types -p streamlib-surface-client -p streamlib-gpu-frame-import-client
          -p streamlib-error
          -p streamlib-runtime-client-contract -p streamlib-engine
          -p streamlib-media-builtins -p streamlib-consumer-rhi -p streamlib-vulkan-video
          -p streamlib-video-bitstream -p streamlib-owned-device-video-codec-nodes -p tatolab-cli -p streamlib-python-wheel -p tatolab-module-sdk -p tatolab-module-sdk-macros
          -p tatolab-read-track -p streamlib-relay-track-reader -p streamlib-asset-media-facts
          --features streamlib-engine/hardware-tests,streamlib-media-builtins/hardware-tests,streamlib-vulkan-video/hardware-tests,streamlib-owned-device-video-codec-nodes/hardware-tests,tatolab-module-sdk/pyo3,tatolab-module-sdk/function-node
          --lib --bins --tests

      - name: Save the compile-fail tests' build
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.restore-trybuild.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: target/tests/trybuild
          key: ${{ steps.restore-trybuild.outputs.cache-primary-key }}

      # Its own target dir: `--cfg loom` rebuilds every dependency, and the
      # workspace build must not see that cfg.
      - name: GPU pool claim table loom model
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        env:
          RUSTFLAGS: --cfg loom
          CARGO_TARGET_DIR: target/loom
        run: cargo test --locked --release -p streamlib-ipc-types --test gpu_pool_claim_table_loom_model

      - name: Engine and media built-ins doctests
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        run: >-
          cargo test --locked --doc -p streamlib-engine -p streamlib-media-builtins
          --features streamlib-engine/hardware-tests,streamlib-media-builtins/hardware-tests

      - name: Tests under a test machine root
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        env:
          MACHINE_DIRECTORIES_UNDER_A_TEST_ROOT_SELECTION: >-
            -p streamlib-runtime-client-contract -p streamlib-api-server -p tatolabd -p tatolab-cli
            --features streamlib-runtime-client-contract/machine-directories-under-a-test-root
            --features streamlib-api-server/machine-directories-under-a-test-root
            --features tatolabd/machine-directories-under-a-test-root,tatolabd/hardware-tests
            --features tatolab-cli/machine-directories-under-a-test-root
        run: |
          set -o pipefail
          run_status=0
          # shellcheck disable=SC2086
          cargo nextest run --locked --profile ci-machine-directories-under-a-test-root \
            $MACHINE_DIRECTORIES_UNDER_A_TEST_ROOT_SELECTION \
            -E 'package(streamlib-runtime-client-contract) | package(tatolab-cli)' || run_status=$?
          cp target/nextest/ci-machine-directories-under-a-test-root/junit.xml "$RUNNER_TEMP/junit-without-a-test-root.xml"
          # shellcheck disable=SC2086
          TATOLAB_TEST_MACHINE_ROOT="$(mktemp -d /tmp/tl-XXXXXX)" \
            cargo nextest run --locked --profile ci-machine-directories-under-a-test-root \
            $MACHINE_DIRECTORIES_UNDER_A_TEST_ROOT_SELECTION \
            -E 'package(streamlib-api-server) | package(tatolabd)' || run_status=$?
          exit "$run_status"

      - name: Every hardware-test skip names what this machine lacks from the closed list
        if: ${{ !cancelled() }}
        run: |
          junit_reports=(target/nextest/ci/junit.xml)
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            junit_reports+=(
              "$RUNNER_TEMP/junit-without-a-test-root.xml"
              target/nextest/ci-machine-directories-under-a-test-root/junit.xml
            )
          fi
          python3 scripts/ci/check_hardware_test_skip_lines.py \
            --skip-line-prefix "$HARDWARE_TEST_SKIP_LINE_PREFIX" \
            --skip-line-reasons "$HARDWARE_TEST_SKIP_LINE_REASONS" \
            --expected-device llvmpipe \
            "${junit_reports[@]}"

      # A failed job ends the run: the rest of it cannot make this change
      # mergeable, so it stops spending runners.
      - name: Cancel the rest of the run
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" || true

  # The runtime unit — `tatolabd`, `tatolab`, and the lend a processor
  # interpreter borrows `tatolab.runtime` from — and every suite that runs on
  # it: the wheel's own, the integration suite (one `tatolabd` per test, each
  # fixture stream loaded with `tatolab open --play` and driven over its local API, on
  # the lavapipe the unit carries) and a scaffolded stream; nightly on `main`
  # and on a manual dispatch only.
  integration-test-linux:
    name: Integration test (Linux)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Pinned, as the macOS jobs are: the Rust cache restored under `shared-key` was
    # built on this image, and cargo cannot see which libpython a cached artifact links.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install the Rust toolchain rust-toolchain.toml pins
        run: rustup toolchain install

      - name: Digest of everything the unit is built from
        id: digest
        run: echo "digest=$(bash scripts/ci/runtime_unit_input_digest.sh "$ImageOS" debug)" >> "$GITHUB_OUTPUT"

      # Restored when nothing it is built from changed: a change to an
      # extension, a suite or the stream package's tests runs on the unit `main`
      # built.
      - name: Restore the runtime unit
        id: restore
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ runner.temp }}/tatolab-runtime-unit.tar.gz
            ${{ runner.temp }}/tatolab-runtime-unit-under-a-test-root.tar.gz
          key: runtime-unit-linux-${{ env.RUNTIME_UNIT_CACHE_GENERATION }}-${{ steps.digest.outputs.digest }}

      # iceoryx2's PAL crates run bindgen. The image's own cmake and ninja build
      # aws-lc-sys's C. The engine loads the Vulkan loader at run time and VMA
      # builds against its vendored headers, so no Vulkan package is installed.
      # The action fetches only the packages the image lacks.
      # `timeout-minutes` is the backstop the composite action cannot declare itself.
      - name: Install system dependencies
        timeout-minutes: 15
        uses: ./.github/actions/install-linux-engine-build-dependencies
        with:
          packages: >-
            pkg-config
            libclang1-18
            libclang-common-18-dev
            python3-dev

      - name: Cache Rust dependencies
        uses: ./.github/actions/cache-rust-dependencies
        with:
          shared-key: linux-runtime
          workspaces: |
            . -> target
            packages/streamlib-h264 -> target

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # The stream package with its test group and nothing of the runtime, so a
      # stream test that reaches for the runtime fails to import; built and
      # installed, not editable. 3.12 is the floor `requires-python` promises.
      - name: Stream package tests (Python 3.12)
        run: |
          (
            cd sdk/tatolab-stream
            uv venv --python 3.12 .venv
            VIRTUAL_ENV="$PWD/.venv" uv pip install . --group test
            .venv/bin/pytest tests -q
            uvx pyright@1.1.411
          )
          uv build --wheel --out-dir "$RUNNER_TEMP/tatolab-stream-dist" sdk/tatolab-stream

      - name: Cache the Linux bundled Vulkan driver build
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: target/linux_bundled_vulkan_driver_cache
          key: linux-bundled-vulkan-driver-${{ hashFiles('scripts/stage_linux_bundled_vulkan_driver.sh', 'scripts/manylinux_2_28_image.sh', 'scripts/stage_macos_bundled_vulkan_driver.sh') }}

      - name: Cache the Slang compiler build
        uses: actions/cache@v5
        with:
          path: target/slang_compiler_cache
          key: slang-compiler-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/stage_slang_compiler_libraries.sh', 'scripts/manylinux_2_28_image.sh') }}

      # Staged whether or not the unit was restored: the suite's venv builds the
      # H.264 and H.265 modules, whose Vulkan Video build script compiles its
      # shaders through it.
      - name: Stage the Slang compiler
        run: bash scripts/stage_slang_compiler_libraries.sh

      # Both forms, in debug: as users run it, and with the machine directories
      # under a test root, which the integration suite requires. The second
      # replaces the first in place, so each is packed before the next build.
      # It refuses a wheel carrying anything beside `tatolab/runtime/` and a
      # lend missing a driver file. Tarred, because `bin/` must stay executable.
      - name: Build the runtime unit
        if: steps.restore.outputs.cache-hit != 'true'
        run: |
          cargo xtask build-runtime
          tar -C target/tatolab-runtime -czf "$RUNNER_TEMP/tatolab-runtime-unit.tar.gz" bin lib wheel
          cargo xtask build-runtime --machine-directories-under-a-test-root
          tar -C target/tatolab-runtime -czf "$RUNNER_TEMP/tatolab-runtime-unit-under-a-test-root.tar.gz" \
            bin lib machine-directories-under-a-test-root

      - name: Save the runtime unit
        if: steps.restore.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ runner.temp }}/tatolab-runtime-unit.tar.gz
            ${{ runner.temp }}/tatolab-runtime-unit-under-a-test-root.tar.gz
          key: ${{ steps.restore.outputs.cache-primary-key }}

      # Where every suite looks for it by default, `<repository>/target/tatolab-runtime`.
      - name: Unpack the runtime unit
        run: |
          rm -rf target/tatolab-runtime
          mkdir -p target/tatolab-runtime
          tar -C target/tatolab-runtime -xzf "$RUNNER_TEMP/tatolab-runtime-unit.tar.gz"

      # The wheel's own suite on the unit's own wheel: the casts, a processor
      # interpreter's bootstrap and helper process, and the
      # conformance gate that holds the binary to `tatolab.stream`'s Protocols.
      # stubtest compares the rest of `_engine.pyi` to the binary.
      - name: Wheel stubs and Python suite (GPU-free half)
        working-directory: sdk/streamlib-python-wheel
        run: |
          uv venv --python 3.12 .venv
          VIRTUAL_ENV="$PWD/.venv" uv pip install pytest mypy numpy numba pydantic typing_extensions
          VIRTUAL_ENV="$PWD/.venv" uv pip install -e ../tatolab-stream
          VIRTUAL_ENV="$PWD/.venv" uv pip install "$GITHUB_WORKSPACE"/target/tatolab-runtime/wheel/*.whl
          .venv/bin/python tests/runtime_backed_protocol_conformance.py --print-stubtest-allowlist > "$RUNNER_TEMP/engine-stubtest-allowlist.txt"
          .venv/bin/python -m mypy.stubtest tatolab.runtime._engine --allowlist "$RUNNER_TEMP/engine-stubtest-allowlist.txt"
          .venv/bin/python -m pytest tests/ -v -m "not requires_gpu"

      # Each `tatolab-ops` node as Python, then compiled by the unit's own wheel
      # and held to that Python.
      - name: tatolab-ops suite
        working-directory: packages/tatolab-ops
        run: |
          VIRTUAL_ENV="$GITHUB_WORKSPACE/sdk/streamlib-python-wheel/.venv" uv pip install --no-deps . pillow
          "$GITHUB_WORKSPACE/sdk/streamlib-python-wheel/.venv/bin/python" -m pytest tests -v

      - name: Driver-search tests against the lend
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/tatolab-stream-dist" sdk/tatolab-stream
          uv venv --python 3.12 "$RUNNER_TEMP/lend-check-venv"
          VIRTUAL_ENV="$RUNNER_TEMP/lend-check-venv" uv pip install "$RUNNER_TEMP"/tatolab-stream-dist/*.whl pytest
          cd sdk/streamlib-python-wheel
          PYTHONPATH="$GITHUB_WORKSPACE/target/tatolab-runtime/lib/tatolab/lend" \
            "$RUNNER_TEMP/lend-check-venv/bin/python" -m pytest -v \
            tests_against_the_runtime_unit_lend/

      # A runtime at least as new as a stream's `tatolab-stream` runs it: the lent
      # bootstrap describes a project's nodes with the newest release on PyPI.
      - name: The lend describes nodes with the released tatolab-stream
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/released-sdk-venv"
          VIRTUAL_ENV="$RUNNER_TEMP/released-sdk-venv" uv pip install --refresh-package tatolab-stream \
            tatolab-stream pytest
          cd sdk/streamlib-python-wheel
          PYTHONPATH="$GITHUB_WORKSPACE/target/tatolab-runtime/lib/tatolab/lend" \
            "$RUNNER_TEMP/released-sdk-venv/bin/python" -m pytest -v \
            tests_against_the_runtime_unit_lend/test_lent_bootstrap_describes_with_the_installed_tatolab_stream.py

      - name: Unpack the runtime unit under a test root
        run: |
          rm -rf target/tatolab-runtime
          mkdir -p target/tatolab-runtime
          tar -C target/tatolab-runtime -xzf "$RUNNER_TEMP/tatolab-runtime-unit-under-a-test-root.tar.gz"

      # The `moq-relay` the gateway-node tests dial, at the version `tatolab-moq`
      # tests against, in the install root the suite and the fixture drivers read.
      - name: Cache the fixture relay
        uses: actions/cache@v5
        with:
          path: target/fixture-relay
          key: fixture-relay-moq-relay-0.17.7-noq-${{ runner.os }}-${{ runner.arch }}

      - name: Build the fixture relay
        run: |
          [ -x target/fixture-relay/bin/moq-relay ] || cargo install moq-relay --version =0.17.7 \
            --locked --no-default-features --features noq --root target/fixture-relay

      - name: The suite's venv, from its lockfile
        working-directory: tests/stream-on-runtime
        run: uv sync --frozen

      # The runtime syncs each scaffolded project's venv, which requires this
      # checkout's `tatolab-stream`; once `main`'s version is ahead of PyPI's,
      # only this run's build has it. Its core modules are the wheels the unit
      # carries.
      - name: Integration suite (all but rig-only)
        working-directory: tests/stream-on-runtime
        env:
          UV_FIND_LINKS: ${{ runner.temp }}/tatolab-stream-dist
        run: .venv/bin/pytest -v -m "not rig_only_capability"

      # A scaffolded stream's one node imports with no runtime installed, in
      # what a user's `.venv` holds: `tatolab-stream` from its `uv sync`, and
      # the test-pattern and ops wheels the unit carries.
      - name: Scaffolded stream's node types import (Python 3.12)
        run: |
          cp -R sdk/tatolab-stream/scaffold_template "$RUNNER_TEMP/scaffold"
          uv venv --python 3.12 "$RUNNER_TEMP/scaffold-venv"
          VIRTUAL_ENV="$RUNNER_TEMP/scaffold-venv" uv pip install \
            "$RUNNER_TEMP"/tatolab-stream-dist/*.whl \
            "$GITHUB_WORKSPACE"/target/tatolab-runtime/lib/tatolab/imports/tatolab_testpattern-*.whl \
            "$GITHUB_WORKSPACE"/target/tatolab-runtime/lib/tatolab/imports/tatolab_ops-*.whl
          cd "$RUNNER_TEMP/scaffold"
          "$RUNNER_TEMP/scaffold-venv/bin/python" - <<'EOF'
          import importlib
          import importlib.util
          import json
          import sys

          assert importlib.util.find_spec("tatolab.runtime") is None, "a runtime is installed"
          graph = json.load(open("streams/main.graph.json"))
          for node in graph["nodes"]:
              module_name, class_name = node["type"].split(":")
              getattr(importlib.import_module(module_name), class_name)
          runtime_modules_loaded = [name for name in sys.modules if name.startswith("tatolab.runtime")]
          assert runtime_modules_loaded == [], runtime_modules_loaded
          print([node["type"] for node in graph["nodes"]])
          EOF

      # A failed job ends the run: the rest of it cannot make this change
      # mergeable, so it stops spending runners.
      - name: Cancel the rest of the run
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" || true

  # The Apple path on every change that can break it: macOS is a supported
  # floor, and an Apple-path change merges only with this lane green.
  # `macos-26`, not `macos-latest`: the image decides the SDK the Apple
  # frameworks link against. GPU work runs last and narrow, on the runner's
  # paravirtual Metal device through MoltenVK.
  build-macos:
    name: Build (macOS)
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install the C++ build tools
        run: brew install cmake ninja

      - name: Install the Rust toolchain rust-toolchain.toml pins
        run: rustup toolchain install

      - name: Cache Rust dependencies
        uses: ./.github/actions/cache-rust-dependencies
        with:
          # The key names the image: cargo's fingerprints cannot see which
          # SDK a cached artifact was linked against.
          shared-key: macos-26

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache the Slang compiler release
        uses: actions/cache@v5
        with:
          path: target/slang_compiler_cache
          key: slang-compiler-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/stage_slang_compiler_libraries.sh', 'scripts/manylinux_2_28_image.sh') }}

      # The engine's build script compiles its shaders through the Slang
      # compiler this stages under target/, and a debug build's tests open it
      # there at run time.
      - name: Stage the Slang compiler
        run: bash scripts/stage_slang_compiler_libraries.sh

      # Compiler warnings and clippy lints are errors in every first-party crate and target
      # except streamlib-adapter-skia, which is compiled but not linted.
      # The vendored vulkanalia trees are excluded because a change to them is a recorded
      # patch against upstream. Tests, examples and benches may print, so the `println!` ban
      # (`clippy::disallowed_macros`) holds for libraries and binaries only.
      - name: Clippy is fatal (workspace libraries and binaries)
        run: >-
          cargo clippy --locked --keep-going --workspace --lib --bins --no-deps
          --exclude streamlib-adapter-skia
          --exclude tatolab-vulkanalia --exclude tatolab-vulkanalia-sys --exclude tatolab-vulkanalia-vma
          -- -D warnings

      - name: Clippy is fatal (workspace tests, examples and benches)
        run: >-
          cargo clippy --locked --keep-going --workspace --tests --examples --benches --no-deps
          --exclude streamlib-adapter-skia
          --exclude tatolab-vulkanalia --exclude tatolab-vulkanalia-sys --exclude tatolab-vulkanalia-vma
          -- -A clippy::disallowed_macros -D warnings

      # The api-server's tests run the TypeScript runtime client, which imports zod.
      - name: Install the TypeScript runtime client's dependencies
        if: github.event_name != 'pull_request'
        run: npm ci --prefix sdk/tatolab-runtime-client --no-audit --no-fund

      - name: Run unit tests
        if: github.event_name != 'pull_request'
        run: |
          cargo test --locked -p streamlib -p streamlib-macros \
            -p streamlib-processor-schema -p streamlib-ipc-types \
            -p streamlib-error --lib
          # The macOS machine runtime lock's takes, refusals and probes run here
          # and nowhere else.
          cargo test --locked -p streamlib-runtime-client-contract
          cargo test --locked -p streamlib-runtime-client-contract \
            --features machine-directories-under-a-test-root
          cargo test --locked -p streamlib-engine --test attribute_macro_test
          cargo test --locked -p streamlib-media-builtins --lib
          # Where a golden names a built-in macOS compiles out, the load is
          # refused naming the floor and the rest of it loads.
          cargo test --locked -p streamlib-media-builtins --test every_golden_graph_loads
          cargo test --locked -p streamlib-consumer-rhi --lib
          cargo test --locked -p streamlib-video-bitstream -p streamlib-owned-device-video-codec-nodes
          cargo test --locked -p tatolab-module-sdk --features pyo3,function-node
          cargo test --locked -p tatolabd --features machine-directories-under-a-test-root
          # The runtime directory is fixed under /tmp on macOS, so the CLI's
          # tests need the feature to isolate each test's machine.
          cargo test --locked -p tatolab-cli \
            --features machine-directories-under-a-test-root
          # The surface-share service's raw-Mach arm. IOSurface and Mach need
          # no GPU.
          cargo test --locked -p streamlib-surface-client
          cargo test --locked -p streamlib-engine --test surface_share_over_raw_mach
          # Compiled but not run: the AVFoundation, VideoToolbox and CoreAudio
          # arms need a camera, a microphone, their access grants, a media
          # engine and a GPU no runner has.
          cargo test --locked -p streamlib-engine -p streamlib-media-builtins \
            --features streamlib-engine/hardware-tests,streamlib-media-builtins/hardware-tests \
            --lib \
            --test avfoundation_camera_captures_through_the_video_device_seam \
            --test coreaudio_arm_stamps_blocks_with_the_devices_own_timing \
            --test coreaudio_arm_plays_what_it_is_given \
            --test coreaudio_arm_hears_the_room_through_the_built_in_microphone \
            --test coreaudio_arm_hears_what_it_plays \
            --test coreaudio_arm_hears_its_own_playback_through_a_muted_process_tap --no-run
          cargo test --locked -p streamlib-owned-device-video-codec-nodes --features hardware-tests \
            --test videotoolbox_sessions_round_trip_the_psnr_references --no-run

      # The source-walking gates evaluate `cfg` for macOS as well as Linux, so
      # `apple/` is linted here. Their prescriptions name Linux calls Darwin
      # lacks; the portable spelling they accept is what the macOS arms use.
      - name: cargo xtask lint-logging and check-no-inheritable-descriptor
        run: |
          cargo run --locked -q -p xtask -- lint-logging
          cargo run --locked -q -p xtask -- check-no-inheritable-descriptor

      # The tests embed the interpreter setup-python installed and import
      # `tatolab.stream` from source, so its one dependency goes there.
      - name: Wheel crate unit tests
        if: github.event_name != 'pull_request'
        run: |
          python -m pip install 'msgpack>=1.0'
          cargo test --locked -p streamlib-python-wheel --lib -- --test-threads=1

      - name: Install MoltenVK and find the Metal device under it
        if: github.event_name != 'pull_request'
        run: |
          system_profiler SPDisplaysDataType
          brew install molten-vk vulkan-loader vulkan-tools
          vulkaninfo --summary

      # Their stream-action and real-engine tests create and load a stream,
      # whose start builds the engine's GPU context.
      - name: Engine and local API server tests on the Metal device
        if: github.event_name != 'pull_request'
        run: |
          # `--test-threads=1`: two of these open iceoryx2 nodes in child
          # processes of this same binary and race each other in parallel.
          cargo test --locked -p streamlib-engine --lib -- --test-threads=1
          TATOLAB_TEST_MACHINE_ROOT="$(mktemp -d /tmp/tl-XXXXXX)" \
            cargo test --locked -p streamlib-api-server --lib \
            --features machine-directories-under-a-test-root

      - name: In-process adapter tests
        if: github.event_name != 'pull_request'
        run: |
          set -o pipefail
          cargo test --locked -p streamlib-adapter-vulkan \
            -p streamlib-adapter-cpu-readback -p streamlib-adapter-skia \
            -- --nocapture 2>&1 | tee adapter-test-output.txt
          if grep -i "skip" adapter-test-output.txt \
              | grep -v "no validation messenger installed"; then
            echo "::error::an in-process adapter test skipped instead of running on the Metal device"
            exit 1
          fi

      - name: Frame-allocation budget on the Metal device
        if: github.event_name != 'pull_request'
        run: |
          set -o pipefail
          CARGO_TERM_COLOR=never cargo test --locked -p streamlib-engine -p streamlib-media-builtins \
            --features streamlib-engine/hardware-tests,streamlib-media-builtins/hardware-tests \
            --lib -- --color never --test-threads=1 --nocapture \
            vulkan::rhi::vulkan_metal_working_set_budget::tests::an_iosurface_backed_vulkan_image_is_counted_once_in_the_metal_working_set_usage \
            vulkan::rhi::vulkan_metal_working_set_budget::tests::an_iosurface_backed_pixel_buffer_is_counted_once_in_the_metal_working_set_usage \
            vulkan::rhi::vulkan_device::tests::a_frame_texture_past_a_budget_with_no_room_left_is_refused_while_an_engine_buffer_still_allocates \
            core::compiler::compiler_ops::subprocess_escalate::handle_lifecycle::tests::releasing_a_one_off_pixel_buffer_evicts_its_lookup_and_leaves_its_slots_published_frame_cached \
            2>&1 | tee frame-allocation-budget-on-metal-output.txt
          if grep -i "skip" frame-allocation-budget-on-metal-output.txt; then
            echo "::error::a frame-allocation budget test skipped instead of running on the Metal device"
            exit 1
          fi
          sed -n '/Running unittests .*streamlib_engine-/,/^test result:/p' \
            frame-allocation-budget-on-metal-output.txt \
            | grep "^test result: ok. 4 passed;"

      # A failed job ends the run: the rest of it cannot make this change
      # mergeable, so it stops spending runners.
      - name: Cancel the rest of the run
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" || true

  # The aarch64-apple-darwin runtime unit, in debug, and every suite that runs
  # on it: the wheel's stub and Python suite on this binary, a scaffolded
  # stream on the Vulkan driver the lend carries, the integration suite's
  # GPU-free half, the extension, whose clock is read per platform, and the
  # stream suite on this floor. A stock Mac has no Vulkan driver and neither
  # does the runner image, so a stream that runs here ran on the MoltenVK
  # inside the lend. Nightly on `main` and on a manual dispatch only.
  integration-test-macos:
    name: Integration test (macOS)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install the Rust toolchain rust-toolchain.toml pins
        run: rustup toolchain install

      # The interpreter the venvs below are built from and the extension's
      # unit tests link: the image's own `python3` is not one the abi3-py312
      # floor accepts.
      - name: Install Python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Digest of everything the unit is built from
        id: digest
        run: echo "digest=$(bash scripts/ci/runtime_unit_input_digest.sh "$ImageOS" debug)" >> "$GITHUB_OUTPUT"

      # Restored when nothing it is built from changed: a change to an
      # extension, a suite or the stream package's tests runs on the unit `main`
      # built.
      - name: Restore the runtime unit
        id: restore
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ runner.temp }}/tatolab-runtime-unit.tar.gz
            ${{ runner.temp }}/tatolab-runtime-unit-under-a-test-root.tar.gz
          key: runtime-unit-macos-${{ env.RUNTIME_UNIT_CACHE_GENERATION }}-${{ steps.digest.outputs.digest }}

      - name: Install the C++ build tools
        if: steps.restore.outputs.cache-hit != 'true'
        run: brew install cmake ninja

      - name: Cache Rust dependencies
        uses: ./.github/actions/cache-rust-dependencies
        with:
          shared-key: macos-26-runtime
          workspaces: |
            . -> target
            packages/streamlib-webrtc -> target
            packages/tatolab-microphone -> target
            packages/tatolab-speaker -> target
            packages/tatolab-opus -> target

      # Both forms, in debug: as users run it, and with the machine directories
      # under a test root, which the integration suite requires. The second
      # replaces the first in place, so each is packed before the next build.
      # It refuses a wheel carrying anything beside `tatolab/runtime/` and a
      # lend missing a driver file. Tarred, because `bin/` must stay executable.
      - name: Build the runtime unit
        if: steps.restore.outputs.cache-hit != 'true'
        run: |
          cargo xtask build-runtime
          tar -C target/tatolab-runtime -czf "$RUNNER_TEMP/tatolab-runtime-unit.tar.gz" bin lib wheel
          cargo xtask build-runtime --machine-directories-under-a-test-root
          tar -C target/tatolab-runtime -czf "$RUNNER_TEMP/tatolab-runtime-unit-under-a-test-root.tar.gz" \
            bin lib machine-directories-under-a-test-root

      - name: Save the runtime unit
        if: steps.restore.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ runner.temp }}/tatolab-runtime-unit.tar.gz
            ${{ runner.temp }}/tatolab-runtime-unit-under-a-test-root.tar.gz
          key: ${{ steps.restore.outputs.cache-primary-key }}

      # Where every suite looks for it by default, `<repository>/target/tatolab-runtime`.
      - name: Unpack the runtime unit
        run: |
          rm -rf target/tatolab-runtime
          mkdir -p target/tatolab-runtime
          tar -C target/tatolab-runtime -xzf "$RUNNER_TEMP/tatolab-runtime-unit.tar.gz"

      # The wheel's own suite on the unit's own wheel: the casts, a processor
      # interpreter's bootstrap and helper process, and the
      # conformance gate that holds the binary to `tatolab.stream`'s Protocols.
      # stubtest compares the rest of `_engine.pyi` to the binary.
      - name: Wheel stubs and Python suite (GPU-free half)
        working-directory: sdk/streamlib-python-wheel
        run: |
          uv venv --python 3.12 .venv
          VIRTUAL_ENV="$PWD/.venv" uv pip install pytest mypy numpy numba pydantic typing_extensions
          VIRTUAL_ENV="$PWD/.venv" uv pip install -e ../tatolab-stream
          VIRTUAL_ENV="$PWD/.venv" uv pip install "$GITHUB_WORKSPACE"/target/tatolab-runtime/wheel/*.whl
          .venv/bin/python tests/runtime_backed_protocol_conformance.py --print-stubtest-allowlist > "$RUNNER_TEMP/engine-stubtest-allowlist.txt"
          .venv/bin/python -m mypy.stubtest tatolab.runtime._engine --allowlist "$RUNNER_TEMP/engine-stubtest-allowlist.txt"
          .venv/bin/python -m pytest tests/ -v -m "not requires_gpu"

      # The H.264 module on VideoToolbox: the wheel the WebRTC extension below
      # depends on, its stub against the binary, and its GPU-free tests.
      - name: "Extension: build streamlib-h264 into a venv holding tatolab-stream"
        working-directory: packages/streamlib-h264
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/tatolab-stream-dist" "$GITHUB_WORKSPACE/sdk/tatolab-stream"
          uv venv --python 3.12 .venv
          VIRTUAL_ENV="$PWD/.venv" uv pip install pytest mypy typing_extensions
          VIRTUAL_ENV="$PWD/.venv" uv pip install "$RUNNER_TEMP"/tatolab-stream-dist/*.whl
          uvx maturin@1.9.6 build --out "$RUNNER_TEMP/tatolab-h264-dist"
          VIRTUAL_ENV="$PWD/.venv" uv pip install "$RUNNER_TEMP"/tatolab-h264-dist/*.whl
          .venv/bin/python -m mypy.stubtest tatolab.h264._native
          PYTHONPATH="$GITHUB_WORKSPACE/target/tatolab-runtime/lib/tatolab/lend" \
            .venv/bin/python -m pytest tests/ -v -m "not requires_gpu"

      - name: The scaffolded stream runs on the driver the lend carries
        run: |
          bash scripts/check_scaffolded_stream_runs_on_the_driver_the_macos_lend_carries.sh \
            "$GITHUB_WORKSPACE/target/tatolab-runtime" "$RUNNER_TEMP/tatolab-stream-dist"

      # A stream's venv exactly as a third party's holds the extension:
      # `tatolab-stream` and the extension, and no engine. Its tests wire the
      # test pattern to the publisher and the publisher to the H.264 and Opus
      # nodes, so the venv holds those three modules too.
      - name: "Extension: build streamlib-webrtc into a venv holding tatolab-stream"
        working-directory: packages/streamlib-webrtc
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/tatolab-stream-dist" "$GITHUB_WORKSPACE/sdk/tatolab-stream"
          uv venv --python 3.12 .venv
          VIRTUAL_ENV="$PWD/.venv" uv pip install pytest mypy typing_extensions
          VIRTUAL_ENV="$PWD/.venv" uv pip install "$RUNNER_TEMP"/tatolab-stream-dist/*.whl "$RUNNER_TEMP"/tatolab-h264-dist/*.whl
          VIRTUAL_ENV="$PWD/.venv" uv pip install "$GITHUB_WORKSPACE/packages/tatolab-opus" "$GITHUB_WORKSPACE/packages/tatolab-testpattern"
          VIRTUAL_ENV="$PWD/.venv" uvx maturin@1.9.6 develop

      - name: "Extension: crate tests and clippy"
        working-directory: packages/streamlib-webrtc
        env:
          PYO3_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: |
          cargo test --locked --lib
          cargo clippy --locked --lib --all-targets -- -D warnings

      # Carries the portability gate over the built `.so`, and on macOS the
      # clock-parity test. The tests that import `tatolab.runtime` borrow it
      # from the lend, as a processor interpreter does.
      - name: "Extension: stubs and tests, GPU-free"
        working-directory: packages/streamlib-webrtc
        run: |
          .venv/bin/python -m mypy.stubtest tatolab.webrtc._native
          PYTHONPATH="$GITHUB_WORKSPACE/target/tatolab-runtime/lib/tatolab/lend" \
            .venv/bin/python -m pytest tests/ -v -m "not requires_gpu"

      - name: "Extension: build tatolab-microphone into a venv holding tatolab-stream"
        working-directory: packages/tatolab-microphone
        run: |
          uv venv --python 3.12 .venv
          VIRTUAL_ENV="$PWD/.venv" uv pip install pytest mypy typing_extensions
          VIRTUAL_ENV="$PWD/.venv" uv pip install "$RUNNER_TEMP"/tatolab-stream-dist/*.whl
          VIRTUAL_ENV="$PWD/.venv" uvx maturin@1.9.6 develop

      - name: "Extension: tatolab-microphone crate tests and clippy"
        working-directory: packages/tatolab-microphone
        env:
          PYO3_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: |
          cargo test --locked --lib
          cargo clippy --locked --lib --all-targets -- -D warnings

      - name: "Extension: tatolab-microphone stubs and tests"
        working-directory: packages/tatolab-microphone
        run: |
          .venv/bin/python -m mypy.stubtest tatolab.microphone._native
          PYTHONPATH="$GITHUB_WORKSPACE/target/tatolab-runtime/lib/tatolab/lend" \
            .venv/bin/python -m pytest tests/ -v

      - name: "Extension: build tatolab-speaker into a venv holding tatolab-stream"
        working-directory: packages/tatolab-speaker
        run: |
          uv venv --python 3.12 .venv
          VIRTUAL_ENV="$PWD/.venv" uv pip install pytest mypy typing_extensions
          VIRTUAL_ENV="$PWD/.venv" uv pip install "$RUNNER_TEMP"/tatolab-stream-dist/*.whl
          VIRTUAL_ENV="$PWD/.venv" uvx maturin@1.9.6 develop

      - name: "Extension: tatolab-speaker crate tests and clippy"
        working-directory: packages/tatolab-speaker
        env:
          PYO3_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: |
          cargo test --locked --lib
          cargo clippy --locked --lib --all-targets -- -D warnings

      - name: "Extension: tatolab-speaker stubs and tests"
        working-directory: packages/tatolab-speaker
        run: |
          .venv/bin/python -m mypy.stubtest tatolab.speaker._native
          PYTHONPATH="$GITHUB_WORKSPACE/target/tatolab-runtime/lib/tatolab/lend" \
            .venv/bin/python -m pytest tests/ -v

      - name: "Extension: build tatolab-opus into a venv holding tatolab-stream"
        working-directory: packages/tatolab-opus
        run: |
          uv venv --python 3.12 .venv
          VIRTUAL_ENV="$PWD/.venv" uv pip install pytest mypy typing_extensions
          VIRTUAL_ENV="$PWD/.venv" uv pip install "$RUNNER_TEMP"/tatolab-stream-dist/*.whl
          VIRTUAL_ENV="$PWD/.venv" uvx maturin@1.9.6 develop

      - name: "Extension: tatolab-opus crate tests and clippy"
        working-directory: packages/tatolab-opus
        env:
          PYO3_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: |
          cargo test --locked --lib
          cargo clippy --locked --lib --all-targets -- -D warnings

      # Carries the portability gate over the built `.dylib`: libopus is
      # linked statically, so the Mach-O loads nothing outside macOS itself.
      - name: "Extension: tatolab-opus stubs and tests"
        working-directory: packages/tatolab-opus
        run: |
          .venv/bin/python -m mypy.stubtest tatolab.opus._native
          PYTHONPATH="$GITHUB_WORKSPACE/target/tatolab-runtime/lib/tatolab/lend" \
            .venv/bin/python -m pytest tests/ -v

      # The stream package on this floor, with nothing of the runtime installed.
      - name: Stream suite
        working-directory: sdk/tatolab-stream
        run: |
          rm -rf .venv
          uv venv --python 3.12 .venv
          VIRTUAL_ENV="$PWD/.venv" uv pip install . --group test
          .venv/bin/pytest tests -q

      # The runtime syncs each scaffolded project's venv, which requires this
      # checkout's `tatolab-stream`; once `main`'s version is ahead of PyPI's,
      # only this run's build has it. Its core modules are the wheels the unit
      # carries.
      - name: Integration suite (GPU-free half)
        env:
          UV_FIND_LINKS: ${{ runner.temp }}/tatolab-stream-dist
        run: |
          rm -rf target/tatolab-runtime
          mkdir -p target/tatolab-runtime
          tar -C target/tatolab-runtime -xzf "$RUNNER_TEMP/tatolab-runtime-unit-under-a-test-root.tar.gz"
          cd tests/stream-on-runtime
          uv sync --frozen
          .venv/bin/pytest -v -m "not requires_gpu"

      # A failed job ends the run: the rest of it cannot make this change
      # mergeable, so it stops spending runners.
      - name: Cancel the rest of the run
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" || true

  # A red nightly opens one issue naming its run, or comments on the one still
  # open, since a failed scheduled run otherwise notifies only whoever last
  # edited the cron line.
  report-failed-nightly-integration:
    name: Report a failed nightly integration run
    needs: [integration-test-linux, integration-test-macos]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          FAILED_NIGHTLY_ISSUE_TITLE: Nightly integration run failed
          LINUX_RESULT: ${{ needs.integration-test-linux.result }}
          MACOS_RESULT: ${{ needs.integration-test-macos.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="$(printf 'The nightly run on `%s` failed: %s\n\n- Integration test (Linux): %s\n- Integration test (macOS): %s\n' \
            "$GITHUB_SHA" "$RUN_URL" "$LINUX_RESULT" "$MACOS_RESULT")"
          open_issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"$FAILED_NIGHTLY_ISSUE_TITLE\"" --json number,title \
            -q "map(select(.title == \"$FAILED_NIGHTLY_ISSUE_TITLE\")) | .[0].number // empty")"
          if [ -n "$open_issue" ]; then
            gh issue comment "$open_issue" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$FAILED_NIGHTLY_ISSUE_TITLE" \
              --label bug --body "$body"
          fi
