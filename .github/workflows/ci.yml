name: CI

# The one workflow a change is validated by: on every pull request, on every
# push to `main` and on a merge-queue group. It proves the change is safe to
# merge and builds nothing it would ship — the distributions are built and
# checked on `main` by distribution-dry-run.yml and published by release.yml.
#
# The graph:
#
#   changes ─┬─ repo gates, source gates                 (always)
#            ├─ Python, no build; stream suite           (Python surfaces)
#            ├─ Linux lint; Linux Rust tests             (Rust)
#            ├─ Rust Build (macOS)                       (Rust)
#            ├─ Linux runtime unit ─┬─ wheel Python suite
#            │                      ├─ integration suite
#            │                      └─ extension (Linux)
#            ├─ macOS runtime unit ─── extension (macOS)
#            └─ installer
#   CI ← every job above: the one check a merge needs.
#
# `changes` reads the paths a pull request touches and each heavy job runs only
# when a lane it serves is selected (`scripts/ci/classify_changed_paths.py`).
# Each artifact is built once and every job that needs it downloads it. A
# runtime unit is restored from the cache when nothing it is built from
# changed, so a change to an extension or a suite runs on the unit `main`
# built. A push to `main` runs every lane and saves the caches pull requests
# restore from: Actions caches are ref-scoped, so a pull request's save would
# be readable by no other pull request and would evict `main`'s.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job compiles or runs pull-request-authored code, so the token reads and
# does nothing else.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A runner never rebuilds after an edit.
  CARGO_INCREMENTAL: 0
  # Line tables keep a panic's file and line and drop the rest of the debug
  # info, which is most of a debug build's link time and cache size.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  RUST_BACKTRACE: 1
  NEXTEST_VERSION: 0.9.148
  # The runtime unit's cache entries. Bump to drop every unit cached so far.
  RUNTIME_UNIT_CACHE_GENERATION: 1

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      runtime_unit: ${{ steps.classify.outputs.runtime_unit }}
      python_wheel: ${{ steps.classify.outputs.python_wheel }}
      integration: ${{ steps.classify.outputs.integration }}
      extension_webrtc: ${{ steps.classify.outputs.extension_webrtc }}
      stream_package: ${{ steps.classify.outputs.stream_package }}
      python_types: ${{ steps.classify.outputs.python_types }}
      installer: ${{ steps.classify.outputs.installer }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # A pull request checks out its merge commit, whose first parent is
          # the base it merges into: the diff between the two is the change.
          fetch-depth: 2

      # `--no-renames`, so a moved file names the tree it left as well as the
      # one it joined.
      - name: Paths this pull request changes
        if: github.event_name == 'pull_request'
        run: |
          git diff --no-renames --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed-paths.txt"
          cat "$RUNNER_TEMP/changed-paths.txt"

      - name: Lanes this change needs
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            python3 scripts/ci/classify_changed_paths.py --event-name "$EVENT_NAME" \
              --changed-paths-file "$RUNNER_TEMP/changed-paths.txt"
          else
            python3 scripts/ci/classify_changed_paths.py --event-name "$EVENT_NAME"
          fi

  # Bash, git, Python and jq only: no toolchain, seconds.
  repo-gates:
    name: Repo gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: License headers (Rust + Python)
        run: bash scripts/check-license-headers.sh

      # The exemption list is the half of the header gate that fails silently:
      # a pathspec that stops covering first-party code goes green.
      - name: license-header-gate tests
        run: bash .claude/scripts/tests/license-header-gate.test.sh

      # Only the gate's own tests: an active change file legitimately fails the
      # gate until its removals happen.
      - name: ship-change-removed-gate tests
        run: bash .claude/scripts/tests/ship-change-removed-gate.test.sh

      - name: rig-brake tests
        run: bash .claude/scripts/tests/rig-brake.test.sh

      - name: CI lane selection tests
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v

      # Every workflow is linted on every change, including the distribution
      # workflows no pull request runs.
      - name: actionlint
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  # Every source-walking gate in one process, plus rustfmt and the licence
  # allowlist. No path filter: these gates scan `docs/` and Markdown as well as
  # source, so a docs-only change is exactly when some of them earn their keep.
  source-gates:
    name: Source gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install the Rust toolchain rust-toolchain.toml pins
        run: rustup toolchain install

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: xtask
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo fmt --all --check
        run: cargo fmt --all --check

      - name: cargo xtask check-all-source-gates
        run: cargo run --locked -q -p xtask -- check-all-source-gates

      - name: cargo test -p xtask (all gate fixture tests)
        run: cargo test --locked -p xtask

      # Version-pinned, so a cargo-deny release that tightens a default cannot
      # red an unrelated change; `cargo xtask run-local-ci-gates` runs the same
      # command against the same `deny.toml`.
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2

      # `-D license-not-encountered` fails an allowance whose last user left
      # the graph; `--locked` stops cargo-deny rewriting `Cargo.lock` and
      # reporting on the rewrite.
      - name: cargo deny check licenses
        run: cargo deny --locked --workspace check licenses -D license-not-encountered

  # Pyright reads the checked-in `_engine.pyi` rather than the compiled module,
  # so this needs no build. It is the check an author's editor runs too.
  python-types:
    name: Python, no build
    needs: changes
    if: needs.changes.outputs.python_types == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # CPU torch: the exchange tests type-check against torch's API.
      - name: Prepare the environment pyright resolves against
        working-directory: sdk/streamlib-python-wheel
        run: |
          uv venv --python 3.12 .venv
          VIRTUAL_ENV="$PWD/.venv" uv pip install pytest numpy pydantic typing_extensions
          VIRTUAL_ENV="$PWD/.venv" uv pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Type-check the wheel's Python surface
        working-directory: sdk/streamlib-python-wheel
        run: uvx pyright@1.1.411

      - name: Release configuration tests
        working-directory: scripts
        run: python3 -m unittest test_release_configuration

      # The loopback itself needs a PipeWire session and stays on the rig; the
      # negative controls prove its analysis can go red.
      - name: Audio loopback fixture negative controls
        working-directory: runtime/streamlib-engine/tests/fixtures
        run: >-
          "$GITHUB_WORKSPACE/sdk/streamlib-python-wheel/.venv/bin/python"
          -m unittest test_known_audio_signal

  # The venv holds `tatolab-stream`, its test group and nothing of the runtime,
  # so a stream test that reaches for the runtime fails to import. 3.10 is the
  # floor `requires-python` promises.
  stream-suite:
    name: Stream suite (${{ matrix.runner }}, Python ${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.stream_package == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-15]
        python: ["3.12"]
        include:
          - runner: ubuntu-latest
            python: "3.10"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # Built and installed, not editable, so the suite imports what the wheel
      # ships rather than the checkout beside it.
      - name: Install tatolab-stream and its test group, and nothing of the runtime
        working-directory: sdk/tatolab-stream
        run: |
          uv venv --python ${{ matrix.python }} .venv
          VIRTUAL_ENV="$PWD/.venv" uv pip install . --group test

      # The console script, not `python -m pytest`, which would put the
      # checkout's `tatolab/` ahead of the installed one on the path.
      - name: The stream suite
        working-directory: sdk/tatolab-stream
        run: .venv/bin/pytest tests -v

      - name: Type-check the stream package and its suite
        working-directory: sdk/tatolab-stream
        run: uvx pyright@1.1.411

      - name: The scaffold compiles and type-checks with no runtime installed
        run: |
          cp -R sdk/tatolab-stream/scaffold_template "$RUNNER_TEMP/scaffold"
          uv build --wheel --out-dir "$RUNNER_TEMP/tatolab-stream-dist" sdk/tatolab-stream
          uv venv --python ${{ matrix.python }} "$RUNNER_TEMP/scaffold-venv"
          VIRTUAL_ENV="$RUNNER_TEMP/scaffold-venv" uv pip install "$RUNNER_TEMP"/tatolab-stream-dist/*.whl 'numpy>=2.1'
          cd "$RUNNER_TEMP/scaffold"
          "$RUNNER_TEMP/scaffold-venv/bin/python" - <<'EOF'
          import importlib.util
          import json
          import sys

          import stream
          from tatolab.stream import compile_stream_to_graph

          assert importlib.util.find_spec("tatolab.runtime") is None, "a runtime is installed"
          graph = compile_stream_to_graph(stream.main)
          runtime_modules_loaded = [name for name in sys.modules if name.startswith("tatolab.runtime")]
          assert runtime_modules_loaded == [], runtime_modules_loaded
          print(json.dumps([node["type"] for node in graph["nodes"]]))
          EOF
          uvx pyright@1.1.411 --pythonpath "$RUNNER_TEMP/scaffold-venv/bin/python" .

  # Check-mode work, beside the test build rather than in front of it.
  linux-lint:
    name: Linux lint
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The engine's build script compiles GLSL with glslc, the Linux engine
      # links Vulkan and iceoryx2's PAL crates run bindgen. cmake builds the
      # vendored shaderc; ninja is what makes that a minute rather than
      # several. `timeout-minutes` is the backstop the composite action cannot
      # declare itself; `check-bounded-apt-install` fails a call without one.
      - name: Install system dependencies
        timeout-minutes: 12
        uses: ./.github/actions/install-linux-engine-build-dependencies
        with:
          packages: >-
            pkg-config
            protobuf-compiler
            libclang1-18
            libclang-common-18-dev
            libvulkan-dev
            glslc
            cmake
            ninja-build

      - name: Install the Rust toolchain rust-toolchain.toml pins
        run: rustup toolchain install

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-lint
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Default targets only: a test's `println!` is a test's business, as
      # `xtask lint-logging` exempts `tests` directories. Skia is excluded on
      # Linux: `skia-bindings` has no prebuilt here and needs FreeType to build
      # from source; the macOS lane lints its Vulkan arm.
      - name: cargo clippy (workspace, default targets)
        run: cargo clippy --locked --workspace --exclude streamlib-adapter-skia --no-deps

      # `tatolab.stream`'s built-in classes are generated from the built-ins'
      # descriptors; Linux compiles in every built-in.
      - name: Generated built-in node classes match the runtime's built-ins
        run: cargo run --locked -q -p xtask -- generate-built-in-node-classes --check

  # One test build: every test target of these packages is compiled once and
  # `.config/nextest.toml`'s `ci` profile picks the tests that run on a runner
  # with no GPU, camera, display or audio device. The compiled-but-not-run
  # targets are the rig's suites, built here so they cannot rot between rig
  # runs.
  linux-rust-tests:
    name: Linux Rust tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # `python3-dev`: the wheel crate's unit tests link libpython rather than
      # building as an extension module.
      - name: Install system dependencies
        timeout-minutes: 12
        uses: ./.github/actions/install-linux-engine-build-dependencies
        with:
          packages: >-
            pkg-config
            protobuf-compiler
            libclang1-18
            libclang-common-18-dev
            libvulkan-dev
            glslc
            python3-dev
            cmake
            ninja-build

      - name: Install the Rust toolchain rust-toolchain.toml pins
        run: rustup toolchain install

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-rust-tests
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The engine-owned codec round-trip rig is an example, not a test
      # target; naming it here compiles it in the same build.
      - name: Unit and integration tests (deviceless)
        run: >-
          cargo nextest run --locked --profile ci
          -p streamlib -p streamlib-macros -p streamlib-processor-schema
          -p streamlib-ipc-types -p streamlib-surface-client -p streamlib-error
          -p streamlib-runtime-client-contract -p streamlib-engine
          -p streamlib-media-builtins -p streamlib-consumer-rhi -p tatolab-cli
          -p streamlib-python-wheel
          --lib --bins --tests --example codec_roundtrip_rig

      # The same crates as a test build sees them: the runtime directory, the
      # state directory and the machine runtime lock moved under each test's
      # TATOLAB_TEST_MACHINE_ROOT. One build serves both runs; the control
      # plane's fixed-socket test binds under this run's own short root.
      - name: Tests under a test machine root
        env:
          MACHINE_DIRECTORIES_UNDER_A_TEST_ROOT_SELECTION: >-
            -p streamlib-runtime-client-contract -p streamlib-api-server -p tatolabd -p tatolab-cli
            --features streamlib-runtime-client-contract/machine-directories-under-a-test-root
            --features streamlib-api-server/machine-directories-under-a-test-root
            --features tatolabd/machine-directories-under-a-test-root
            --features tatolab-cli/machine-directories-under-a-test-root
        run: |
          # shellcheck disable=SC2086
          cargo nextest run --locked --profile ci-machine-directories-under-a-test-root \
            $MACHINE_DIRECTORIES_UNDER_A_TEST_ROOT_SELECTION \
            -E 'not package(streamlib-api-server)'
          test_machine_root="$(mktemp -d /tmp/tl-XXXXXX)"
          # shellcheck disable=SC2086
          TATOLAB_TEST_MACHINE_ROOT="$test_machine_root" \
            cargo nextest run --locked --profile ci-machine-directories-under-a-test-root \
            $MACHINE_DIRECTORIES_UNDER_A_TEST_ROOT_SELECTION \
            -E 'package(streamlib-api-server)'

  # The runtime unit — `tatolabd`, `tatolab`, and the lend a processor
  # interpreter borrows `tatolab.runtime` from — built once, in debug, in its
  # two forms: as users run it, and with the machine directories under a test
  # root, which the integration suite requires. Restored from the cache when
  # nothing it is built from changed.
  linux-runtime-unit:
    name: Linux runtime unit
    needs: changes
    if: needs.changes.outputs.runtime_unit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install the Rust toolchain rust-toolchain.toml pins
        run: rustup toolchain install

      - name: Digest of everything the unit is built from
        id: digest
        run: echo "digest=$(bash scripts/ci/runtime_unit_input_digest.sh "$ImageOS" debug)" >> "$GITHUB_OUTPUT"

      - name: Restore the unit
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/tatolab-runtime-unit.tar.gz
            ${{ runner.temp }}/tatolab-runtime-unit-under-a-test-root.tar.gz
          key: runtime-unit-linux-${{ env.RUNTIME_UNIT_CACHE_GENERATION }}-${{ steps.digest.outputs.digest }}

      - name: Install system dependencies
        if: steps.restore.outputs.cache-hit != 'true'
        timeout-minutes: 12
        uses: ./.github/actions/install-linux-engine-build-dependencies
        with:
          packages: >-
            pkg-config
            protobuf-compiler
            libclang1-18
            libclang-common-18-dev
            libvulkan-dev
            glslc
            cmake
            ninja-build

      - name: Cache Rust dependencies
        if: steps.restore.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-runtime-unit
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install uv
        if: steps.restore.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@v5

      # The bundled lavapipe takes minutes to build in manylinux; the staging
      # script reuses a build whose key matches, and these three files are the
      # key.
      - name: Cache the Linux bundled Vulkan driver build
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: target/linux_bundled_vulkan_driver_cache
          key: linux-bundled-vulkan-driver-${{ hashFiles('scripts/stage_linux_bundled_vulkan_driver.sh', 'scripts/manylinux_2_28_image.sh', 'scripts/stage_macos_bundled_vulkan_driver.sh') }}

      # It refuses a wheel carrying anything beside `tatolab/runtime/` and its
      # `.dist-info`, and a lend missing a driver file. Tarred, because an
      # artifact keeps no file modes and `bin/` must stay executable.
      - name: Build the runtime unit
        if: steps.restore.outputs.cache-hit != 'true'
        run: |
          cargo xtask build-runtime
          tar -C target/tatolab-runtime -czf "$RUNNER_TEMP/tatolab-runtime-unit.tar.gz" bin lib wheel

      # Replaces the unit above in place, so it is built after that one is
      # packed. The marker file at its root is what the suite checks for.
      - name: Build the runtime unit under a test root
        if: steps.restore.outputs.cache-hit != 'true'
        run: |
          cargo xtask build-runtime --machine-directories-under-a-test-root
          tar -C target/tatolab-runtime -czf "$RUNNER_TEMP/tatolab-runtime-unit-under-a-test-root.tar.gz" \
            bin lib machine-directories-under-a-test-root

      - name: Save the unit
        if: steps.restore.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/tatolab-runtime-unit.tar.gz
            ${{ runner.temp }}/tatolab-runtime-unit-under-a-test-root.tar.gz
          key: ${{ steps.restore.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v4
        with:
          name: tatolab-runtime-unit-linux
          path: ${{ runner.temp }}/tatolab-runtime-unit.tar.gz
          retention-days: 1
          if-no-files-found: error
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: tatolab-runtime-unit-linux-machine-directories-under-a-test-root
          path: ${{ runner.temp }}/tatolab-runtime-unit-under-a-test-root.tar.gz
          retention-days: 1
          if-no-files-found: error
          compression-level: 0

  # The wheel's own suite on the unit's lend: the casts and the bag codec, a
  # processor interpreter's bootstrap and helper process, and the conformance
  # gate that holds the binary to `tatolab.stream`'s Protocols.
  linux-wheel-python-suite:
    name: Wheel Python suite (Linux)
    needs: [changes, linux-runtime-unit]
    if: needs.changes.outputs.python_wheel == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - uses: actions/download-artifact@v4
        with:
          name: tatolab-runtime-unit-linux
          path: ${{ runner.temp }}/tatolab-runtime-unit

      - name: Unpack the runtime unit
        run: |
          mkdir -p target/tatolab-runtime
          tar -C target/tatolab-runtime -xzf "$RUNNER_TEMP/tatolab-runtime-unit/tatolab-runtime-unit.tar.gz"

      # The unit's own wheel, not a second build of it. numpy rides along
      # because the exchange-surface tests import it at module scope; pydantic
      # proves a model is a legal `read(port, into=T)` target.
      - name: A venv holding the unit's wheel and the stream package
        working-directory: sdk/streamlib-python-wheel
        run: |
          uv venv --python 3.12 .venv
          VIRTUAL_ENV="$PWD/.venv" uv pip install pytest mypy numpy pydantic typing_extensions
          VIRTUAL_ENV="$PWD/.venv" uv pip install -e ../tatolab-stream
          VIRTUAL_ENV="$PWD/.venv" uv pip install "$GITHUB_WORKSPACE"/target/tatolab-runtime/wheel/*.whl

      # stubtest compares the hand-written `_engine.pyi` to the binary, skipping
      # the names the conformance gate holds to `tatolab.stream`.
      - name: Type stubs match the compiled module
        working-directory: sdk/streamlib-python-wheel
        run: |
          .venv/bin/python tests/runtime_backed_protocol_conformance.py --print-stubtest-allowlist > "$RUNNER_TEMP/engine-stubtest-allowlist.txt"
          .venv/bin/python -m mypy.stubtest tatolab.runtime._engine --allowlist "$RUNNER_TEMP/engine-stubtest-allowlist.txt"

      - name: Wheel suite (GPU-free half)
        working-directory: sdk/streamlib-python-wheel
        run: .venv/bin/python -m pytest tests/ -v -m "not requires_gpu"

      # The tap controls decode transport-framed bags through the wheel's own
      # decoder.
      - name: Audio channel tap controls
        working-directory: runtime/streamlib-engine/tests/fixtures
        run: >-
          "$GITHUB_WORKSPACE/sdk/streamlib-python-wheel/.venv/bin/python"
          -m unittest test_tap_audio_channel

      # From a venv holding `tatolab-stream` and pytest and nothing of the
      # runtime: the lend is the only `tatolab.runtime` on the path, and the
      # tests fail if they imported one from anywhere else.
      - name: Driver-search tests against the lend
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/tatolab-stream-dist" sdk/tatolab-stream
          uv venv --python 3.12 "$RUNNER_TEMP/lend-check-venv"
          VIRTUAL_ENV="$RUNNER_TEMP/lend-check-venv" uv pip install "$RUNNER_TEMP"/tatolab-stream-dist/*.whl pytest
          cd sdk/streamlib-python-wheel
          PYTHONPATH="$GITHUB_WORKSPACE/target/tatolab-runtime/lib/tatolab/lend" \
            "$RUNNER_TEMP/lend-check-venv/bin/python" -m pytest -v \
            tests_against_the_runtime_unit_lend/

  # One `tatolabd` per test from the test-root unit, each fixture stream loaded
  # with `tatolab run` and driven over its local API. The runner has no GPU and
  # no Vulkan driver: every stream starts on the lavapipe the unit's lend
  # carries. What a runner cannot give at all stays on the rig, as
  # `rig_only_capability`.
  linux-integration-suite:
    name: Integration suite (stream on runtime, bundled software device)
    needs: [changes, linux-runtime-unit]
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - uses: actions/download-artifact@v4
        with:
          name: tatolab-runtime-unit-linux-machine-directories-under-a-test-root
          path: ${{ runner.temp }}/tatolab-runtime-unit

      - name: Unpack the runtime unit
        run: |
          mkdir -p target/tatolab-runtime
          tar -C target/tatolab-runtime -xzf "$RUNNER_TEMP/tatolab-runtime-unit/tatolab-runtime-unit-under-a-test-root.tar.gz"

      # --frozen: registry packages stay hash-pinned; the editable
      # tatolab-stream's locked version is never read.
      - name: The suite's venv, from its lockfile
        working-directory: tests/stream-on-runtime
        run: uv sync --frozen

      - name: Integration suite (all but rig-only)
        working-directory: tests/stream-on-runtime
        run: .venv/bin/pytest -v -m "not rig_only_capability"

  # A stream's venv exactly as a third party's holds the extension:
  # `tatolab-stream` and the extension, and no engine. An extension links no
  # engine crate, so nothing here needs Vulkan, glslc or the engine's build set.
  linux-extension:
    name: Extension (${{ matrix.extension }}, Linux)
    needs: [changes, linux-runtime-unit]
    if: needs.changes.outputs.extension_webrtc == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - extension: streamlib-webrtc
            native_module: tatolab.webrtc._native
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # pyo3's `extension-module` is off for `cargo test`, so the crate's unit
      # tests link libpython.
      - name: Install system dependencies
        timeout-minutes: 6
        uses: ./.github/actions/install-linux-engine-build-dependencies
        with:
          packages: python3-dev

      # `aws-lc-sys` needs cmake and a C compiler. The image ships both;
      # asserted so a runner that drops one fails in seconds with a legible
      # reason rather than inside a build script.
      - name: The build tools the extension's native dependencies assume
        run: |
          cmake --version
          cc --version

      - name: Install the Rust toolchain rust-toolchain.toml pins
        run: rustup toolchain install

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: extension-${{ matrix.extension }}
          workspaces: packages/${{ matrix.extension }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - uses: actions/download-artifact@v4
        with:
          name: tatolab-runtime-unit-linux
          path: ${{ runner.temp }}/tatolab-runtime-unit

      # Where the extension's tests look for it by default: they start its
      # `tatolabd`, and the helper-side tests borrow `tatolab.runtime` from its
      # lend.
      - name: Unpack the runtime unit
        run: |
          mkdir -p target/tatolab-runtime
          tar -C target/tatolab-runtime -xzf "$RUNNER_TEMP/tatolab-runtime-unit/tatolab-runtime-unit.tar.gz"

      - name: Build the extension into a venv holding tatolab-stream
        working-directory: packages/${{ matrix.extension }}
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/tatolab-stream-dist" "$GITHUB_WORKSPACE/sdk/tatolab-stream"
          uv venv --python 3.12 .venv
          VIRTUAL_ENV="$PWD/.venv" uv pip install pytest mypy typing_extensions
          VIRTUAL_ENV="$PWD/.venv" uv pip install "$RUNNER_TEMP"/tatolab-stream-dist/*.whl
          VIRTUAL_ENV="$PWD/.venv" uvx maturin@1.9.6 develop

      # The repo-root `cargo fmt --all` does not reach a non-member.
      - name: Formatting
        working-directory: packages/${{ matrix.extension }}
        run: cargo fmt --all --check

      # Before the venv is on PATH, so pyo3 resolves the system interpreter
      # whose headers the apt step installed.
      - name: Extension crate tests
        working-directory: packages/${{ matrix.extension }}
        run: cargo test --locked --lib

      - name: Clippy
        working-directory: packages/${{ matrix.extension }}
        run: cargo clippy --locked --lib --all-targets -- -D warnings

      - name: Type stubs match the compiled module
        working-directory: packages/${{ matrix.extension }}
        run: .venv/bin/python -m mypy.stubtest ${{ matrix.native_module }}

      - name: Type-check the extension's Python surface
        working-directory: packages/${{ matrix.extension }}
        run: uvx pyright@1.1.411

      # Carries the portability gate over the built `.so`. The tests that
      # import `tatolab.runtime` borrow it from the lend, as a processor
      # interpreter does.
      - name: Extension tests, GPU-free
        working-directory: packages/${{ matrix.extension }}
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/target/tatolab-runtime/lib/tatolab/lend" \
            .venv/bin/python -m pytest tests/ -v -m "not requires_gpu"

  # The Apple path on every change that can break it: macOS is a supported
  # floor, and an Apple-path change merges only with this lane green.
  # `macos-15`, not `macos-latest`: the image decides the SDK the Apple
  # frameworks link against. The runner exposes a paravirtual Metal device;
  # GPU work runs last and narrow, through MoltenVK.
  macos-rust:
    name: Rust Build (macOS)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # `glslc` stages the engine's SPIR-V; cmake and ninja build the shaderc
      # crate.
      - name: Install glslc and the shaderc crate's build tools
        run: brew install shaderc cmake ninja

      - name: Install the Rust toolchain rust-toolchain.toml pins
        run: rustup toolchain install

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The Python the wheel crate's unit tests link.
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Every workspace member compiles here, Skia included: without its
      # Linux-only `gl` feature rust-skia publishes the prebuilt this target
      # names.
      - name: cargo clippy (workspace, default targets)
        run: cargo clippy --locked --workspace --no-deps

      # The test, bench and example targets are where a macOS-only compile
      # break would otherwise hide.
      - name: cargo check (workspace, all targets)
        run: cargo check --locked --workspace --all-targets

      - name: Run unit tests
        run: |
          cargo test --locked -p streamlib -p streamlib-macros \
            -p streamlib-processor-schema -p streamlib-ipc-types \
            -p streamlib-error --lib
          # The machine runtime lock's fcntl takes, refusals and probes run here
          # and nowhere else.
          cargo test --locked -p streamlib-runtime-client-contract
          cargo test --locked -p streamlib-runtime-client-contract \
            --features machine-directories-under-a-test-root
          cargo test --locked -p streamlib-engine --test attribute_macro_test
          cargo test --locked -p streamlib-media-builtins --lib
          # Where a golden names a built-in macOS compiles out, the load is
          # refused naming the floor and the rest of it loads.
          cargo test --locked -p streamlib-media-builtins --test every_golden_graph_loads
          cargo test --locked -p streamlib-consumer-rhi --lib
          TATOLAB_TEST_MACHINE_ROOT="$(mktemp -d /tmp/tl-XXXXXX)" \
            cargo test --locked -p streamlib-api-server --lib \
            --features machine-directories-under-a-test-root
          cargo test --locked -p tatolabd --features machine-directories-under-a-test-root
          # The runtime directory is fixed under /tmp on macOS, so the CLI's
          # tests need the feature to isolate each test's machine.
          cargo test --locked -p tatolab-cli \
            --features machine-directories-under-a-test-root
          # `--test-threads=1`: two of these open iceoryx2 nodes in child
          # processes of this same binary and race each other in parallel.
          cargo test --locked -p streamlib-engine --lib -- --test-threads=1
          # The surface-share service's raw-Mach arm. IOSurface and Mach need
          # no GPU.
          cargo test --locked -p streamlib-surface-client
          cargo test --locked -p streamlib-engine --test surface_share_over_raw_mach
          # Compiled but not run: the AVFoundation, VideoToolbox and CoreAudio
          # arms need a camera, a microphone, their access grants, a media
          # engine and a GPU no runner has.
          cargo test --locked -p streamlib-engine -p streamlib-media-builtins \
            --features streamlib-engine/hardware-tests,streamlib-media-builtins/hardware-tests \
            --lib \
            --test avfoundation_camera_captures_through_the_video_device_seam \
            --test videotoolbox_arm_round_trips_the_psnr_references \
            --test camera_to_display_window_on_the_macos_window_server \
            --test coreaudio_arm_stamps_blocks_with_the_devices_own_timing \
            --test coreaudio_arm_plays_what_it_is_given \
            --test coreaudio_arm_hears_the_room_through_the_built_in_microphone \
            --test coreaudio_arm_hears_what_it_plays \
            --test coreaudio_arm_hears_its_own_playback_through_a_muted_process_tap --no-run

      # The source-walking gates evaluate `cfg` for macOS as well as Linux, so
      # `apple/` is linted here.
      - name: cargo xtask lint-logging
        run: cargo run --locked -q -p xtask -- lint-logging

      - name: cargo xtask check-no-inheritable-descriptor
        run: cargo run --locked -q -p xtask -- check-no-inheritable-descriptor

      # `--test-threads=1`: every test embeds the same interpreter and takes the
      # same GIL.
      - name: Wheel crate unit tests
        run: cargo test --locked -p streamlib-python-wheel --lib -- --test-threads=1

      - name: Install MoltenVK and find the Metal device under it
        run: |
          system_profiler SPDisplaysDataType
          brew install molten-vk vulkan-loader vulkan-tools
          vulkaninfo --summary

      # A fixture that cannot bring up its device or Skia context prints a
      # skip line and returns, which the harness counts as a pass — so any
      # skip line fails the step. The one allowed is the validation-layer
      # test's, which needs `VK_LAYER_KHRONOS_validation` this runner lacks.
      - name: In-process adapter tests
        run: |
          set -o pipefail
          cargo test --locked -p streamlib-adapter-vulkan \
            -p streamlib-adapter-cpu-readback -p streamlib-adapter-skia \
            -- --nocapture 2>&1 | tee adapter-test-output.txt
          if grep -i "skip" adapter-test-output.txt \
              | grep -v "no validation messenger installed"; then
            echo "::error::an in-process adapter test skipped instead of running on the Metal device"
            exit 1
          fi

      # The frame-allocation budget's macOS arms, which need the MoltenVK
      # device and run on no other lane. The packages and features match the
      # `--no-run` build above, which this reuses. A skip passes without
      # running, so any skip line fails the step, and only the engine binary's
      # own result line with all four tests passed passes it.
      - name: Frame-allocation budget on the Metal device
        run: |
          set -o pipefail
          CARGO_TERM_COLOR=never cargo test --locked -p streamlib-engine -p streamlib-media-builtins \
            --features streamlib-engine/hardware-tests,streamlib-media-builtins/hardware-tests \
            --lib -- --color never --test-threads=1 --nocapture \
            vulkan::rhi::vulkan_metal_working_set_budget::tests::an_iosurface_backed_vulkan_image_is_counted_once_in_the_metal_working_set_usage \
            vulkan::rhi::vulkan_metal_working_set_budget::tests::an_iosurface_backed_pixel_buffer_is_counted_once_in_the_metal_working_set_usage \
            vulkan::rhi::vulkan_device::tests::a_frame_texture_past_a_budget_with_no_room_left_is_refused_while_an_engine_buffer_still_allocates \
            core::compiler::compiler_ops::subprocess_escalate::handle_lifecycle::tests::releasing_a_one_off_pixel_buffer_evicts_its_lookup_and_leaves_its_slots_published_frame_cached \
            2>&1 | tee frame-allocation-budget-on-metal-output.txt
          if grep -i "skip" frame-allocation-budget-on-metal-output.txt; then
            echo "::error::a frame-allocation budget test skipped instead of running on the Metal device"
            exit 1
          fi
          sed -n '/Running unittests .*streamlib_engine-/,/^test result:/p' \
            frame-allocation-budget-on-metal-output.txt \
            | grep "^test result: ok. 4 passed;"

  # The aarch64-apple-darwin runtime unit, in debug, and every test that runs
  # on it: the wheel's stub and Python suite on this binary, a scaffolded
  # stream on the Vulkan driver the lend carries, and the integration suite's
  # GPU-free half. A stock Mac has no Vulkan driver and neither does the runner
  # image, so a stream that runs here ran on the MoltenVK inside the lend.
  macos-runtime-unit:
    name: macOS runtime unit
    needs: changes
    if: needs.changes.outputs.runtime_unit == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install the Rust toolchain rust-toolchain.toml pins
        run: rustup toolchain install

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Digest of everything the unit is built from
        id: digest
        run: echo "digest=$(bash scripts/ci/runtime_unit_input_digest.sh "$ImageOS" debug)" >> "$GITHUB_OUTPUT"

      - name: Restore the unit
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/tatolab-runtime-unit.tar.gz
            ${{ runner.temp }}/tatolab-runtime-unit-under-a-test-root.tar.gz
          key: runtime-unit-macos-${{ env.RUNTIME_UNIT_CACHE_GENERATION }}-${{ steps.digest.outputs.digest }}

      - name: Install glslc and the C++ build tools
        if: steps.restore.outputs.cache-hit != 'true'
        run: brew install shaderc cmake ninja

      - name: Cache Rust dependencies
        if: steps.restore.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-runtime-unit
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the runtime unit
        if: steps.restore.outputs.cache-hit != 'true'
        run: |
          cargo xtask build-runtime
          tar -C target/tatolab-runtime -czf "$RUNNER_TEMP/tatolab-runtime-unit.tar.gz" bin lib wheel

      - name: Build the runtime unit under a test root
        if: steps.restore.outputs.cache-hit != 'true'
        run: |
          cargo xtask build-runtime --machine-directories-under-a-test-root
          tar -C target/tatolab-runtime -czf "$RUNNER_TEMP/tatolab-runtime-unit-under-a-test-root.tar.gz" \
            bin lib machine-directories-under-a-test-root

      - name: Save the unit
        if: steps.restore.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/tatolab-runtime-unit.tar.gz
            ${{ runner.temp }}/tatolab-runtime-unit-under-a-test-root.tar.gz
          key: ${{ steps.restore.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v4
        with:
          name: tatolab-runtime-unit-macos
          path: ${{ runner.temp }}/tatolab-runtime-unit.tar.gz
          retention-days: 1
          if-no-files-found: error
          compression-level: 0

      - name: Unpack the runtime unit
        run: |
          rm -rf target/tatolab-runtime
          mkdir -p target/tatolab-runtime
          tar -C target/tatolab-runtime -xzf "$RUNNER_TEMP/tatolab-runtime-unit.tar.gz"

      # The machine lock is the root-owned file Tatolab.app creates at first
      # launch; a runner has no app.
      - name: The machine runtime lock the app would create
        run: |
          machine_runtime_lock_directory="/Library/Application Support/Tatolab"
          sudo mkdir -p "$machine_runtime_lock_directory"
          sudo touch "$machine_runtime_lock_directory/runtime.lock"
          sudo chown root "$machine_runtime_lock_directory" "$machine_runtime_lock_directory/runtime.lock"
          sudo chmod 0755 "$machine_runtime_lock_directory"
          sudo chmod 0666 "$machine_runtime_lock_directory/runtime.lock"

      # One `_engine.pyi` and one set of `tatolab.stream` Protocols for both
      # binaries. A test absent on macOS carries `linux_only_capability` or
      # `awaiting_macos_parity`, which the stream suite holds to their lists.
      - name: Wheel stub and Python suite (GPU-free half)
        if: needs.changes.outputs.python_wheel == 'true'
        working-directory: sdk/streamlib-python-wheel
        run: |
          uv venv --python 3.12 .venv
          VIRTUAL_ENV="$PWD/.venv" uv pip install pytest mypy numpy pydantic typing_extensions
          VIRTUAL_ENV="$PWD/.venv" uv pip install -e ../tatolab-stream
          VIRTUAL_ENV="$PWD/.venv" uv pip install "$GITHUB_WORKSPACE"/target/tatolab-runtime/wheel/*.whl
          .venv/bin/python tests/runtime_backed_protocol_conformance.py --print-stubtest-allowlist > "$RUNNER_TEMP/engine-stubtest-allowlist.txt"
          .venv/bin/python -m mypy.stubtest tatolab.runtime._engine --allowlist "$RUNNER_TEMP/engine-stubtest-allowlist.txt"
          .venv/bin/python -m pytest tests/ -v -m "not requires_gpu"

      # `tatolab new`'s test-pattern variant through the Python effect into a
      # window, run attached on the machine's `tatolabd`. The project's venv
      # holds what a user's `uv sync` gives it and no runtime. `tatolabd`
      # mirrors every record a stream emits on its standard error, so the
      # evidence is read from its log.
      - name: The scaffolded stream runs on the driver the lend carries
        if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.stream_package == 'true'
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/tatolab-stream-dist" sdk/tatolab-stream
          tatolabd_executable="$GITHUB_WORKSPACE/target/tatolab-runtime/bin/tatolabd"
          tatolab_executable="$GITHUB_WORKSPACE/target/tatolab-runtime/bin/tatolab"

          "$tatolabd_executable" > /tmp/tatolabd.log 2>&1 &
          tatolabd_pid=$!
          trap 'kill -KILL "$tatolabd_pid" 2>/dev/null || true' EXIT
          local_api_deadline=$((SECONDS + 60))
          until "$tatolab_executable" streams > /dev/null 2>&1; do
            if ! kill -0 "$tatolabd_pid" 2>/dev/null; then
              cat /tmp/tatolabd.log
              echo "::error::tatolabd exited before its local API socket answered"
              exit 1
            fi
            if [ "$SECONDS" -ge "$local_api_deadline" ]; then
              cat /tmp/tatolabd.log
              echo "::error::tatolabd's local API socket did not answer within 60s"
              exit 1
            fi
            sleep 1
          done

          "$tatolab_executable" new /tmp/scaffold-check --test-pattern
          python3 -m venv /tmp/scaffold-check/.venv
          /tmp/scaffold-check/.venv/bin/pip install --no-index --find-links "$RUNNER_TEMP/tatolab-stream-dist" tatolab-stream
          /tmp/scaffold-check/.venv/bin/pip install 'numpy>=2.1'
          if /tmp/scaffold-check/.venv/bin/python -c '
          import importlib.util, sys
          sys.exit(0 if importlib.util.find_spec("tatolab.runtime") is not None else 1)
          '; then
            echo "::error::the scaffold's venv can import tatolab.runtime — a stream's venv holds no runtime"
            exit 1
          fi

          # SIGINT a process, failing the step unless it exits 0 within 30s.
          interrupt_and_expect_a_clean_exit() {
            process_name="$1"
            process_pid="$2"
            process_log="$3"
            kill -INT "$process_pid" 2>/dev/null || true
            stop_deadline=$((SECONDS + 30))
            while kill -0 "$process_pid" 2>/dev/null && [ "$SECONDS" -lt "$stop_deadline" ]; do
              sleep 1
            done
            if kill -0 "$process_pid" 2>/dev/null; then
              pkill -KILL -P "$process_pid" || true
              kill -KILL "$process_pid" || true
              cat "$process_log"
              echo "::error::$process_name did not stop within 30s of SIGINT"
              exit 1
            fi
            process_exit_status=0
            wait "$process_pid" || process_exit_status=$?
            if [ "$process_exit_status" -ne 0 ]; then
              cat "$process_log"
              echo "::error::$process_name exited $process_exit_status after SIGINT, not 0"
              exit 1
            fi
          }

          cd /tmp/scaffold-check
          "$tatolab_executable" run > /tmp/scaffold-run.log 2>&1 &
          tatolab_pid=$!
          sleep 20
          interrupt_and_expect_a_clean_exit "tatolab run" "$tatolab_pid" /tmp/scaffold-run.log
          interrupt_and_expect_a_clean_exit tatolabd "$tatolabd_pid" /tmp/tatolabd.log
          trap - EXIT
          echo "::group::tatolab run"
          cat /tmp/scaffold-run.log
          echo "::endgroup::"
          echo "::group::tatolabd"
          cat /tmp/tatolabd.log
          echo "::endgroup::"

          if ! grep -q 'Vulkan loader library opened.*_vulkan_driver/libvulkan.1.dylib' /tmp/tatolabd.log; then
            echo "::error::tatolabd did not open the Vulkan loader the lend carries"
            exit 1
          fi
          if grep -q 'process() failed' /tmp/tatolabd.log; then
            echo "::error::the scaffolded effect raised on a live frame"
            exit 1
          fi
          frames_shown="$(sed -n 's/.*DisplayWindow: stopped (\([0-9]*\) frames).*/\1/p' /tmp/tatolabd.log | tail -1)"
          # Far enough to prove the graph runs end to end, not a frame-rate bar:
          # the runner's GPU is a paravirtual device.
          if [ -z "$frames_shown" ] || [ "$frames_shown" -lt 60 ]; then
            echo "::error::the window showed ${frames_shown:-no} frames in 20s"
            exit 1
          fi
          echo "the window showed $frames_shown frames"

      # The integration suite's GPU-free half on this floor, on the test-root
      # unit, whose `tatolabd` keeps every machine directory under the root
      # the harness names.
      - name: Integration suite (GPU-free half)
        if: needs.changes.outputs.integration == 'true'
        run: |
          rm -rf target/tatolab-runtime
          mkdir -p target/tatolab-runtime
          tar -C target/tatolab-runtime -xzf "$RUNNER_TEMP/tatolab-runtime-unit-under-a-test-root.tar.gz"
          cd tests/stream-on-runtime
          uv sync --frozen
          .venv/bin/pytest -v -m "not requires_gpu"

  # The extension lane on Apple Silicon, against the macOS runtime unit. An
  # extension reads the engine's clock itself, per platform, and on Linux the
  # two candidate clocks agree, so a macOS stamp on the wrong one is visible
  # only here. Formatting and pyright read no platform and stay on Linux.
  macos-extension:
    name: Extension (${{ matrix.extension }}, macOS)
    needs: [changes, macos-runtime-unit]
    if: needs.changes.outputs.extension_webrtc == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - extension: streamlib-webrtc
            native_module: tatolab.webrtc._native
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: The build tools the extension's native dependencies assume
        run: |
          cmake --version
          cc --version

      # The image's own `python3` is not one the abi3-py310 floor accepts.
      - name: Install Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Rust toolchain rust-toolchain.toml pins
        run: rustup toolchain install

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: extension-macos-${{ matrix.extension }}
          workspaces: packages/${{ matrix.extension }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - uses: actions/download-artifact@v4
        with:
          name: tatolab-runtime-unit-macos
          path: ${{ runner.temp }}/tatolab-runtime-unit

      - name: Unpack the runtime unit
        run: |
          mkdir -p target/tatolab-runtime
          tar -C target/tatolab-runtime -xzf "$RUNNER_TEMP/tatolab-runtime-unit/tatolab-runtime-unit.tar.gz"

      - name: Build the extension into a venv holding tatolab-stream
        working-directory: packages/${{ matrix.extension }}
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/tatolab-stream-dist" "$GITHUB_WORKSPACE/sdk/tatolab-stream"
          uv venv --python 3.12 .venv
          VIRTUAL_ENV="$PWD/.venv" uv pip install pytest mypy typing_extensions
          VIRTUAL_ENV="$PWD/.venv" uv pip install "$RUNNER_TEMP"/tatolab-stream-dist/*.whl
          VIRTUAL_ENV="$PWD/.venv" uvx maturin@1.9.6 develop

      - name: Extension crate tests
        working-directory: packages/${{ matrix.extension }}
        env:
          PYO3_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: cargo test --locked --lib

      # The macOS clock is compiled nowhere else.
      - name: Clippy
        working-directory: packages/${{ matrix.extension }}
        env:
          PYO3_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: cargo clippy --locked --lib --all-targets -- -D warnings

      - name: Type stubs match the compiled module
        working-directory: packages/${{ matrix.extension }}
        run: .venv/bin/python -m mypy.stubtest ${{ matrix.native_module }}

      # The tests start the machine's `tatolabd`, which takes the root-owned
      # lock file Tatolab.app creates at first launch; a runner has no app.
      - name: The machine runtime lock the app would create
        run: |
          machine_runtime_lock_directory="/Library/Application Support/Tatolab"
          sudo mkdir -p "$machine_runtime_lock_directory"
          sudo touch "$machine_runtime_lock_directory/runtime.lock"
          sudo chown root "$machine_runtime_lock_directory" "$machine_runtime_lock_directory/runtime.lock"
          sudo chmod 0755 "$machine_runtime_lock_directory"
          sudo chmod 0666 "$machine_runtime_lock_directory/runtime.lock"

      # Carries the clock-parity test against the engine's clock, and the
      # portability gate's Mach-O arm over the built `.so`.
      - name: Extension tests, GPU-free
        working-directory: packages/${{ matrix.extension }}
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/target/tatolab-runtime/lib/tatolab/lend" \
            .venv/bin/python -m pytest tests/ -v -m "not requires_gpu"

  # install.sh against releases its test makes, on a machine booting systemd:
  # install, a kill -9 restarted, an upgrade in place, a download refused on
  # its sha256, macOS pointed at the app, and an uninstall that leaves the
  # state directory.
  installer:
    name: install.sh under a user systemd
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    runs-on: ubuntu-latest
    # The image build is an apt install inside docker, outside the bounded-apt
    # action's reach; this bound stops a slow mirror holding the job.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: shellcheck
        run: shellcheck -s sh installer/install.sh && shellcheck installer/tests/*.sh

      - name: install.sh against a fake release under a user systemd
        run: bash installer/tests/run_install_sh_test_in_a_systemd_container.sh

  # The one check a merge needs: green when every job that ran passed, whatever
  # the change skipped. A skipped job is a lane this change cannot affect; a
  # failed or cancelled one fails this.
  ci-result:
    name: CI
    if: always()
    needs:
      - changes
      - repo-gates
      - source-gates
      - python-types
      - stream-suite
      - linux-lint
      - linux-rust-tests
      - linux-runtime-unit
      - linux-wheel-python-suite
      - linux-integration-suite
      - linux-extension
      - macos-rust
      - macos-runtime-unit
      - macos-extension
      - installer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job that ran passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' | sort
          failed_jobs="$(echo "$NEEDS_JSON" | jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key')"
          if [ -n "$failed_jobs" ]; then
            echo "::error::failed or cancelled: $(echo "$failed_jobs" | tr '\n' ' ')"
            exit 1
          fi
