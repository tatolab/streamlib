name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.tag.outputs.release_created || steps.open.outputs.release_created }}
      tag_name: ${{ steps.tag.outputs.tag_name || steps.open.outputs.tag_name }}
      version: ${{ steps.tag.outputs.major || steps.open.outputs.major }}.${{ steps.tag.outputs.minor || steps.open.outputs.minor }}.${{ steps.tag.outputs.patch || steps.open.outputs.patch }}
      # The extension wheels are separate release-please packages, versioned and
      # tagged on their own cadence. Only the root package `.` gets unprefixed
      # outputs; every other path is prefixed with the path itself, which is why
      # these are read by index rather than by attribute — and why the three
      # above still mean the engine wheel and nothing else. An output that was
      # never set is the empty string, which is how a run that released one
      # project says so about the others.
      streamlib_webrtc_tag_name: ${{ steps.tag.outputs['packages/streamlib-webrtc--tag_name'] || steps.open.outputs['packages/streamlib-webrtc--tag_name'] }}
      streamlib_moq_tag_name: ${{ steps.tag.outputs['packages/streamlib-moq--tag_name'] || steps.open.outputs['packages/streamlib-moq--tag_name'] }}
    steps:
      - uses: actions/checkout@v4

      # Pass 1 — open / refresh the standing release PR (version bump + changelog)
      # for the feat/fix commits landed since the last release.
      - uses: googleapis/release-please-action@v4
        id: open
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # `cargo` resolves the whole workspace before it builds any member, so the
      # pin-sync tool cannot be built once the bump has landed: the resolve it
      # exists to repair is the one that fails. Build it here, while `main` still
      # resolves, and run the binary against the release branch below. `target/`
      # is gitignored, so it survives that checkout.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: xtask
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the version-pin sync tool while main still resolves
        run: cargo build --locked -q -p xtask

      # The `simple` release-type bumps [workspace.package].version in Cargo.toml
      # but ships no cargo dependency-requirement updater. Every in-tree crate
      # pins its workspace-versioned sibling crates with a frozen
      # `version = "X.Y.Z"` requirement (e.g. streamlib-error, vulkan-jpeg). Those
      # requirements never move on their own: caret-compatible within a 0.17.x
      # line but silently EXCLUDING the next breaking bump (0.18.0), which leaves
      # the release branch holding a workspace that cannot resolve at all.
      #
      # This step used to run `cargo update --workspace` alone, which is the half
      # that cannot work: the lockfile cannot be resolved while the manifests
      # exclude their own siblings, so the step exited 101, the auto-merge below
      # never ran, and no tag was cut. That wedged release 0.18.0 shut from
      # 2026-08-11 and starved the PEP 503 index of every wheel since. Moving the
      # pins first is what the comment here always claimed the step did.
      #
      # `cargo xtask check-workspace-version-pins` gates the same rule on every
      # PR, so the pins can only ever drift here, at the bump.
      - name: Sync the version pins and Cargo.lock to the release version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json headRefName,labels \
            --jq 'map(select(.labels[].name == "autorelease: pending")) | .[0].headRefName // empty')
          if [ -z "$BRANCH" ]; then
            echo "no open release PR this run"
            exit 0
          fi
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          ./target/debug/xtask check-workspace-version-pins --fix
          cargo update --workspace
          # An extension wheel is its own workspace with its own lockfile, and a
          # lockfile records its root package's version. release-please bumps
          # each extension's Cargo.toml through `extra-files`, so without this
          # the bump alone leaves that lockfile a version behind and every
          # `--locked` build in the extension's CI lane fails on main. Not an
          # enrolment in `check-workspace-version-pins`, which stays workspace-
          # only by design: this is one lockfile catching up to its own manifest.
          #
          # Discovered by the entry-point group pip records, so a third
          # extension needs no edit here — and so the held pre-pivot packages
          # beside them, which have not resolved since the plugin SDK was
          # deleted, are never handed to cargo.
          for extension_pyproject in packages/*/pyproject.toml; do
            grep -q 'streamlib.extensions' "$extension_pyproject" || continue
            cargo update --workspace \
              --manifest-path "$(dirname "$extension_pyproject")/Cargo.toml"
          done
          if git diff --quiet; then
            echo "version pins and Cargo.lock already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -u -- '*Cargo.lock' '*Cargo.toml'
          git commit -m "chore: sync the version pins and Cargo.lock to the release version"
          git push origin "$BRANCH"

      # A version cut is pure bookkeeping — version + changelog, no code — so it
      # needs no human gate; auto-merge the release PR the moment it exists. The
      # PR is found by release-please's own `autorelease: pending` label rather
      # than an action output, so a freshly-opened PR is caught unambiguously.
      - name: Auto-merge the release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,labels \
            --jq 'map(select(.labels[].name == "autorelease: pending")) | .[0].number // empty')
          if [ -z "$PR_NUMBER" ]; then
            echo "no open release PR to merge this run"
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            if gh pr merge "$PR_NUMBER" --squash --repo "$GITHUB_REPOSITORY"; then
              echo "merged release PR #$PR_NUMBER"
              exit 0
            fi
            echo "attempt $attempt: release PR #$PR_NUMBER not yet mergeable, retrying in 5s..."
            sleep 5
          done
          echo "::error::could not merge release PR #$PR_NUMBER after retries"
          exit 1

      # A GITHUB_TOKEN merge does NOT re-fire this `push: main` workflow, so the
      # tag would never be cut. Pass 2 runs release-please again in-run: it now
      # sees the merged release PR, creates the git tag + GitHub Release, and sets
      # release_created so trigger-schemas publishes the client. No-op when the
      # step above merged nothing.
      - uses: googleapis/release-please-action@v4
        id: tag
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # `trigger-schemas` is deliberately not called, and `schemas.yml` no longer
  # offers a `workflow_call` to call. The half that failed on every release since
  # 2026-01-08 — TypeScript and Zod generated off the JTD schema layer — is gone;
  # the OpenAPI client survives, dispatch-only, because nothing in the tree
  # consumes the `@tatolab/streamlib-client` package it publishes. Restoring it
  # to the release path is a decision for whenever a consumer exists.

  # Build the wheels onto the releases just cut and republish the simple index.
  # Called in-run for the same reason trigger-schemas is: the release was
  # created by GITHUB_TOKEN, so `on: release` would never fire.
  #
  # One call whatever released, because one index serves every project and is
  # regenerated whole: a blank tag builds nothing for that project, and a run
  # where all three are blank never gets here at all.
  trigger-wheel-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created || needs.release-please.outputs.streamlib_webrtc_tag_name || needs.release-please.outputs.streamlib_moq_tag_name }}
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/release-wheel.yml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
      streamlib_webrtc_tag_name: ${{ needs.release-please.outputs.streamlib_webrtc_tag_name }}
      streamlib_moq_tag_name: ${{ needs.release-please.outputs.streamlib_moq_tag_name }}
    secrets: inherit
