name: Release

# Every merge to main is a release. This cuts it: the next version, a commit off
# main that writes it into every manifest release-version-files.json lists and
# moves the in-tree pins and lockfiles with it, and a `v<version>` tag on that
# commit, which is the only thing pushed. main itself is never written to, so no
# release pull request rides the merge queue, and there is no GitHub release:
# get.tatolab.com and PyPI serve the distributions. The tagged commit's parent is
# the merge, so the tag contains every commit main held.
#
# The patch moves on every merge. The minor moves when the control contract's
# `x-contract-version` changed since the last release, or on a dispatch with
# `bump: minor`; the major only on a dispatch with `bump: major`
# (scripts/release_version.py). Runs are serialised; a merge that lands while
# one runs is released by the next.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version this release moves"
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  cut-the-release:
    name: Cut the release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag_name: ${{ steps.tag.outputs.tag_name }}
    steps:
      # RELEASE_PLEASE_TOKEN is a fine-grained token for this repository (contents
      # read and write) that Infisical syncs to the repository's secrets; the tag it
      # pushes is what the publish jobs and Tato Studio's release check out.
      - name: The release token reaches this repository
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLEASE_TOKEN" ]; then
            echo "::error::RELEASE_PLEASE_TOKEN does not reach this repository — add a fine-grained token for tatolab/streamlib (contents, read and write) to Infisical's prod environment, which syncs it to the organization's secrets"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          fetch-depth: 0
          fetch-tags: true

      - name: The version this release takes
        id: version
        env:
          REQUESTED_BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          set -euo pipefail
          last_release_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)"
          bump="$REQUESTED_BUMP"
          contract_path=sdk/tatolab-runtime-client/contract.json
          contract_version_at() {
            git show "$1:$contract_path" 2>/dev/null \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["info"]["x-contract-version"])' 2>/dev/null || true
          }
          if [ "$bump" = patch ] && [ -n "$last_release_tag" ]; then
            released_contract_version="$(contract_version_at "$last_release_tag")"
            current_contract_version="$(contract_version_at HEAD)"
            if [ -n "$released_contract_version" ] && [ "$released_contract_version" != "$current_contract_version" ]; then
              echo "the control contract moved from version $released_contract_version to $current_contract_version since $last_release_tag"
              bump=minor
            fi
          fi
          release_version="$(python3 scripts/release_version.py next --last-release "${last_release_tag#v}" \
            --tree "$(python3 scripts/release_version.py tree)" --bump "$bump")"
          if git rev-parse -q --verify "refs/tags/v$release_version" >/dev/null; then
            echo "::error::v$release_version is already tagged"
            exit 1
          fi
          echo "releases $release_version ($bump) after ${last_release_tag:-no earlier release}"
          echo "last_release_tag=$last_release_tag" >> "$GITHUB_OUTPUT"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: ./.github/actions/cache-rust-dependencies
        with:
          shared-key: xtask

      # `cargo` resolves the whole workspace before it builds any member, so the
      # pin-sync tool is built before the version moves: a minor bump leaves every
      # sibling pin excluding its own crate until the tool has moved it.
      - name: Build the version-pin sync tool while the tree still resolves
        run: cargo build --locked -q -p xtask

      - name: Write the version, the pins and the lockfiles
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: |
          set -euo pipefail
          python3 scripts/release_version.py apply "$RELEASE_VERSION"
          ./target/debug/xtask check-workspace-version-pins --fix
          cargo update --workspace
          # An extension wheel is its own workspace with its own lockfile, which
          # records its root package's version, so it catches up to its manifest
          # here. Discovered by the `tatolab-` distribution name, so the held
          # pre-pivot packages beside them, which no longer resolve, are never
          # handed to cargo; a pure-Python extension has no manifest to update.
          for extension_pyproject in packages/*/pyproject.toml; do
            grep -q '^name = "tatolab-' "$extension_pyproject" || continue
            extension_manifest="$(dirname "$extension_pyproject")/Cargo.toml"
            [ -f "$extension_manifest" ] || continue
            cargo update --workspace --manifest-path "$extension_manifest"
          done

      # The tag's message lists the merges it releases, in place of a changelog.
      - name: Tag the release
        id: tag
        env:
          LAST_RELEASE_TAG: ${{ steps.version.outputs.last_release_tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -q -m "chore: release $RELEASE_VERSION"
          # A merge commit's subject names only its branch; the pull request's title is its body's first line.
          release_notes="$(git log --first-parent --format='%s%x1f%b%x1e' "${LAST_RELEASE_TAG:+$LAST_RELEASE_TAG..}HEAD^" \
            | python3 -c 'import re, sys
          for entry in sys.stdin.read().split("\x1e"):
              subject, _, body = entry.strip("\n").partition("\x1f")
              merged = re.match(r"Merge pull request (#\d+) ", subject)
              if subject:
                  print(f"- {body.strip().splitlines()[0]} ({merged.group(1)})" if merged and body.strip() else f"- {subject}")' \
            | head -200)"
          git tag -a "v$RELEASE_VERSION" -m "streamlib $RELEASE_VERSION" -m "$release_notes"
          git push origin "refs/tags/v$RELEASE_VERSION"
          echo "tag_name=v$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

  # `trigger-schemas` is deliberately not called, and `control-plane-client.yml` no longer
  # offers a `workflow_call` to call. The half that failed on every release since
  # 2026-01-08 — TypeScript and Zod generated off the JTD schema layer — is gone;
  # the OpenAPI client survives, dispatch-only, because nothing in the tree
  # consumes the `@tatolab/streamlib-client` package it publishes. Restoring it
  # to the release path is a decision for whenever a consumer exists.

  # Publish the core of the release just cut: `tatolab-stream` to PyPI, the
  # core modules the runtime unit carries to Tatolab's index, and the Linux
  # runtime to get.tatolab.com. This call alone passes `dry_run: false`; any
  # other run of reusable-distributions.yml is a dry run unless dispatched with
  # `dry_run` unticked.
  publish-the-release:
    needs: cut-the-release
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-distributions.yml
    with:
      tag_name: ${{ needs.cut-the-release.outputs.tag_name }}
      dry_run: false
    secrets: inherit

  # Every other first-party module, at the same tag, once the core is out. A
  # module that fails to build is left out of the index and withholds neither
  # the core nor Tato Studio's release.
  publish-the-modules:
    needs: [cut-the-release, publish-the-release]
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-module-distributions.yml
    with:
      tag_name: ${{ needs.cut-the-release.outputs.tag_name }}
      dry_run: false
    secrets: inherit

  # Tato Studio bundles this runtime, so its release starts once the Linux runtime is on
  # get.tatolab.com. TATOLAB_APP_RELEASE_DISPATCH_TOKEN is a fine-grained token for
  # tatolab/tatolab-app with Actions read and write, the one permission a workflow dispatch needs.
  release-tato-studio:
    name: Start Tato Studio's release
    needs: [cut-the-release, publish-the-release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Dispatch tatolab-app's release with this streamlib version
        env:
          GH_TOKEN: ${{ secrets.TATOLAB_APP_RELEASE_DISPATCH_TOKEN }}
          RELEASE_TAG_NAME: ${{ needs.cut-the-release.outputs.tag_name }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::TATOLAB_APP_RELEASE_DISPATCH_TOKEN does not reach this repository — add a fine-grained token for tatolab/tatolab-app (Actions, read and write) to Infisical's prod environment, which syncs it to the organization's secrets"
            exit 1
          fi
          gh workflow run release.yml --repo tatolab/tatolab-app --ref main \
            -f streamlib_version="${RELEASE_TAG_NAME#v}"
          echo "tatolab-app's release runs with streamlib ${RELEASE_TAG_NAME#v}"
