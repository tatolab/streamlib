name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write
  actions: write

# `main` takes changes only through its merge queue, whose required checks must
# pass on a pull request before it can join. GitHub holds a pull request run
# raised by the default GITHUB_TOKEN for approval, so a release PR opened with it
# never runs those checks and never merges. Every write here is made with
# RELEASE_PLEASE_TOKEN, a fine-grained token for this repository (contents and
# pull requests, read and write) that Infisical syncs to the repository's
# secrets, so the release PR runs CI like any other.
#
# A release takes two runs: one opens the release PR and queues it, and the push
# the queue makes when it merges runs this again, which cuts the tag and the
# GitHub release and publishes the distributions.
jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: The release token reaches this repository
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLEASE_TOKEN" ]; then
            echo "::error::RELEASE_PLEASE_TOKEN does not reach this repository — add a fine-grained token for tatolab/streamlib (contents and pull requests, read and write) to Infisical's prod environment, which syncs it to the organization's secrets"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      # Cuts the tag and the GitHub release when the merged release PR is what
      # this push landed; otherwise opens or refreshes the standing release PR
      # (version bump + changelog) for the feat/fix commits since the last one.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # `cargo` resolves the whole workspace before it builds any member, so the
      # pin-sync tool cannot be built once the bump has landed: the resolve it
      # exists to repair is the one that fails. Build it here, while `main` still
      # resolves, and run the binary against the release branch below. `target/`
      # is gitignored, so it survives that checkout.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: xtask
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the version-pin sync tool while main still resolves
        run: cargo build --locked -q -p xtask

      # The `simple` release-type bumps [workspace.package].version in Cargo.toml
      # but ships no cargo dependency-requirement updater. Every in-tree crate
      # pins its workspace-versioned sibling crates with a frozen
      # `version = "X.Y.Z"` requirement (e.g. streamlib-error). Those
      # requirements never move on their own: caret-compatible within a 0.17.x
      # line but silently EXCLUDING the next breaking bump (0.18.0), which leaves
      # the release branch holding a workspace that cannot resolve at all.
      #
      # This step used to run `cargo update --workspace` alone, which is the half
      # that cannot work: the lockfile cannot be resolved while the manifests
      # exclude their own siblings, so the step exited 101, the auto-merge below
      # never ran, and no tag was cut. That wedged release 0.18.0 shut from
      # 2026-08-11 and starved the PEP 503 index of every wheel since. Moving the
      # pins first is what the comment here always claimed the step did.
      #
      # `cargo xtask check-workspace-version-pins` gates the same rule on every
      # PR, so the pins can only ever drift here, at the bump.
      - name: Sync the version pins and Cargo.lock to the release version
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          BRANCH=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json headRefName,labels \
            --jq 'map(select(.labels[].name == "autorelease: pending")) | .[0].headRefName // empty')
          if [ -z "$BRANCH" ]; then
            echo "no open release PR this run"
            exit 0
          fi
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          ./target/debug/xtask check-workspace-version-pins --fix
          cargo update --workspace
          # An extension wheel is its own workspace with its own lockfile, and a
          # lockfile records its root package's version. release-please bumps
          # each extension's Cargo.toml through `extra-files`, so without this
          # the bump alone leaves that lockfile a version behind and every
          # `--locked` build in the extension's CI lane fails on main. Not an
          # enrolment in `check-workspace-version-pins`, which stays workspace-
          # only by design: this is one lockfile catching up to its own manifest.
          #
          # Discovered by the `tatolab-` distribution name, so a second
          # extension needs no edit here — and so the held pre-pivot packages
          # beside them, which have not resolved since the plugin SDK was
          # deleted, are never handed to cargo.
          for extension_pyproject in packages/*/pyproject.toml; do
            grep -q '^name = "tatolab-' "$extension_pyproject" || continue
            extension_manifest="$(dirname "$extension_pyproject")/Cargo.toml"
            # An extension needs no Rust — a pure-Python one is a complete
            # extension — and handing cargo a directory with no manifest would
            # exit non-zero and wedge the release under this step's `bash -e`.
            [ -f "$extension_manifest" ] || continue
            cargo update --workspace --manifest-path "$extension_manifest"
          done
          if git diff --quiet; then
            echo "version pins and Cargo.lock already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -u -- '*Cargo.lock' '*Cargo.toml'
          # The release PR's required checks run on this commit, its head.
          git commit -m "chore: sync the version pins and Cargo.lock to the release version"
          git push origin "$BRANCH"

      # A version cut is pure bookkeeping — version + changelog, no code — so it
      # needs no human gate: the release PR joins the merge queue the moment it
      # exists, and merges once its checks pass. The PR is found by
      # release-please's own `autorelease: pending` label rather than an action
      # output, so a freshly-opened PR is caught unambiguously.
      - name: Queue the release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,labels \
            --jq 'map(select(.labels[].name == "autorelease: pending")) | .[0].number // empty')
          if [ -z "$PR_NUMBER" ]; then
            echo "no open release PR to queue this run"
            exit 0
          fi
          gh pr merge "$PR_NUMBER" --auto --repo "$GITHUB_REPOSITORY"
          echo "release PR #$PR_NUMBER merges through the queue once its checks pass"

  # `trigger-schemas` is deliberately not called, and `control-plane-client.yml` no longer
  # offers a `workflow_call` to call. The half that failed on every release since
  # 2026-01-08 — TypeScript and Zod generated off the JTD schema layer — is gone;
  # the OpenAPI client survives, dispatch-only, because nothing in the tree
  # consumes the `@tatolab/streamlib-client` package it publishes. Restoring it
  # to the release path is a decision for whenever a consumer exists.

  # Publish the core of the release just cut: `tatolab-stream` to PyPI, the
  # core modules the runtime unit carries to Tatolab's index, and the Linux
  # runtime to get.tatolab.com. This call alone passes `dry_run: false`; any
  # other run of reusable-distributions.yml is a dry run unless dispatched with
  # `dry_run` unticked.
  publish-the-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    # Write, for attaching the Linux runtime tarball to the release just cut.
    permissions:
      contents: write
    uses: ./.github/workflows/reusable-distributions.yml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
      dry_run: false
    secrets: inherit

  # Every other first-party module, at the same tag, once the core is out. A
  # module that fails to build is left out of the index and withholds neither
  # the core nor Tato Studio's release.
  publish-the-modules:
    needs: [release-please, publish-the-release]
    if: ${{ needs.release-please.outputs.release_created }}
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-module-distributions.yml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
      dry_run: false
    secrets: inherit

  # Tato Studio bundles this runtime, so its release starts once the Linux runtime is on
  # get.tatolab.com. TATOLAB_APP_RELEASE_DISPATCH_TOKEN is a fine-grained token for
  # tatolab/tatolab-app with Actions read and write, the one permission a workflow dispatch needs.
  release-tato-studio:
    name: Start Tato Studio's release
    needs: [release-please, publish-the-release]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Dispatch tatolab-app's release with this streamlib version
        env:
          GH_TOKEN: ${{ secrets.TATOLAB_APP_RELEASE_DISPATCH_TOKEN }}
          RELEASE_TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::TATOLAB_APP_RELEASE_DISPATCH_TOKEN does not reach this repository — add a fine-grained token for tatolab/tatolab-app (Actions, read and write) to Infisical's prod environment, which syncs it to the organization's secrets"
            exit 1
          fi
          gh workflow run release.yml --repo tatolab/tatolab-app --ref main \
            -f streamlib_version="${RELEASE_TAG_NAME#v}"
          echo "tatolab-app's release runs with streamlib ${RELEASE_TAG_NAME#v}"
