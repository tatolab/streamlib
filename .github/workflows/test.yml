            core::context::surface_share_wire_verbs
          # The two arms' own liveness tests are named one by one rather than
          # by module: their modules also hold tests that dlopen libasound and
          # walk a real PCM, which this runner has no `/dev/snd` for. These
          # five touch neither — they drive a thread's exit value and the
          # shim's failure trampoline directly.
          # The deviceless arm's two integration binaries. Both assert the
          # seam's contract on the one arm that needs no hardware, which is
          # what their module docs claim and what nothing else in CI covers:
          # every other arm of the audio suite is rig-gated.
          cargo test --locked -p streamlib-engine \
            --test silent_null_arm_plays_what_it_is_given \
            --test silent_null_arm_captures_without_ever_dying
          # The surface-share watchdog across a real process: a helper that
          # checked a surface in is SIGKILLed, and the service releases the
          # surface and its fds. GPU-free — the surface is a memfd.
          cargo test --locked -p streamlib-engine \
            --test surface_share_subprocess_crash
          # The multi-process mesh end-to-end suites, compiled but not run: real
          # runtimes in separate processes over Zenoh on loopback are a local
          # validation, never a merge gate (docs/testing-hardware.md). Building
          # them here is what stops them rotting between local runs.
          cargo test --locked -p streamlib-engine \
            --features multi-process-mesh-e2e-tests \
            --test runtime_mesh_two_processes \
            --test cross_runtime_links_two_processes \
            --test cross_runtime_link_requests_two_processes --no-run
          # streamlib-consumer-rhi was reached by no cargo invocation here for
          # the same reason the built-ins were: the clippy step builds default
          # targets and never its test target. Its unit tests are the no-GPU
          # arm of the consumer import contract — the stated-memory-type-index
          # bind among them, whose end-to-end proof is rig-gated and never runs
          # in CI. Kept a test line, not a clippy line: the crate carries a
          # pre-existing `println!` in test code that trips
          # `clippy::disallowed_macros` under `--all-targets`.
          cargo test --locked -p streamlib-consumer-rhi --lib
          # The control plane was reached by no cargo invocation here for the
          # same reason: the clippy step builds default targets and never its
          # test target. These are the only tests of the REST routes and the
          # MCP tool dispatch — the surface an agent and every programmatic
          # client drive the runtime through.
          cargo test --locked -p streamlib-api-server --lib

  # The lane whose absence is why the Apple tree rotted: every one of the other
  # jobs in this repo is `ubuntu-latest`, so `aarch64-apple-darwin` went roughly
  # seven months without being compiled at all and accumulated 44 errors nobody
  # saw. macOS is a supported platform floor, so a macOS-only regression blocks
  # a release exactly as a Linux one does — which only means anything if
  # something compiles it on every PR.
  #
  # `macos-15` pinned rather than `macos-latest`: that label now means macOS 26,
  # and the runner image is what decides the SDK the Apple frameworks are linked
  # against. arm64, and free for public repositories.
  #
  # No GPU work runs here. A Vulkan device on MoltenVK is #2356 and a window is
  # #2357; this job's whole claim is that the tree compiles, that the tests
  # needing no device pass, and that the wheel's stub and Python suite hold on
  # this binary as on the Linux one.
  rust-build-macos:
    name: Rust Build (macOS)
    runs-on: macos-15
    # A cold cache builds shaderc — glslang and SPIRV-Tools from source — before
    # it reaches a single test, which is most of a 22-minute first run.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          # Compiles and runs PR-authored code; a persisted checkout token would
          # be readable by it. No workspace member has a git dependency.
          persist-credentials: false

      # `glslc` stages the engine's SPIR-V for `include_bytes!`, so it is a
      # build dependency wherever the Vulkan RHI compiles — which, since the
      # Metal tree went, is here too. Homebrew's `shaderc` formula is what
      # carries the binary. `cmake` and `ninja` build the `shaderc` *crate*
      # (glslang + SPIRV-Tools from source); ninja is what makes that a minute
      # rather than several, so it is installed explicitly rather than assumed.
      - name: Install glslc and the shaderc crate's build tools
        run: brew install shaderc cmake ninja

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The Python the wheel crate's unit tests link and the venv below is
      # built from, pinned rather than whichever the runner image carries.
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # One exclusion, the one Linux carries too: `streamlib-adapter-skia`
      # (skia-bindings 404s on its prebuilt download). Every other workspace
      # member compiles here, the wheel included, and so do the Linux-only
      # adapters, whose `tests/bin` fixtures carry an empty `main` off Linux
      # so the crate keeps building and cannot rot unseen.
      - name: cargo clippy (workspace, default targets)
        run: |
          cargo clippy --locked --workspace --no-deps \
            --exclude streamlib-adapter-skia

      # `--all-targets` where the Linux job's clippy takes default targets: the
      # tests, benches and example targets are exactly where a macOS-only
      # compile break would otherwise hide, and none of them is expensive here.
      - name: cargo check (workspace, all targets)
        run: |
          cargo check --locked --workspace --all-targets \
            --exclude streamlib-adapter-skia

      - name: Run unit tests
        run: |
          cargo test --locked -p streamlib -p streamlib-macros \
            -p streamlib-processor-schema -p streamlib-ipc-types --lib
          cargo test --locked -p streamlib-engine --test attribute_macro_test
          cargo test --locked -p streamlib-media-builtins --lib
          cargo test --locked -p streamlib-consumer-rhi --lib
          cargo test --locked -p streamlib-api-server --lib
          # `--test-threads=1` because two of these open iceoryx2 nodes in child
          # processes of this same binary and race each other when run in
          # parallel; serialised they pass, and the whole suite is about ninety
          # seconds. The Linux job names a slice of this suite instead, so this
          # is the broader of the two runs rather than a mirror of it.
          cargo test --locked -p streamlib-engine --lib -- --test-threads=1
          # The surface-share service's raw-Mach arm: the wire in its client
          # crate, then the service across real processes — a helper reading and
          # editing a shared IOSurface, an impostor refused, and each side's
          # death seen by the other. IOSurface and Mach need no GPU.
          cargo test --locked -p streamlib-surface-client
          cargo test --locked -p streamlib-engine --test surface_share_over_raw_mach
          # The multi-process mesh end-to-end suites, compiled but not run: real
          # runtimes in separate processes over Zenoh on loopback are a local
          # validation, never a merge gate (docs/testing-hardware.md). Building
          # them here is what stops them rotting between local runs.
          cargo test --locked -p streamlib-engine \
            --features multi-process-mesh-e2e-tests \
            --test runtime_mesh_two_processes \
            --test cross_runtime_links_two_processes \
            --test cross_runtime_link_requests_two_processes --no-run
          # Compiled but not run: the AVFoundation arm against a real camera,
          # `CameraSource` → `DisplayWindow` on the window server, and the
          # CoreAudio arm against real audio devices need a camera, a
          # microphone, their access grants and a GPU no runner has. Building
          # them here is what stops them rotting between rig runs.
          cargo test --locked -p streamlib-engine -p streamlib-media-builtins \
            --features streamlib-engine/hardware-tests,streamlib-media-builtins/hardware-tests \
            --test avfoundation_camera_captures_through_the_video_device_seam \
            --test camera_to_display_window_on_the_macos_window_server \
            --test coreaudio_arm_stamps_blocks_with_the_devices_own_timing \
            --test coreaudio_arm_plays_what_it_is_given --no-run

      # The whole reason this job exists in the milestone's first ticket: the
      # source-walking gates now evaluate `cfg` for macOS as well as Linux, so
      # `apple/` is linted at all. Cheap, and it fails here rather than leaving
      # the Apple tree unlinted the way it was.
      - name: cargo xtask lint-logging
        run: cargo run --locked -q -p xtask -- lint-logging

      # Its prescriptions name Linux calls Darwin lacks; the portable spelling
      # it accepts is what the macOS arms use.
      - name: cargo xtask check-no-inheritable-descriptor
        run: cargo run --locked -q -p xtask -- check-no-inheritable-descriptor

      # `--test-threads=1` for the reason the Linux wheel job gives: every test
      # embeds the same interpreter and takes the same GIL.
      - name: Wheel crate unit tests
        run: cargo test --locked -p streamlib-python-wheel --lib -- --test-threads=1

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build and install the wheel
        working-directory: sdk/streamlib-python-wheel
        run: |
          uv venv --python 3.12 .venv
          VIRTUAL_ENV="$PWD/.venv" uv pip install pytest mypy numpy pydantic typing_extensions
          VIRTUAL_ENV="$PWD/.venv" uvx maturin@1.9.6 develop

      # One `_engine.pyi` for both binaries: a method the macOS build lacks
      # fails here.
      - name: Type stubs match the compiled module
        working-directory: sdk/streamlib-python-wheel
        run: .venv/bin/python -m mypy.stubtest streamlib._engine

      # The suite the Linux wheel job runs. A test absent on macOS carries
      # `linux_only_capability` (the closed list) or `awaiting_macos_parity`
      # (a strict xfail naming its ticket, not run unless
      # STREAMLIB_RUN_AWAITING_MACOS_PARITY=1); `test_platform_markers.py` holds
      # both to that. The `requires_gpu` half joins this lane with the parity
      # ticket that first makes it green.
      - name: Python suite (GPU-free half)
        working-directory: sdk/streamlib-python-wheel
        run: .venv/bin/python -m pytest tests/ -v -m "not requires_gpu"

      # Record-only: whether MoltenVK finds a Metal device on this runner,
      # which decides whether the `requires_gpu` half can ever run in CI here.
      # Last, so the suite above runs without MoltenVK installed.
      - name: Probe for a Metal device under MoltenVK
        continue-on-error: true
        run: |
          system_profiler SPDisplaysDataType
          brew install molten-vk vulkan-loader vulkan-tools
          vulkaninfo --summary
