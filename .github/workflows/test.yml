name: Test

on:
  pull_request:
    branches: [main]
    # Prose changes cannot break a Rust unit test, and this job is ~2.5 minutes.
    # `main` carries no required status checks, so a skipped run blocks nothing.
    # `.github/**` is deliberately absent: a workflow edit must run the workflow.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.claude/**'
      - 'LICENSE'
      - 'LICENSES/**'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.claude/**'
      - 'LICENSE'
      - 'LICENSES/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # No test joins whatever runtime mesh a CI runner happens to sit on. The
  # engine's own lib tests get this from a test-only default; everything that
  # runs a built wheel or an integration test gets it from here.
  STREAMLIB_MESH_MULTICAST_DISCOVERY: "0"

jobs:
  rust-tests-linux:
    name: Rust Tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          # Compiles and runs PR-authored code; a persisted checkout token would
          # be readable by it. No workspace member has a git dependency.
          persist-credentials: false

      # `-p streamlib` pulls streamlib-engine, whose build.rs compiles GLSL
      # compute shaders with glslc; the Linux engine dep set links Vulkan, and
      # iceoryx2's PAL crates run bindgen. Minimal subset — no GPU/codec
      # backends.
      #
      # `timeout-minutes` is the native backstop the composite action cannot
      # declare for itself; `check-bounded-apt-install` fails the build if it
      # goes missing. 12 minutes sits above the script's own 590s worst case so
      # the script reports the failure rather than being killed mid-sentence.
      # `cmake` builds the engine's vendored GLSL compiler (shaderc, taken
      # `build-from-source`); `ninja-build` is what makes that ~64s instead of
      # minutes — shaderc-sys picks the Ninja generator whenever `ninja` is on
      # PATH, so installing it is the whole configuration. Explicit rather than
      # leaning on the runner image having either, whose contents move.
      - name: Install system dependencies
        timeout-minutes: 12
        uses: ./.github/actions/install-linux-engine-build-dependencies
        with:
          packages: >-
            pkg-config
            protobuf-compiler
            libclang1-18
            libclang-common-18-dev
            libvulkan-dev
            glslc
            cmake
            ninja-build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Was a raw `actions/cache` over `target/`, which had grown to a 3.72 GB
      # entry taking 66s to restore — longer than the 53s of tests it existed to
      # accelerate, so it was a net loss. rust-cache keeps dependency artifacts
      # and drops the workspace's own, which are invalid next commit anyway.
      #
      # `save-if` on main stops PRs minting their own ref-scoped copies. Repo
      # cache had reached 11.76 GB against GitHub's 10 GB cap, so every save was
      # evicting something — including the entry the next run needed.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-tests
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Unit-test gate. Runs the facade + macros lib tests plus the
      # `#[processor]` emission locks. streamlib-macros carries the
      # field-attribute emission locks; attribute_macro_test is named
      # explicitly because it is the compile-level half of those locks
      # and cannot live in the proc-macro crate's own lib tests.
      # streamlib-engine's lib tests (host-body tier-1 + engine twin) are a
      # tracked follow-up. The "parallel-run test flake" this comment used to
      # cite was never pinned to a specific test; the one flake since diagnosed
      # is the pubsub subscribe race, fixed in #1873. What is known to remain is
      # fd-capture flakes.
      # Here rather than in source-gates.yml because clippy has to compile the
      # workspace, and this is the job that already carries the engine's build
      # dependencies and its warm dependency cache. Default targets only: a
      # test's `println!` is a test's business, matching the exemption
      # `xtask lint-logging` already makes for `tests` directories.
      #
      # Before this step existed no workflow ran clippy at all — `docs/logging.md`
      # claimed it did, and an `eprintln!` in each of two adapter test helpers
      # sat behind that claim unnoticed.
      # `--exclude streamlib-adapter-skia`: `skia-bindings` 404s on its prebuilt
      # download here and then needs FreeType headers to build from source, and
      # no CI job has ever built that crate — every other cargo invocation in
      # this repo is `-p`-scoped, so this clippy step is the first `--workspace`
      # anything. Making CI build Skia is a real cost and its own decision; the
      # exclusion keeps the existing coverage boundary rather than moving it
      # silently. Consequence worth knowing: that adapter is linted by nothing.
      - name: cargo clippy (workspace, default targets)
        run: cargo clippy --locked --workspace --exclude streamlib-adapter-skia --no-deps

      - name: Run unit tests
        run: |
          # `streamlib-ipc-types` holds the wire's layout locks: the frame
          # header's offsets and the sequence-number user header every data
          # sample carries. `streamlib-surface-client` holds the surface-share
          # socket's framing, SCM_RIGHTS round trips and read-failure reporting.
          cargo test --locked -p streamlib -p streamlib-macros \
            -p streamlib-processor-schema -p streamlib-ipc-types \
            -p streamlib-surface-client --lib
          cargo test --locked -p streamlib-engine --test attribute_macro_test
          # The compile-fail half of the same locks. The descriptor carries the
          # config type's schema, so the derive is a requirement, and the note
          # naming the fix is the only thing standing between an author and a
          # bare trait-bound error. Nothing else in CI hands the compiler a
          # config type without the derive. A compiler upgrade that reflows a
          # diagnostic reddens here; `TRYBUILD=overwrite` refreshes it.
          cargo test --locked -p streamlib-engine \
            --test compile_fail_config_without_json_schema
          # The built-ins were reached by no cargo invocation here: the clippy
          # step above compiles default targets only, so it builds their lib and
          # never their test target. Their unit tests are the headless arm of
          # the display's fold onto the engine's present machinery — the rest of
          # that coverage is rig-gated and never runs in CI at all.
          cargo test --locked -p streamlib-media-builtins --lib
          # Compiled but not run. `speaker_sink_matches_its_device` is the only
          # thing that drives the two `match_device` production call sites —
          # `SpeakerSink::setup()` settling its port, and the spawn seam refusing
          # a port setup left unsettled — but it stands up a real graph, and
          # `App::new()` needs a GpuContext no CI runner has. Building it here is
          # what stops it rotting between rig runs; the rig is where it passes.
          cargo test --locked -p streamlib-media-builtins \
            --test speaker_sink_matches_its_device --no-run
          # Compiled but not run, for the same reason: the camera→H264Encoder
          # round trip is the only thing that drives the encoder's production
          # seam (the lazy session mint, the per-frame resolve + submit, the
          # bag publish), and it needs a Vulkan Video encode queue and a
          # /dev/video* device no CI runner has.
          cargo test --locked -p streamlib-media-builtins \
            --test h264_encoder_publishes_the_bag_convention --no-run
          # Compiled but not run, same reason on the decode side: the
          # test-pattern -> encode -> decode round trip is #1077 read
          # forwards, and it needs Vulkan Video encode *and* decode queues.
          # One binary per codec arm off one shared harness — each stands up
          # its own App, and one process brings up one GpuContext. The H.265
          # arm is where the CTU crop is asserted end to end.
          cargo test --locked -p streamlib-media-builtins \
            --test h264_decoder_completes_the_round_trip \
            --test h265_decoder_completes_the_round_trip --no-run
          # Compiled but not run: a processor thread abandoned past its shutdown
          # budget reaching the caller of `Runner::stop()` and of a live
          # `remove_processor` needs a started `Runner`, and so a GpuContext.
          cargo test --locked -p streamlib-engine \
            --test a_processor_thread_that_ignores_shutdown_is_abandoned_and_named --no-run
          # Compiled but not run: the display tier's window tests need a display
          # server and a GPU no CI runner has, and each shares a test module with
          # its macOS counterpart, so a change to that module reaches Linux here.
          cargo test --locked -p streamlib-engine \
            --test processor_owned_window_shows_named_surfaces --no-run
          cargo test --locked -p streamlib-media-builtins \
            --test two_display_windows_live --no-run
          # The engine-owned codec round-trip rig. Examples are not a default
          # cargo target, so nothing above builds it and it would rot between
          # rig runs unnoticed; running it needs the queues, a display server
          # and optionally a camera, so CI only compiles it.
          cargo build --locked -p streamlib-engine --example codec_roundtrip_rig
          # The cross-runtime-link rig arm, engine-owned for the same reason:
          # running it needs a GPU and two runtimes, so CI compiles it to stop
          # it rotting between rig runs.
          cargo build --locked -p streamlib-engine --example cross_runtime_link_rig
          # The present-class escalate ops' headless arm. `streamlib-engine`'s
          # lib tests are deliberately not run wholesale here (see
          # python-wheel.yml's carve-out, which says so), so a named slice is
          # how an engine-lib test reaches CI at all — otherwise the wire
          # goldens, the setup-phase gate and the close-request semantics
          # would run nowhere: the rest of that ticket's coverage is
          # display-tier and never runs in CI. The audio-seam entries are the
          # genuinely deviceless half of the audio path — the null backend
          # needs no audio library and its cadence is driven by a hand-fired
          # test clock, so unlike anything that boots a graph (which needs a
          # GPU this runner does not have) they really do run here.
          # The counted-drop entries are the only gate the per-link drop
          # counting has. Four of them open real iceoryx2 services, which need
          # /dev/shm and nothing else — no GPU, no audio device — so the
          # end-to-end half of that contract runs here rather than on the rig.
          # The delivery-profile entries are likewise the only gate the
          # declaration surface has: the two profiles' resolutions, the
          # wire-time refusal that lists the legal values, and the
          # missing-declaration wiring error are pure registry work needing no
          # device, and before they were named here they ran in no CI job at
          # all despite two of them anchoring `verify:` lines in the plan.
          # The port-rendering entries are the only gate the control plane's
          # port surface has, and before they were named here they ran in no
          # CI job at all: they assert that a windowed port renders its
          # contract, that a contract-less one renders exactly the four keys
          # it always did, and that no port carries a type key under any
          # spelling. Pure serde — no device, no graph.
          # The codec entries are the NAL-parse seam #1077 implicates: the
          # parameter sets an encoder prepends to every sync point are a
          # mid-stream decoder's only entry point, and a framing the engine's
          # own NAL reader cannot parse is dropped whole rather than refused —
          # which is how a run encodes fifty frames and decodes none. Pure
          # byte walking; the round trip that proves it end to end needs
          # Vulkan Video queues and is compiled-only below.
          # The chroma-siting entry sits beside them: it holds the decode path's
          # reconstruction offsets against the chroma_sample_loc_type the SPS
          # builder writes, so moving one without the other reddens here rather
          # than on the rig. It gates the two values agreeing, not the emitted
          # VUI — the dB that a disagreement costs is rig-measured.
          # The config-schema entries are the only gate the descriptor's
          # config slot has on the way to the control plane: that the
          # document reaches the rendering unchanged, and that a descriptor
          # built without one renders no key rather than a null. Pure serde —
          # the seam an agent reads a processor's config shape through.
          # Named one by one rather than by module prefix: a prefix would
          # enrol whatever that module holds next, which is how a device test
          # joins this list without anyone deciding to add it.
          # The audio window contract's read-side stage. The only gate it
          # has: the stage's exactness, its overlap, the flush that resets the
          # resampler's filter state, its refusals, and the readiness floor
          # that must never claim a window a read cannot then produce. The
          # `iceoryx2::input` and `open_iceoryx2_service_op` entries carry the
          # same contract at the seam and at wire time — the input ones open
          # real iceoryx2 services, which need /dev/shm and nothing else. The
          # end-to-end half through a helper-placed Python consumer is
          # rig-gated like every other graph test in the wheel.
          # The capability-extension mechanism's engine half: the registry's
          # duplicate refusal, and `graph`'s third top-level key. The Python
          # discovery loop and the two call sites are proven in the wheel's
          # pytest suite; these are the seam it registers through.
          # The JSONL writer's segment rotation and retention, the knobs that
          # resolve its policy, and the rotated-segment name the wheel's
          # `streamlib logs` parses back out — tempdir-only, no GPU, no env
          # beyond the logging knobs themselves.
          # The runtime directory's resolver arms and refusals, and the
          # engine-owned iceoryx2 domain: the socket-path budget, a working
          # directory's `iceoryx2.toml` ignored, two test processes as two domains,
          # and the sweep of what a dead test process left.
          # The runner arm starts a runtime with `XDG_RUNTIME_DIR` unset.
          # A link wired and unwired in a loop against a read holding no
          # processor mutex, for at least three seconds and on until both
          # racers meet their floors, capped at thirty: the input side's own
          # lock is what keeps that from corrupting the heap.
          # The engine build id a helper checks against its parent's: how the
          # build script composes it, `unknown` with no git checkout, a fresh
          # nonce per build, and the compiled id leading with the crate version.
          # Channel sizing for a late consumer: a `newest` and an `ordered`
          # consumer on one running port each at its own depth, a channel
          # created deep whichever consumer came first, the services a link
          # holds against a helper opening first and released with it, the
          # fan-out and fan-in caps from distinct nodes and their refusals, and
          # the one-sample, no-history limits every channel states.
          # Every bag a native link loses is counted where `graph` reads it: the
          # ring overwrites a sequence-number jump reveals on an `ordered` port
          # and none on a `newest` one, a replaced publisher read as a new
          # baseline, the receive seam's own drops, the user header every data
          # service refuses an opener without, and a producer's writes refused
          # at the ceiling — counted on its output port, consuming no number.
          # A link onto a helper reads `wired` only once the helper answers:
          # the answer's own rpc tags and the routing that keeps them out of the
          # lifecycle queue, the cells they land on and the refusal of every one
          # a dead helper still owed, the link state derived from them, and the
          # plan check that never wires an unanswered link twice. The helper's
          # half of the exchange is the wheel's `test_helper_process.py`.
          # Transport hygiene. The ceiling and the segment-growth log measured
          # against the shared-memory sample iceoryx2 buckets rather than the
          # frame alone; the shared-memory headroom reading, which never refuses
          # a start; the tap's idle backoff, which is what keeps an attached tap
          # on a quiet channel off a core; and a deeper open getting past a
          # shallow service a dead holder left behind, which iceoryx2's own
          # sweep-after-a-successful-open never clears.
          # The runtime event bus as an in-process fan-out: no listener or
          # publisher cap, no payload ceiling, one order for every listener, a
          # full queue that drops and counts rather than blocking the publisher,
          # and a dropped listener's subscription pruned. Beside it, the pinned
          # runtime id refused before the runtime writes anything, a live
          # runtime's id refused before a node is created, and a dropped runner
          # taking its iceoryx2 node's files with it.
          # The surface-share service's Linux arm whole, and the verbs its Linux
          # and macOS arms share, named by module: none of their tests needs a
          # device.
          # The video device seam beside the audio one: the probe chain both
          # walk and the device-stream liveness report both carry, the
          # refusing backend a platform with no capture arm lands on, the rule
          # every arm stamps its frames' capture instant under, and the V4L2
          # arm — its colour map in both directions, the clock a dequeued
          # buffer's stamp is on, and its refusal of a named device that does
          # not exist. Beside them, the one H.273 table every colour
          # description resolves through.
          cargo test --locked -p streamlib-engine --lib -- \
            core::processor_owned_window \
            core::compiler::compiler_ops::subprocess_escalate::processor_owned_window::tests \
            escalate_wire_encoding_tests \
            core::compiler::compiler_ops::subprocess_escalate::acquisition::tests::parse_texture_usages \
            core::compiler::compiler_ops::subprocess_escalate::acquisition::tests::the_implied_copy_bits \
            core::context::audio_device_backend \
            core::context::silent_null_audio_device_backend \
            core::context::device_backend_probe_chain \
            core::context::device_stream_liveness_report \
            core::context::video_device_backend \
            core::context::refusing_null_video_device_backend \
            core::context::video_capture_instant_resolver \
            core::color::h273_color_vui \
            linux::v4l2_color \
            linux::v4l2_video_device_backend::tests::list_devices_succeeds_with_or_without_cameras \
            linux::v4l2_video_device_backend::tests::a_named_device_that_does_not_exist_is_refused_naming_it \
            linux::v4l2_video_device_backend::tests::a_buffer_flagged_monotonic_carries_its_stamp_in_nanoseconds \
            linux::v4l2_video_device_backend::tests::a_buffer_whose_stamp_clock_is_unknown_or_copied_is_off_the_monotonic_clock \
            linux::alsa_audio_device_backend::tests::a_thread_that_stopped_because_it_was_told_to_reports_no_failure \
            linux::alsa_audio_device_backend::tests::every_way_a_thread_dies_early_reaches_the_owner_naming_what_happened \
            linux::alsa_audio_device_backend::tests::a_stalled_device_is_described_by_what_that_direction_stopped_doing \
            linux::alsa_audio_device_backend::tests::a_stop_arriving_during_the_last_silent_wait_outranks_the_silence \
            linux::pipewire_audio_device_backend::tests::a_failure_the_shim_reports_lands_in_the_report_the_owner_holds \
            linux::pipewire_audio_device_backend::tests::a_failure_the_daemon_did_not_explain_is_still_reported_as_one \
            linux::pipewire_runtime_library::tests::the_shim_names_every_entry_point_it_expects_rust_to_resolve \
            linux::pipewire_video_source::tests::a_camera_node_announces_the_class_and_role_a_portal_grants \
            linux::pipewire_video_source::tests::a_pipewire_camera_node_offers_a_modifier_and_a_shared_memory_sibling \
            linux::pipewire_video_source::tests::the_fixated_offer_carries_the_modifier_without_the_dont_fixate_flag \
            linux::pipewire_video_source::tests::a_camera_name_reduces_to_a_pipewire_identifier \
            linux::pipewire_video_source::tests::punctuation_collapses_rather_than_repeating \
            iceoryx2::loss_counters::tests::asking_twice_for_one_links_counter_shares_the_count \
            iceoryx2::loss_counters::tests::a_disconnected_links_count_leaves_with_it \
            iceoryx2::loss_counters::tests::a_released_output_ports_refusals_leave_with_it_and_a_reopened_port_starts_from_zero \
            iceoryx2::mailbox::tests::an_eviction_is_counted_against_the_link_whose_bag_was_lost \
            iceoryx2::mailbox::tests::a_hand_over_keeps_each_frames_inbound_link_and_its_order \
            iceoryx2::mailbox::tests::a_hand_over_re_measures_every_frame_by_the_replacements_own_measure \
            iceoryx2::mailbox::tests::a_mailbox_with_room_counts_nothing \
            iceoryx2::mailbox::tests::every_bag_a_sustained_overrun_evicts_is_counted \
            iceoryx2::mailbox::tests::passing_over_bags_to_reach_the_newest_is_not_a_drop_at_the_port \
            iceoryx2::mailbox::tests::a_manually_injected_frame_evicts_with_no_link_to_charge \
            iceoryx2::mailbox::tests::an_installed_notice_is_signalled_for_every_evicted_bag_and_never_with_room \
            iceoryx2::input::tests::each_inbound_link_reports_its_own_losses_at_a_stalled_ordered_port \
            iceoryx2::input::tests::a_port_that_keeps_up_reports_a_zero_for_every_wired_link \
            iceoryx2::input::tests::a_disconnected_links_count_goes_with_the_link \
            iceoryx2::input::tests::two_inbound_links_hand_a_reader_the_link_each_bag_arrived_on \
            iceoryx2::input::tests::naming_the_inbound_link_a_bag_arrived_on_leaves_the_per_link_drop_counts_alone \
            iceoryx2::input::tests::a_port_lists_the_inbound_links_wired_into_it_and_a_port_with_none_lists_none \
            iceoryx2::input::tests::a_windowed_ports_read_names_the_one_link_that_feeds_it \
            iceoryx2::input::tests::a_read_holding_a_stage_from_before_a_rewire_feeds_it_nothing_from_the_new_wiring \
            iceoryx2::input::tests::an_injected_bag_with_no_inbound_link_is_refused_by_name_rather_than_borrowing_one \
            iceoryx2::input::tests::the_typed_read_deserializes_the_bag_and_a_drained_port_is_not_an_error \
            iceoryx2::input::tests::a_link_wired_and_unwired_in_a_loop_never_races_a_read_that_holds_no_processor_mutex \
            iceoryx2::input::tests::every_link_from_this_runtime_answers_this_machines_clock \
            iceoryx2::input::tests::a_link_from_another_runtime_answers_whatever_the_mesh_is_carrying_from \
            iceoryx2::input::tests::a_link_name_the_port_does_not_carry_says_so_rather_than_naming_a_machine \
            core::graph::components::processor_metrics::tests::a_processors_metrics_render_every_inbound_links_losses_by_name \
            core::graph::components::processor_metrics::tests::a_processor_that_has_lost_nothing_says_so_rather_than_staying_silent \
            core::graph::components::processor_metrics::tests::a_processors_metrics_render_every_output_ports_refusals_beside_its_inbound_losses \
            core::graph::components::processor_metrics::tests::a_processors_metrics_render_discarded_samples_only_for_links_into_windowed_ports \
            iceoryx2::loss_counters::tests::a_remote_links_hop_loss_is_counted_apart_and_a_re_wire_starts_it_from_zero \
            iceoryx2::loss_counters::tests::a_disconnected_remote_links_hop_loss_leaves_with_it \
            iceoryx2::bags_a_gap_in_the_numbering_says_were_lost \
            iceoryx2::output::tests::removing_the_last_link_can_keep_the_channel_so_a_later_one_still_lands \
            core::graph::components::processor_metrics::tests::a_processors_metrics_render_mesh_hop_loss_beside_its_ports_own_and_never_inside_it \
            core::graph::components::processor_metrics::tests::a_remote_link_that_has_lost_nothing_on_the_hop_renders_a_zero_rather_than_nothing \
            core::graph::components::processor_metrics::tests::a_processor_with_no_remote_link_renders_no_mesh_hop_key_rather_than_an_empty_one \
            core::runtime::operations_runtime::connect_wires_without_inspecting_a_port_tests::connect_wires_a_producer_to_a_consumer_without_warning \
            core::compiler::compiler_ops::open_iceoryx2_service_op::tests::a_dropping_destinations_node_renders_each_inbound_links_losses \
            iceoryx2::helper_process_loss_count_board::tests::a_count_written_on_a_claimed_slot_is_what_the_parent_reads \
            iceoryx2::helper_process_loss_count_board::tests::a_write_from_a_wiring_the_slot_has_moved_past_lands_nothing \
            iceoryx2::helper_process_loss_count_board::tests::an_output_port_claimed_again_starts_from_zero_and_its_earlier_mirror_lands_nothing \
            iceoryx2::helper_process_loss_count_board::tests::the_last_counts_stay_readable_after_the_helpers_writer_is_gone \
            iceoryx2::helper_process_loss_count_board::tests::slots_are_reused_lowest_first_and_every_wiring_gets_a_new_generation \
            iceoryx2::helper_process_loss_count_board::tests::a_destination_past_the_slot_count_is_refused_by_name \
            iceoryx2::helper_process_loss_count_board::tests::an_output_port_keeps_its_generation_while_it_has_a_link_and_takes_a_new_one_after_its_last_goes \
            iceoryx2::helper_process_loss_count_board::tests::the_parent_reads_each_entry_only_for_the_wiring_it_assigned \
            iceoryx2::loss_counters::tests::a_mirrored_count_writes_the_total_it_had_and_every_new_total_through_its_mirror \
            iceoryx2::input::tests::every_loss_counted_on_a_mirrored_link_reaches_its_board_slot_as_it_is_counted \
            iceoryx2::output::tests::a_refusal_on_a_mirrored_output_port_reaches_its_board_entry_as_it_is_counted \
