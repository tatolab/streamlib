name: Linux Runtime Tarball

# The tarball install.sh installs: the runtime unit built in manylinux_2_28 by
# `scripts/build_linux_runtime_release_tarball.sh`, which also runs the
# portability gate over it at the 2.28 glibc floor. Called by
# reusable-distributions.yml: as a dry run on every push to `main`, so a change
# needing a newer glibc symbol or a system library manylinux lacks fails on the
# commit that made it, and at release, where a failure withholds the release.
on:
  workflow_call:
    inputs:
      ref:
        description: "What to check out and build (blank = the calling run's own ref)"
        type: string
        required: false
        default: ""

jobs:
  build-linux-runtime-tarball:
    name: x86_64 Linux runtime tarball (manylinux_2_28)
    runs-on: ubuntu-latest
    # A release build of the engine from cold, plus glslc from source.
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # The bundled lavapipe takes minutes to build in manylinux; the staging
      # script reuses a build whose key matches, and these three files are the key.
      - name: Cache the Linux bundled Vulkan driver build
        uses: actions/cache@v5
        with:
          path: target/linux_bundled_vulkan_driver_cache
          key: linux-bundled-vulkan-driver-${{ hashFiles('scripts/stage_linux_bundled_vulkan_driver.sh', 'scripts/manylinux_2_28_image.sh', 'scripts/stage_macos_bundled_vulkan_driver.sh') }}

      - name: Build the tarball and run the portability gate over it
        run: bash scripts/build_linux_runtime_release_tarball.sh "$RUNNER_TEMP/linux-runtime-tarball"

      - name: The tarball starts a stream on machines with no Vulkan driver
        run: >-
          bash scripts/check_linux_runtime_tarball_on_a_machine_with_no_vulkan_driver.sh
          "$RUNNER_TEMP"/linux-runtime-tarball/tatolab-runtime-*-x86_64-linux.tar.gz

      - uses: actions/upload-artifact@v6
        with:
          name: linux-runtime-tarball
          path: ${{ runner.temp }}/linux-runtime-tarball/
          if-no-files-found: error
