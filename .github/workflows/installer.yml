name: Installer test

# install.sh against releases its test makes, for a user with a fresh home:
# an install that starts nothing, an upgrade under a running runtime keeping
# the build before, a download refused on its sha256 or a missing member, a
# third build pruning the oldest, macOS pointed at Tato Studio, and an
# uninstall that leaves the state directory.
on:
  pull_request:
    branches: [main]
    paths:
      - 'installer/**'
      - '.github/workflows/installer.yml'
  push:
    branches: [main]
    paths:
      - 'installer/**'
      - '.github/workflows/installer.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  install-sh-against-a-fake-release:
    name: Test installer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: shellcheck
        run: shellcheck -s sh installer/install.sh && shellcheck installer/tests/*.sh

      - name: install.sh against a fake release
        run: bash installer/tests/install_sh_against_a_fake_release.sh
