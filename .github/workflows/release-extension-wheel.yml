name: Release Extension Wheel

# One extension wheel per platform the runtime runs on — manylinux and Apple
# Silicon — built the way a third party would build one: its own standalone
# maturin project, its own lockfile, no engine crate linked. Both are kept as
# this run's `pypi-distribution-*` artifacts, which release-wheel.yml uploads
# to PyPI. Called once per extension by release-wheel.yml.
on:
  workflow_call:
    inputs:
      extension_package_directory:
        description: "The standalone maturin project to build, relative to the repo root"
        type: string
        required: true
      extension_distribution_name:
        description: "The distribution pip installs, e.g. tatolab-webrtc"
        type: string
        required: true
      extension_import_package_name:
        description: "The package the smoke test imports, e.g. tatolab.webrtc"
        type: string
        required: true
      ref:
        description: "What to check out and build (blank = the calling run's own ref)"
        type: string
        required: false
        default: ""
      tatolab_stream_distribution_artifact_name:
        description: "This run's artifact holding the tatolab-stream the release publishes beside the extension"
        type: string
        required: true

jobs:
  build-extension-wheel:
    name: ${{ matrix.platform }} wheel (${{ inputs.extension_distribution_name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read

    # Not fail-fast: a platform whose build fails is red on its own, and the
    # other platform's build still says whether it would have passed. Either
    # failing withholds the whole upload.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: manylinux
            runner: ubuntu-latest
          # Pinned for the reason macos-wheel.yml pins it: the image decides
          # the SDK the wheel links against.
          - platform: aarch64-apple-darwin
            runner: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # abi3-py310 and manylinux_2_28: an extension installs on machines this
      # project never sees, so one built artifact covers every interpreter from
      # the 3.10 floor `requires-python` promises and every glibc from 2.28. A
      # single build per platform rather than an interpreter matrix, for the
      # same reason.
      - name: Build the manylinux wheel
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          working-directory: ${{ inputs.extension_package_directory }}
          target: x86_64
          manylinux: 2_28
          args: --release --out dist
          # What `aws-lc-sys` needs to build the C cryptography
          # `web-transport-quinn` turns on unconditionally, plus libclang for
          # its bindgen fallback — and no python3-devel: an extension-module
          # wheel links no libpython, and installing those headers replaces the
          # image's python3 (3.12) with AlmaLinux's 3.6, which maturin refuses.
          #
          # A bounded, mirror-escaping install: `check-bounded-apt-install`
          # covers the apt family under .github/ and cannot reach a `dnf` inside
          # this container. The mode that costs is a *slow* mirror, not a
          # stalled one — a measured apt run fetched 35.6 MB at 48 kB/s over
          # 12m17s while every request made forward progress — so retries and
          # inactivity timeouts sit idle through it and only a wall-clock bound
          # detects it. AlmaLinux resolves a `mirrorlist=` per invocation, and
          # `dnf clean all` between attempts forces that re-resolution, so a
          # fresh attempt can land on a different host. 420s per attempt clears
          # the slowest setup phase on record (282s), and three attempts bound
          # the pathological case at ~21 min.
          before-script-linux: |
            set -euo pipefail
            dnf_attempt_timeout_seconds=420
            dnf_attempt_limit=3
            install_build_dependencies_with_bounded_retry() {
              for attempt in $(seq 1 "$dnf_attempt_limit"); do
                if timeout --kill-after=10s "${dnf_attempt_timeout_seconds}s" \
                  dnf install -y --setopt=retries=3 --setopt=timeout=30 "$@"; then
                  return 0
                fi
                echo "::warning::dnf attempt ${attempt} failed or blew the ${dnf_attempt_timeout_seconds}s bound; clearing the cache so the next attempt re-resolves the mirrorlist"
                dnf clean all >/dev/null 2>&1 || true
              done
              echo "::error::dnf install did not complete in ${dnf_attempt_limit} bounded attempts of ${dnf_attempt_timeout_seconds}s"
              return 1
            }
            install_build_dependencies_with_bounded_retry \
              pkgconfig clang-devel cmake ninja-build

      # The image ships both, which is all `aws-lc-sys` needs here.
      - name: The build tools the extension's native dependencies assume
        if: runner.os == 'macOS'
        run: |
          cmake --version
          cc --version

      - name: Install Rust
        if: runner.os == 'macOS'
        uses: dtolnay/rust-toolchain@stable

      # Also the interpreter the smoke test below installs into.
      - name: Install Python
        if: runner.os == 'macOS'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        if: runner.os == 'macOS'
        uses: astral-sh/setup-uv@v5

      # abi3-py310 at the engine wheel's macOS 15.0 floor. maturin writes
      # `macos-deployment-target` into the wheel's tag but does not hand it to
      # the link, so without this the binary inside claims whatever rustc
      # defaults to. Read from the one place it is pinned.
      - name: Export the wheel's deployment target
        if: runner.os == 'macOS'
        env:
          EXTENSION_PYPROJECT: ${{ inputs.extension_package_directory }}/pyproject.toml
        run: |
          python3 - >> "$GITHUB_ENV" <<'EOF'
          import os
          import tomllib
          with open(os.environ["EXTENSION_PYPROJECT"], "rb") as pyproject:
              maturin_target = tomllib.load(pyproject)["tool"]["maturin"]["target"]["aarch64-apple-darwin"]
          print(f"MACOSX_DEPLOYMENT_TARGET={maturin_target['macos-deployment-target']}")
          EOF

      - name: Build the aarch64-apple-darwin wheel
        if: runner.os == 'macOS'
        working-directory: ${{ inputs.extension_package_directory }}
        run: uvx maturin@1.9.6 build --release --out dist

      # An arm64 binary whose signature did not survive the zip round-trip
      # loads nowhere, so it is checked on the artifact rather than assumed.
      - name: Every binary in the built wheel is still signed
        if: runner.os == 'macOS'
        run: |
          rm -rf /tmp/unzipped-extension-wheel
          unzip -q "${{ inputs.extension_package_directory }}"/dist/*.whl -d /tmp/unzipped-extension-wheel
          find /tmp/unzipped-extension-wheel \( -name '*.so' -o -name '*.dylib' \) \
            -exec codesign --verify --strict --verbose=1 {} +

      - name: Collect the tatolab-stream this release publishes
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.tatolab_stream_distribution_artifact_name }}
          path: /tmp/tatolab-stream-distribution

      # A wheel that installs but cannot be imported is not a release artifact,
      # and licence obligations only discharge if the files reach the artifact a
      # user installs. Both are asserted against this build rather than trusted
      # from the test suite: that runs against `maturin develop`, while this is
      # a release build resolving PEP 639 globs that are symlinks out of the
      # project root.
      #
      # `--no-index` beside this run's `tatolab-stream`, which PyPI does not
      # hold until the upload: the extension's declared floor has to admit the
      # `tatolab-stream` published beside it.
      - name: The wheel installs beside this release's tatolab-stream, imports, and carries its notices
        env:
          EXTENSION_DISTRIBUTION_NAME: ${{ inputs.extension_distribution_name }}
          EXTENSION_IMPORT_PACKAGE_NAME: ${{ inputs.extension_import_package_name }}
        run: |
          python3 -m venv /tmp/extension-wheel-check
          /tmp/extension-wheel-check/bin/pip install \
            --no-index --find-links /tmp/tatolab-stream-distribution \
            "${{ inputs.extension_package_directory }}"/dist/*.whl
          # Read through importlib.metadata, so a file present in the repo and
          # absent from the wheel fails rather than passes.
          /tmp/extension-wheel-check/bin/python -c "
          import importlib
          import os
          from importlib.metadata import distribution

          distribution_name = os.environ['EXTENSION_DISTRIBUTION_NAME']
          shipped = distribution(distribution_name)
          for license_file_name in ('LICENSE', 'THIRD-PARTY-NOTICES.md'):
              text = shipped.read_text('licenses/' + license_file_name) or ''
              assert text.strip(), license_file_name + ' is absent from .dist-info/licenses/'

          extension = importlib.import_module(os.environ['EXTENSION_IMPORT_PACKAGE_NAME'])
          exported = list(getattr(extension, '__all__', []))
          assert exported, distribution_name + ' exports no processor classes'
          for name in exported:
              getattr(extension, name)
          print(distribution_name, 'exports', ', '.join(exported))
          "

      # release-wheel.yml uploads every `pypi-distribution-*` artifact of the run.
      - name: Keep the wheel for the upload
        uses: actions/upload-artifact@v4
        with:
          name: pypi-distribution-${{ inputs.extension_distribution_name }}-${{ matrix.platform }}
          path: ${{ inputs.extension_package_directory }}/dist/*.whl
          if-no-files-found: error
