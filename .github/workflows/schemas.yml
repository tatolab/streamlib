name: Control-plane client

# Generates the TypeScript client for the control plane's REST surface from the
# api-server's OpenAPI spec. Not called on release: nothing consumes what it
# publishes today, so it stays dispatch-only until a consumer exists.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  generate-and-publish:
    name: Generate & Publish Control-plane Client
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # generate_openapi links the api-server, which pulls in streamlib-engine;
      # its build.rs compiles GLSL with glslc and links Vulkan, its dependency
      # iceoryx2-pal-posix runs bindgen — which needs libclang and clang's
      # builtin headers — and the audio path links opus. Mirrors test.yml's
      # Linux engine dep set.
      # `cmake` builds the engine's vendored GLSL compiler (shaderc, taken
      # `build-from-source`). Explicit rather than leaning on the runner image
      # having it, whose contents move between releases.
      - name: Install system dependencies
        timeout-minutes: 12
        uses: ./.github/actions/install-linux-engine-build-dependencies
        with:
          packages: >-
            pkg-config
            protobuf-compiler
            libclang1-18
            libclang-common-18-dev
            libvulkan-dev
            glslc
            cmake
            libopus-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@tatolab'

      # Dispatch-only, so it restores whatever main last saved rather than
      # minting an entry of its own — the repo cache was over GitHub's 10 GB cap
      # and every save evicted a live entry.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: wheel
          save-if: false

      - name: Get version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep 'version = ' Cargo.toml | head -1 | sed 's/.*version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Generate OpenAPI spec
        run: |
          cargo run --bin generate_openapi
          python3 -m json.tool dist/schemas/openapi.json > /dev/null && echo "✓ OpenAPI spec is valid JSON" || { echo "✗ OpenAPI spec is INVALID"; exit 1; }

      - name: Create package directory
        run: mkdir -p dist/streamlib-client/src

      - name: Install the OpenAPI type generator
        # Pinned: this job publishes a package, so an upstream release must not
        # silently change the generated output between two dispatches of the
        # same commit.
        run: npm install -g openapi-typescript@7.9.1

      - name: Generate API client from OpenAPI
        run: |
          echo "// Auto-generated from OpenAPI spec - DO NOT EDIT" > dist/streamlib-client/src/api-types.ts
          echo "// Generated at: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> dist/streamlib-client/src/api-types.ts
          echo "// Version: ${{ steps.version.outputs.version }}" >> dist/streamlib-client/src/api-types.ts
          echo "" >> dist/streamlib-client/src/api-types.ts
          openapi-typescript dist/schemas/openapi.json >> dist/streamlib-client/src/api-types.ts

      - name: Create package index
        run: |
          cat > dist/streamlib-client/src/index.ts << 'EOF'
          // @tatolab/streamlib-client
          // Auto-generated TypeScript client for StreamLib Runtime API
          // DO NOT EDIT - This file is auto-generated

          // OpenAPI-generated API types
          export type * from './api-types';

          // Re-export paths and components for openapi-fetch usage
          export type { paths, components, operations } from './api-types';
          EOF

      - name: Create package.json
        run: |
          cat > dist/streamlib-client/package.json << EOF
          {
            "name": "@tatolab/streamlib-client",
            "version": "${{ steps.version.outputs.version }}",
            "description": "TypeScript client for the StreamLib Runtime control-plane API, generated from its OpenAPI spec",
            "main": "dist/index.js",
            "module": "dist/index.mjs",
            "types": "dist/index.d.ts",
            "exports": {
              ".": {
                "import": "./dist/index.mjs",
                "require": "./dist/index.js",
                "types": "./dist/index.d.ts"
              },
              "./api-types": {
                "import": "./dist/api-types.mjs",
                "require": "./dist/api-types.js",
                "types": "./dist/api-types.d.ts"
              }
            },
            "files": [
              "dist",
              "src"
            ],
            "repository": {
              "type": "git",
              "url": "git+https://github.com/tatolab/streamlib.git",
              "directory": "dist/streamlib-client"
            },
            "publishConfig": {
              "registry": "https://npm.pkg.github.com"
            },
            "keywords": [
              "streamlib",
              "typescript",
              "api-client",
              "openapi"
            ],
            "author": "Jonathan Fontanez",
            "license": "BUSL-1.1",
            "devDependencies": {
              "typescript": "^5.0.0",
              "tsup": "^8.0.0"
            }
          }
          EOF

      - name: Create tsconfig.json
        run: |
          cat > dist/streamlib-client/tsconfig.json << 'EOF'
          {
            "compilerOptions": {
              "target": "ES2020",
              "module": "ESNext",
              "moduleResolution": "bundler",
              "declaration": true,
              "declarationMap": true,
              "sourceMap": true,
              "strict": true,
              "esModuleInterop": true,
              "skipLibCheck": true,
              "outDir": "dist"
            },
            "include": ["src/**/*"]
          }
          EOF

      - name: Create tsup config
        run: |
          cat > dist/streamlib-client/tsup.config.ts << 'EOF'
          import { defineConfig } from 'tsup';

          export default defineConfig({
            entry: ['src/index.ts', 'src/api-types.ts'],
            format: ['cjs', 'esm'],
            dts: true,
            splitting: false,
            sourcemap: true,
            clean: true,
          });
          EOF

      - name: Build package
        working-directory: dist/streamlib-client
        run: |
          npm install
          npx tsup

      - name: Show generated files
        run: |
          echo "=== Package structure ==="
          find dist/streamlib-client -type f | head -30
          echo ""
          echo "=== api-types.ts preview ==="
          head -50 dist/streamlib-client/src/api-types.ts

      - name: Publish to GitHub Packages
        working-directory: dist/streamlib-client
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: streamlib-client-v${{ steps.version.outputs.version }}
          path: |
            dist/schemas/
            dist/streamlib-client/
          retention-days: 90
