name: Distributions

# The release channel: release-please cuts a GitHub release, and this publishes
# `tatolab-stream` and every first-party extension to PyPI at that release's
# version. A stream's venv takes them from PyPI like any other dependency. The
# engine wheel is not published: a processor interpreter borrows the runtime
# from the runtime unit's lend, so no stream's venv installs it.
#
# The runtime itself ships as the Linux runtime tarball, attached to the GitHub
# release and served with install.sh from get.tatolab.com.
#
# Every distribution carries the repository's one version and releases on its
# one tag, and the PyPI upload waits for every one of them, for the macOS proof
# of the runtime unit, for the Linux runtime tarball and for the credentials
# that publish it, so nothing uploads unless everything built. The Linux runtime
# publishes after PyPI, because a stream it scaffolds locks the
# `tatolab-stream` PyPI holds. It still publishes when PyPI refused only a
# first upload of a new project name, which no scaffold locks; a failed Linux
# publish is recovered by re-running the original run's failed
# publish-linux-runtime job, which uploads the tarball that run built again and
# overwrites a partial upload.
#
# Called from release.yml rather than triggered by `on: release`:
# release-please runs on the default GITHUB_TOKEN, and GitHub does not start
# workflow runs from events that token raises. An `on: release` trigger here
# would simply never fire.
#
# Only a run whose `dry_run` is false uploads. release-please's call passes
# false; every other run is a dry run unless dispatched with `dry_run` unticked,
# which is how a release whose distributions were never built or uploaded is
# published by hand. A partially failed upload is recovered by re-running the
# original run's failed publish-to-pypi job instead: a new dispatch rebuilds the
# extension wheels, whose compiled `_native` differs byte for byte from the
# files PyPI already holds, so their upload fails on a hash mismatch. A dry run
# builds and checks every distribution and stops short of PyPI.
on:
  workflow_call:
    inputs:
      tag_name:
        description: "Release tag to build and publish"
        type: string
        required: false
        default: ""
      dry_run:
        description: "Build and check every distribution without uploading"
        type: boolean
        required: false
        default: true
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to build (blank = the ref this run was dispatched on; an upload needs one)"
        type: string
        required: false
      dry_run:
        description: "Build and check every distribution without uploading"
        type: boolean
        required: false
        default: true

env:
  # The uv that builds, locks and uploads every distribution.
  PINNED_UV_VERSION: "0.12.23"

jobs:
  build-tatolab-stream-distribution:
    name: tatolab-stream wheel and sdist
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag_name }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.PINNED_UV_VERSION }}

      # Pure Python, so this one wheel serves every platform a stream runs on.
      # uv builds the sdist first and the wheel from it, so a file the sdist
      # drops is missing from the wheel too.
      - name: Build the tatolab-stream wheel and sdist
        run: uv build --out-dir sdk/tatolab-stream/dist sdk/tatolab-stream

      # PEP 420: `tatolab` is a namespace package. A regular `tatolab/__init__.py`
      # would shadow every other distribution's `tatolab.*` portion installed
      # beside it, and `tatolab/runtime/` is the lend's, never a stream venv's.
      # Each listing is required to name the stream package's `__init__.py`, so
      # a distribution missing it, or an empty or unreadable listing, fails
      # rather than passing.
      - name: The wheel and the sdist ship tatolab as a namespace package
        run: |
          set -euo pipefail
          unzip -Z1 sdk/tatolab-stream/dist/*.whl > /tmp/stream-wheel-member-names.txt
          # An sdist's members sit under its `<name>-<version>/` directory.
          tar -tzf sdk/tatolab-stream/dist/*.tar.gz | sed 's|^[^/]*/||' \
            > /tmp/stream-sdist-member-names.txt
          for member_names in /tmp/stream-wheel-member-names.txt /tmp/stream-sdist-member-names.txt; do
            if ! grep -qx 'tatolab/stream/__init__.py' "$member_names"; then
              echo "::error::$member_names does not list tatolab/stream/__init__.py"
              exit 1
            fi
            if grep -q '^tatolab/runtime/' "$member_names"; then
              echo "::error::$member_names lists tatolab/runtime/, which is the lend's and never a stream venv's"
              exit 1
            fi
            if grep -qx 'tatolab/__init__.py' "$member_names"; then
              echo "::error::$member_names lists tatolab/__init__.py — tatolab must stay a PEP 420 namespace package"
              exit 1
            fi
          done

      # What a user's `uv sync` gives a scaffolded stream: this run's
      # `tatolab-stream` and the numpy the scaffold declares, and nothing of
      # the runtime. Importing a node runs its decorator and boots no engine, so
      # this needs no GPU. The project is the scaffold template the runtime
      # embeds and writes on `tatolab new`, laid out as it writes it, so no
      # runtime has to be running here.
      - name: A scaffolded stream's nodes import beside this run's tatolab-stream
        run: |
          python3 -m venv /tmp/scaffold-venv
          # `--no-index` keeps `tatolab-stream` to this run's build, so its one
          # dependency comes from PyPI first.
          /tmp/scaffold-venv/bin/pip install 'msgpack>=1.0'
          /tmp/scaffold-venv/bin/pip install --no-index --find-links sdk/tatolab-stream/dist tatolab-stream
          /tmp/scaffold-venv/bin/pip install 'numpy>=2.1'
          # BUSL-1.1's parameters are in its text, not its SPDX id, so the text
          # has to reach what a user installs. Read through importlib.metadata,
          # so a licence present in the checkout and absent from the wheel fails.
          /tmp/scaffold-venv/bin/python -c "
          from importlib.metadata import distribution
          license_text = distribution('tatolab-stream').read_text('licenses/LICENSE') or ''
          assert 'Business Source License' in license_text, 'LICENSE is absent from .dist-info/licenses/'
          "

          cp -R sdk/tatolab-stream/scaffold_template /tmp/scaffold-check
          mv /tmp/scaffold-check/python-version /tmp/scaffold-check/.python-version
          mv /tmp/scaffold-check/gitignore /tmp/scaffold-check/.gitignore
          test -f /tmp/scaffold-check/stream.py
          test -f /tmp/scaffold-check/nodes/halftone_lens_effect.py
          test -f /tmp/scaffold-check/nodes/brightness_meter.py
          # A node class in the entry file identifies as `__main__:<Type>`
          # and is a wiring error: the entry runs as `__main__`, and the child
          # interpreter that runs the node imports the class by name.
          # An explicit `if`, not `! grep` — `set -e` does not abort on a
          # command whose status is inverted with `!`, so the negated form
          # could never have failed this step.
          if grep -q '@node' /tmp/scaffold-check/stream.py; then
            echo "::error::the scaffold put a node class in stream.py — it would identify as __main__:<Type>"
            exit 1
          fi
          cd /tmp/scaffold-check && /tmp/scaffold-venv/bin/python -c '
          from nodes.brightness_meter import BrightnessMeter
          from nodes.halftone_lens_effect import HalftoneLensEffect
          '

      # Every `pypi-distribution-*` artifact of this run is what publish-to-pypi
      # uploads.
      - name: Keep the distributions for the upload
        uses: actions/upload-artifact@v6
        with:
          name: pypi-distribution-tatolab-stream
          path: |
            sdk/tatolab-stream/dist/*.whl
            sdk/tatolab-stream/dist/*.tar.gz
          if-no-files-found: error

  # An extension is a standalone project built from the same ref. A named block
  # rather than a matrix over a JSON array: an empty `include` is a matrix
  # expansion failure, and a second extension is one more block like this one.
  # Its install check resolves `tatolab-stream` from this run's distribution,
  # which is why it waits for it.
  build-tatolab-webrtc-distribution:
    needs: build-tatolab-stream-distribution
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-extension-wheel.yml
    with:
      extension_package_directory: packages/streamlib-webrtc
      extension_distribution_name: tatolab-webrtc
      extension_import_package_name: tatolab.webrtc
      ref: ${{ inputs.tag_name }}
      tatolab_stream_distribution_artifact_name: pypi-distribution-tatolab-stream

  build-tatolab-microphone-distribution:
    needs: build-tatolab-stream-distribution
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-extension-wheel.yml
    with:
      extension_package_directory: packages/tatolab-microphone
      extension_distribution_name: tatolab-microphone
      extension_import_package_name: tatolab.microphone
      ref: ${{ inputs.tag_name }}
      tatolab_stream_distribution_artifact_name: pypi-distribution-tatolab-stream

  build-tatolab-speaker-distribution:
    needs: build-tatolab-stream-distribution
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-extension-wheel.yml
    with:
      extension_package_directory: packages/tatolab-speaker
      extension_distribution_name: tatolab-speaker
      extension_import_package_name: tatolab.speaker
      ref: ${{ inputs.tag_name }}
      tatolab_stream_distribution_artifact_name: pypi-distribution-tatolab-stream

  # The codec modules: the scaffold depends on tatolab-h264, and tatolab-h265 is
  # its H.265 twin.
  build-tatolab-h264-distribution:
    needs: build-tatolab-stream-distribution
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-extension-wheel.yml
    with:
      extension_package_directory: packages/streamlib-h264
      extension_distribution_name: tatolab-h264
      extension_import_package_name: tatolab.h264
      ref: ${{ inputs.tag_name }}
      tatolab_stream_distribution_artifact_name: pypi-distribution-tatolab-stream
      extension_build_needs_the_slang_compiler: true

  build-tatolab-h265-distribution:
    needs: build-tatolab-stream-distribution
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-extension-wheel.yml
    with:
      extension_package_directory: packages/streamlib-h265
      extension_distribution_name: tatolab-h265
      extension_import_package_name: tatolab.h265
      ref: ${{ inputs.tag_name }}
      tatolab_stream_distribution_artifact_name: pypi-distribution-tatolab-stream
      extension_build_needs_the_slang_compiler: true

  # A user's `uv sync` resolves `tatolab-stream`, `tatolab-h264` and
  # `tatolab-testpattern` from PyPI,
  # where every earlier release is a candidate. This run's distributions are not
  # there yet, so they join PyPI as find-links, and the scaffold must lock the
  # ones just built — a scaffold that capped a version or named another index
  # would lock something else.
  lock-the-scaffold-against-this-runs-distributions:
    name: A scaffolded stream locks the distributions this run built
    needs:
      - build-tatolab-stream-distribution
      - build-tatolab-h264-distribution
      - build-tatolab-testpattern-distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag_name }}
          persist-credentials: false
          sparse-checkout: sdk/tatolab-stream

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.PINNED_UV_VERSION }}

      - name: Collect the tatolab-stream, tatolab-h264 and tatolab-testpattern this run built
        uses: actions/download-artifact@v7
        with:
          pattern: pypi-distribution-tatolab-{stream,h264-*,testpattern}
          path: /tmp/this-runs-distributions
          merge-multiple: true

      - name: The scaffold locks this run's tatolab-stream, tatolab-h264 and tatolab-testpattern
        run: |
          set -euo pipefail
          cp -R sdk/tatolab-stream/scaffold_template /tmp/scaffold-check
          (cd /tmp/scaffold-check && UV_FIND_LINKS=/tmp/this-runs-distributions uv lock)
          built_version="$(python3 -c "
          import tomllib
          print(tomllib.load(open('sdk/tatolab-stream/pyproject.toml', 'rb'))['project']['version'])
          ")"
          for distribution_name in tatolab-stream tatolab-h264 tatolab-testpattern; do
            locked_version="$(python3 - "$distribution_name" <<'EOF'
          import sys
          import tomllib
          lock = tomllib.load(open('/tmp/scaffold-check/uv.lock', 'rb'))
          print(next(package['version'] for package in lock['package'] if package['name'] == sys.argv[1]))
          EOF
            )"
            if [ "$locked_version" != "$built_version" ]; then
              echo "::error::a scaffolded stream locks $distribution_name $locked_version, not the $built_version this run built"
              exit 1
            fi
          done

  # Linux and macOS: V4L2 and AVFoundation.
  build-tatolab-camera-distribution:
    needs: build-tatolab-stream-distribution
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-extension-wheel.yml
    with:
      extension_package_directory: packages/tatolab-camera
      extension_distribution_name: tatolab-camera
      extension_import_package_name: tatolab.camera
      ref: ${{ inputs.tag_name }}
      tatolab_stream_distribution_artifact_name: pypi-distribution-tatolab-stream

  # Linux only. build.rs fetches rive-runtime with git and builds it with
  # clang; premake needs libuuid's headers.
  build-tatolab-rive-distribution:
    needs: build-tatolab-stream-distribution
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-extension-wheel.yml
    with:
      extension_package_directory: packages/tatolab-rive
      extension_distribution_name: tatolab-rive
      extension_import_package_name: tatolab.rive
      ref: ${{ inputs.tag_name }}
      tatolab_stream_distribution_artifact_name: pypi-distribution-tatolab-stream
      extension_build_needs_the_shader_compilers: true
      extension_build_extra_dnf_packages: clang git libuuid-devel
      extension_builds_for_macos: false

  # Pure Python, so one wheel serves every platform. A wheel only, as for every
  # extension: an sdist would archive LICENSE as the symlink it is here.
  build-tatolab-compositor-distribution:
    name: tatolab-compositor wheel
    needs: build-tatolab-stream-distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag_name }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.PINNED_UV_VERSION }}

      - name: Build the tatolab-compositor wheel
        run: uv build --wheel --out-dir packages/tatolab-compositor/dist packages/tatolab-compositor

      - name: Collect the tatolab-stream this release publishes
        uses: actions/download-artifact@v7
        with:
          name: pypi-distribution-tatolab-stream
          path: /tmp/tatolab-stream-distribution

      # `--no-index` beside this run's `tatolab-stream`, which PyPI does not
      # hold until the upload, so the declared floor has to admit it.
      - name: The wheel installs beside this release's tatolab-stream, imports, and carries its licence
        run: |
          python3 -m venv /tmp/compositor-wheel-check
          /tmp/compositor-wheel-check/bin/pip install 'msgpack>=1.0'
          /tmp/compositor-wheel-check/bin/pip install \
            --no-index --find-links /tmp/tatolab-stream-distribution \
            packages/tatolab-compositor/dist/*.whl
          /tmp/compositor-wheel-check/bin/python -c "
          from importlib.metadata import distribution, entry_points
          license_text = distribution('tatolab-compositor').read_text('licenses/LICENSE') or ''
          assert 'Business Source License' in license_text, 'LICENSE is absent from .dist-info/licenses/'
          node_entry_points = [
              node_entry_point for node_entry_point in entry_points(group='tatolab.nodes')
              if node_entry_point.dist.name == 'tatolab-compositor'
          ]
          assert node_entry_points, 'tatolab-compositor registers no node'
          for node_entry_point in node_entry_points:
              print('tatolab-compositor exports', node_entry_point.name, node_entry_point.load())
          "

      - name: Keep the wheel for the upload
        uses: actions/upload-artifact@v6
        with:
          name: pypi-distribution-tatolab-compositor
          path: packages/tatolab-compositor/dist/*.whl
          if-no-files-found: error

  # Pure Python, so one wheel serves every platform, and it ships as a namespace
  # portion of `tatolab` beside the stream package. A wheel only, as for every
  # extension: an sdist would archive LICENSE as the symlink it is here.
  build-tatolab-testpattern-distribution:
    name: tatolab-testpattern wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag_name }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.PINNED_UV_VERSION }}

      - name: Build the tatolab-testpattern wheel
        run: uv build --wheel --out-dir packages/tatolab-testpattern/dist packages/tatolab-testpattern

      # The kernel source and the two baked overlays are read from the package
      # at setup, so a wheel without them builds a node that cannot render.
      - name: The wheel ships the kernel, the overlays, its licence and no tatolab/__init__.py
        run: |
          set -euo pipefail
          unzip -Z1 packages/tatolab-testpattern/dist/*.whl > /tmp/testpattern-wheel-member-names.txt
          for required_member in \
            tatolab/testpattern/__init__.py \
            tatolab/testpattern/test_pattern_frame.slang \
            tatolab/testpattern/potato_sprite_160x160.rgba \
            tatolab/testpattern/sample_stream_captions_548x62.rgba; do
            if ! grep -qx "$required_member" /tmp/testpattern-wheel-member-names.txt; then
              echo "::error::the tatolab-testpattern wheel does not list $required_member"
              exit 1
            fi
          done
          if ! grep -q '\.dist-info/licenses/LICENSE$' /tmp/testpattern-wheel-member-names.txt; then
            echo "::error::the tatolab-testpattern wheel carries no LICENSE in .dist-info/licenses/"
            exit 1
          fi
          if grep -qx 'tatolab/__init__.py' /tmp/testpattern-wheel-member-names.txt; then
            echo "::error::the tatolab-testpattern wheel lists tatolab/__init__.py — tatolab must stay a PEP 420 namespace package"
            exit 1
          fi

      - name: Keep the wheel for the upload
        uses: actions/upload-artifact@v6
        with:
          name: pypi-distribution-tatolab-testpattern
          path: packages/tatolab-testpattern/dist/*.whl
          if-no-files-found: error

  # Linux only at run time — both of its doors are Linux's — so a manylinux
  # wheel only.
  build-tatolab-virtualcamera-distribution:
    needs: build-tatolab-stream-distribution
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-extension-wheel.yml
    with:
      extension_package_directory: packages/tatolab-virtualcamera
      extension_distribution_name: tatolab-virtualcamera
      extension_import_package_name: tatolab.virtualcamera
      ref: ${{ inputs.tag_name }}
      tatolab_stream_distribution_artifact_name: pypi-distribution-tatolab-stream
      extension_builds_for_macos: false

  build-tatolab-opus-distribution:
    needs: build-tatolab-stream-distribution
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-extension-wheel.yml
    with:
      extension_package_directory: packages/tatolab-opus
      extension_distribution_name: tatolab-opus
      extension_import_package_name: tatolab.opus
      ref: ${{ inputs.tag_name }}
      tatolab_stream_distribution_artifact_name: pypi-distribution-tatolab-stream

  build-tatolab-moq-distribution:
    needs: build-tatolab-stream-distribution
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-extension-wheel.yml
    with:
      extension_package_directory: packages/tatolab-moq
      extension_distribution_name: tatolab-moq
      extension_import_package_name: tatolab.moq
      ref: ${{ inputs.tag_name }}
      tatolab_stream_distribution_artifact_name: pypi-distribution-tatolab-stream

  # The node side of a web page source: its wheel carries no browser, which is
  # the shared browser host the runtime unit ships.
  build-tatolab-browser-distribution:
    needs: build-tatolab-stream-distribution
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-extension-wheel.yml
    with:
      extension_package_directory: packages/tatolab-browser
      extension_distribution_name: tatolab-browser
      extension_import_package_name: tatolab.browser
      ref: ${{ inputs.tag_name }}
      tatolab_stream_distribution_artifact_name: pypi-distribution-tatolab-stream
      extension_builds_for_macos: false

  # macOS is a supported floor, so a macOS-only regression in the runtime unit
  # blocks the release exactly as a Linux one does, though nothing it builds is
  # uploaded.
  prove-the-runtime-unit-on-macos:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-macos-runtime-unit.yml
    with:
      ref: ${{ inputs.tag_name }}

  build-linux-runtime-tarball:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-linux-runtime-tarball.yml
    with:
      ref: ${{ inputs.tag_name }}

  # The stream `tatolab new` scaffolds imports `tatolab.h264` and
  # `tatolab.testpattern`, so the machines are given the distributions this run
  # built, as a user's `uv sync` would.
  check-the-linux-runtime-tarball-on-machines-with-no-vulkan-driver:
    name: The Linux runtime tarball starts a stream on machines with no Vulkan driver
    needs:
      - build-linux-runtime-tarball
      - build-tatolab-h264-distribution
      - build-tatolab-testpattern-distribution
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag_name }}
          persist-credentials: false

      - name: Collect the tarball this run built
        uses: actions/download-artifact@v7
        with:
          name: linux-runtime-tarball
          path: ${{ runner.temp }}/linux-runtime-tarball

      - name: Collect the manylinux tatolab-h264 wheel this run built
        uses: actions/download-artifact@v7
        with:
          name: pypi-distribution-tatolab-h264-manylinux
          path: ${{ runner.temp }}/first-party-module-distributions

      - name: Collect the tatolab-testpattern distribution this run built
        uses: actions/download-artifact@v7
        with:
          name: pypi-distribution-tatolab-testpattern
          path: ${{ runner.temp }}/first-party-module-distributions

      - name: The tarball starts a stream on machines with no Vulkan driver
        run: >-
          bash scripts/check_linux_runtime_tarball_on_a_machine_with_no_vulkan_driver.sh
          "$RUNNER_TEMP"/linux-runtime-tarball/tatolab-runtime-*-x86_64-linux.tar.gz
          "$RUNNER_TEMP/first-party-module-distributions"

  # Before PyPI takes anything: an upload whose Linux runtime could not then be
  # published would leave the release half out.
  check-the-linux-runtime-can-be-published:
    name: The Linux runtime's upload credentials reach this repository
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every credential the get.tatolab.com upload uses is set
        env:
          CLOUDFLARE_R2_GET_TATOLAB_COM_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_GET_TATOLAB_COM_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_GET_TATOLAB_COM_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_GET_TATOLAB_COM_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for required_secret in CLOUDFLARE_R2_GET_TATOLAB_COM_ACCESS_KEY_ID \
            CLOUDFLARE_R2_GET_TATOLAB_COM_SECRET_ACCESS_KEY CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!required_secret}" ]; then
              echo "::error::$required_secret does not reach this repository — add it to Infisical's prod environment, which syncs it to the organization's secrets"
              exit 1
            fi
          done

  publish-to-pypi:
    name: Publish to PyPI
    # A dry run skips the credentials check, and runs this regardless.
    if: ${{ !cancelled() && !failure() }}
    outputs:
      pypi_refused_only_new_project_names: ${{ steps.upload.outputs.pypi_refused_only_new_project_names }}
    needs:
      - build-tatolab-stream-distribution
      - build-tatolab-webrtc-distribution
      - build-tatolab-microphone-distribution
      - build-tatolab-speaker-distribution
      - build-tatolab-opus-distribution
      - build-tatolab-moq-distribution
      - build-tatolab-browser-distribution
      - build-tatolab-testpattern-distribution
      - build-tatolab-virtualcamera-distribution
      - build-tatolab-h264-distribution
      - build-tatolab-h265-distribution
      - build-tatolab-camera-distribution
      - build-tatolab-rive-distribution
      - build-tatolab-compositor-distribution
      - lock-the-scaffold-against-this-runs-distributions
      - prove-the-runtime-unit-on-macos
      - build-linux-runtime-tarball
      - check-the-linux-runtime-tarball-on-machines-with-no-vulkan-driver
      - check-the-linux-runtime-can-be-published
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.PINNED_UV_VERSION }}
          # No checkout and nothing to resolve, so nothing to cache.
          enable-cache: false

      - name: Collect every distribution this run built
        uses: actions/download-artifact@v7
        with:
          pattern: pypi-distribution-*
          path: dist
          merge-multiple: true

      # PyPI never takes a file name twice, so a distribution uploaded at the
      # wrong version cannot be replaced by the right one.
      - name: Every distribution carries the release's version
        if: inputs.tag_name != ''
        env:
          RELEASE_TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG_NAME#v}"
          for distribution_path in dist/*; do
            distribution_file_name="$(basename "$distribution_path")"
            # The version is the second `-`-separated field of a wheel's or an
            # sdist's file name; the name before it is normalized to underscores.
            distribution_version="$(echo "${distribution_file_name%.tar.gz}" | cut -d- -f2)"
            if [ "$distribution_version" != "$release_version" ]; then
              echo "::error::$distribution_file_name is version $distribution_version, not the $release_version $RELEASE_TAG_NAME releases"
              exit 1
            fi
          done
          ls -l dist

      - name: An upload names the release it publishes
        if: ${{ !inputs.dry_run && inputs.tag_name == '' }}
        run: |
          echo "::error::an upload to PyPI publishes a release — name its tag in tag_name"
          exit 1

      # Reads every file's metadata as the upload would, and uploads nothing.
      - name: Check every distribution without uploading
        if: inputs.dry_run
        run: uv publish --dry-run --trusted-publishing never dist/*

      # `--check-url` skips a file PyPI already holds byte for byte, so re-running
      # this job in the original run after a partial upload sends only the rest;
      # a rebuilt distribution differs and fails on a hash mismatch.
      #
      # One file at a time, carrying on past a refusal: PyPI rate-limits the
      # creation of new project names (`429 Too many new projects created`), and
      # a first release of a new distribution must not hold back every
      # distribution PyPI already has. The job still fails, naming each refused
      # file, so a re-run sends what is left.
      - name: Upload every distribution to PyPI
        id: upload
        if: ${{ !inputs.dry_run }}
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set -o pipefail
          refused_distribution_files=()
          pypi_refused_only_new_project_names=true
          upload_output_path="$RUNNER_TEMP/uv-publish-output"
          for distribution_path in dist/*; do
            if ! uv publish --trusted-publishing never --check-url https://pypi.org/simple/ "$distribution_path" 2>&1 | tee "$upload_output_path"; then
              refused_distribution_files+=("$(basename "$distribution_path")")
              if ! grep -q "Too many new projects created" "$upload_output_path"; then
                pypi_refused_only_new_project_names=false
              fi
            fi
          done
          echo "pypi_refused_only_new_project_names=$pypi_refused_only_new_project_names" >> "$GITHUB_OUTPUT"
          if [ "${#refused_distribution_files[@]}" -gt 0 ]; then
            for refused_distribution_file in "${refused_distribution_files[@]}"; do
              echo "::error::PyPI did not take $refused_distribution_file; re-run this job to send it"
            done
            exit 1
          fi

  # Versioned files first and `latest` last, so an install that reads `latest`
  # always finds the tarball it names.
  publish-linux-runtime:
    name: Publish the Linux runtime
    needs:
      - publish-to-pypi
      - build-linux-runtime-tarball
    if: >-
      ${{ !cancelled()
      && needs.build-linux-runtime-tarball.result == 'success'
      && (needs.publish-to-pypi.result == 'success'
      || (needs.publish-to-pypi.result == 'failure'
      && needs.publish-to-pypi.outputs.pypi_refused_only_new_project_names == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GET_TATOLAB_COM_BUCKET: get-tatolab-com
      GET_TATOLAB_COM_URL: https://get.tatolab.com

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag_name }}
          persist-credentials: false
          sparse-checkout: installer
          sparse-checkout-cone-mode: false

      - name: Collect the tarball this run built
        uses: actions/download-artifact@v7
        with:
          name: linux-runtime-tarball
          path: linux-runtime-tarball

      - name: The tarball carries the release's version
        id: tarball
        env:
          RELEASE_TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          tarball_path="$(ls linux-runtime-tarball/tatolab-runtime-*-x86_64-linux.tar.gz)"
          tarball_name="$(basename "$tarball_path")"
          tarball_version="${tarball_name#tatolab-runtime-}"
          tarball_version="${tarball_version%-x86_64-linux.tar.gz}"
          if [ -n "$RELEASE_TAG_NAME" ] && [ "$tarball_version" != "${RELEASE_TAG_NAME#v}" ]; then
            echo "::error::$tarball_name is version $tarball_version, not the ${RELEASE_TAG_NAME#v} $RELEASE_TAG_NAME releases"
            exit 1
          fi
          (cd linux-runtime-tarball && sha256sum --check "$tarball_name.sha256")
          echo "name=$tarball_name" >> "$GITHUB_OUTPUT"
          echo "version=$tarball_version" >> "$GITHUB_OUTPUT"

      - name: An upload names the release it publishes
        if: ${{ !inputs.dry_run && inputs.tag_name == '' }}
        run: |
          echo "::error::publishing the Linux runtime publishes a release — name its tag in tag_name"
          exit 1

      - name: What a publish would upload
        if: inputs.dry_run
        env:
          TARBALL_NAME: ${{ steps.tarball.outputs.name }}
          TARBALL_VERSION: ${{ steps.tarball.outputs.version }}
        run: |
          echo "the GitHub release: $TARBALL_NAME, $TARBALL_NAME.sha256"
          echo "s3://$GET_TATOLAB_COM_BUCKET/releases/$TARBALL_VERSION/: $TARBALL_NAME, $TARBALL_NAME.sha256"
          echo "s3://$GET_TATOLAB_COM_BUCKET/: install.sh, latest = $TARBALL_VERSION"

      - name: Attach the tarball to the GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG_NAME: ${{ inputs.tag_name }}
          TARBALL_NAME: ${{ steps.tarball.outputs.name }}
        run: >-
          gh release upload "$RELEASE_TAG_NAME" --clobber
          "linux-runtime-tarball/$TARBALL_NAME"
          "linux-runtime-tarball/$TARBALL_NAME.sha256"

      # R2 through its S3 API, with a token scoped to this one bucket. The
      # checksum settings are the ones Cloudflare's R2 docs give for the AWS CLI,
      # whose default checksums R2 does not accept.
      - name: Serve the tarball, install.sh and latest from get.tatolab.com
        if: ${{ !inputs.dry_run }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_GET_TATOLAB_COM_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_GET_TATOLAB_COM_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARBALL_NAME: ${{ steps.tarball.outputs.name }}
          TARBALL_VERSION: ${{ steps.tarball.outputs.version }}
        run: |
          set -euo pipefail
          r2_endpoint="https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"
          put_object() {
            aws s3 cp --endpoint-url "$r2_endpoint" --only-show-errors \
              --content-type "$3" --cache-control "$4" "$1" "s3://$GET_TATOLAB_COM_BUCKET/$2"
          }
          put_object "linux-runtime-tarball/$TARBALL_NAME" \
            "releases/$TARBALL_VERSION/$TARBALL_NAME" application/gzip "public, max-age=31536000, immutable"
          put_object "linux-runtime-tarball/$TARBALL_NAME.sha256" \
            "releases/$TARBALL_VERSION/$TARBALL_NAME.sha256" "text/plain; charset=utf-8" "public, max-age=31536000, immutable"
          put_object installer/install.sh install.sh "text/plain; charset=utf-8" "public, max-age=300"
          printf '%s\n' "$TARBALL_VERSION" > latest
          put_object latest latest "text/plain; charset=utf-8" "public, max-age=300"

      - name: get.tatolab.com serves the release
        if: ${{ !inputs.dry_run }}
        env:
          TARBALL_NAME: ${{ steps.tarball.outputs.name }}
          TARBALL_VERSION: ${{ steps.tarball.outputs.version }}
        run: |
          set -euo pipefail
          served_sha256="$(curl -fsSL "$GET_TATOLAB_COM_URL/releases/$TARBALL_VERSION/$TARBALL_NAME" | sha256sum | cut -d ' ' -f 1)"
          built_sha256="$(cut -d ' ' -f 1 "linux-runtime-tarball/$TARBALL_NAME.sha256")"
          if [ "$served_sha256" != "$built_sha256" ]; then
            echo "::error::$GET_TATOLAB_COM_URL serves a $TARBALL_NAME whose sha256 is $served_sha256, not the $built_sha256 built"
            exit 1
          fi
          curl -fsSL "$GET_TATOLAB_COM_URL/install.sh" | cmp - installer/install.sh
